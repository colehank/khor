[workspace]
resolver = "2"
members = [
    "crates/acp",
    "crates/core",
    "crates/catalog",
    "crates/detect",
    "crates/net",
    "crates/sync",
    "crates/node",
    "crates/cli",
    "apps/gui/core",
    "apps/gui/src-tauri",
]

[workspace.package]
# Kept equal to the release tag — the CI gate in `.github/workflows`
# refuses a tag that disagrees. Before that gate this number sat at
# 0.1.0 through five releases, which is the failure it exists to stop:
# a version that never moves cannot answer "which machine is behind",
# and that is the only question anybody asks a version for.
version = "0.1.5"
edition = "2024"

[workspace.dependencies]
khor-core = { path = "crates/core" }
khor-catalog = { path = "crates/catalog" }
khor-detect = { path = "crates/detect" }
khor-net = { path = "crates/net" }
khor-sync = { path = "crates/sync" }
khor-node = { path = "crates/node" }
gethostname = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
blake3 = "1"
# `preserve_order` because khor edits a file it does not own: claude's
# settings.json. Without it a `Value` round trip is a BTreeMap, and
# adding one hook would silently re-alphabetise fourteen top-level keys
# of somebody's configuration — a diff that is all khor's and says
# nothing khor meant.
serde_json = { version = "1", features = ["preserve_order"] }
rmp-serde = "1"
# Document CRDT, not a live protocol: increments are bytes that can land as
# files, so dumb nodes (ssh-only, no process) can carry them.
loro = "1.13"
base64 = "0.22"
iroh = "1.0"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# The live kind's wrapper needs real job control (tcsetpgrp): the child
# must own the terminal so Ctrl-C reaches it and not the record-keeper.
libc = "0.2"
# PTY allocation for the persistent host, one API on every desktop OS
# (openpty on POSIX, ConPTY on Windows). Compiled in — the product
# expects no user-installed dependency, tmux included (docs/SESSION.md).
portable-pty = "0.9"
# The process table, one API on every desktop OS. Discovery needs it for
# two things a vendor's files cannot answer: whether the process behind a
# session is still running, and — for vendors that write no pid anywhere
# — which sessions exist at all (crates/node/src/adaptor).
#
# `disk` on top of `system` because vitals report how full a machine is
# (crates/node/src/vitals.rs). Still not `default`: `network`, `user` and
# `component` are three more platform surfaces khor never asks about, and
# `component` alone drags in the whole objc2 IOKit stack on macOS.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
# GPU use on macOS, read out of IOKit's registry in-process.
# `ioreg -r -d 1 -c IOAccelerator` is these two calls with a printer on
# the end, and khor makes the calls instead: a gauge refreshed every few
# seconds does not justify spawning a process to read it, and the other
# route — `powermetrics` — wants root. Between them they carry
# core-foundation-sys, mach2 and libc, all of which were already here.
io-kit-sys = "0.5"
core-foundation = "0.10"
# GPU use on Linux with NVIDIA hardware. NVML is loaded at run time with
# `libloading`, so khor links against nothing: on a machine with no
# driver the load fails and the field stays absent, which is the same
# answer khor gives for a machine with no GPU at all. **A vendor's own
# shared library is not an external command** — the thing khor promises
# not to need is something the user had to install.
nvml-wrapper = "0.12"
# Civil dates in the machine's own time zone, for `khor_node::usage`: a
# vendor stamps its files in UTC and a person's "today" is local, so the
# bucket a token lands in is a function of the instant *and* the zone —
# daylight saving means one fixed offset would misfile a night's work
# twice a year.
#
# **It costs no new package**: `serde_with` already pulled jiff into this
# tree, so naming it here added exactly one line to Cargo.lock. Measured
# on its own it is two crates (jiff + jiff-core) with `tz-system`; chrono,
# the other candidate, is three and reads the zone through `localtime_r`,
# whose documented race with `setenv` khor would then own.
# License: Unlicense OR MIT (checked before use, not after).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
# A terminal screen, in memory, for the PTY fallback (crates/detect).
# **A prerequisite, not a refinement**: the patterns this family matches
# describe what is on a screen *now*, and the host's replay ring is a
# byte log with no "now" in it — "esc to interrupt" that scrolled past an
# hour ago still matches a substring search forever. Cursor-addressed
# redraws rule out reading the tail instead, and the proof is upstream's
# own: ccmanager reads xterm's rendered buffer and *still* needs a pass
# to drop redraw fragments.
#
# vt100 rather than alacritty_terminal, which is the candidate already
# named for the GUI's terminal-drawing batch: picking it here would
# settle that batch's choice on its behalf, and this one wants strictly
# less — a grid to feed bytes into and read lines back out of.
#
# Measured cost of naming it: **three packages** (vt100, vte,
# unicode-width) — counted off the Cargo.lock diff, not estimated.
# License: MIT (checked before use, not after).
vt100 = "0.16"
# Patterns for that same table. Several rules are genuinely regular
# expressions upstream — a spinner glyph followed by a "…ing" label, a
# numbered "deny (esc)" option — and rewriting them as hand-rolled
# scanning would fork the one thing this table exists to copy verbatim.
# **Already in the lock file** by way of the iroh/tracing side of the
# tree, so naming it here costs no new package.
# License: MIT OR Apache-2.0 (checked before use, not after).
regex = "1"
# Reads the pattern table at build time only, never at run time — same
# arrangement as khor-catalog's zh.toml, and for the same reason: a
# table that cannot be parsed should stop a build, not a user's session.
# Already in the lock file (khor-catalog build-depends on it), so this
# costs no new package either.
# License: MIT OR Apache-2.0 (checked before use, not after).
toml = "0.8"
tracing = "0.1"

# The release profile exists for one measured reason: **the install
# path is a download over a slow link.** From the machines this ships
# to, the asset came down at ~95 KB/s — a 29.7 MB binary is five
# minutes of somebody watching a progress bar, and the first thing a
# new machine does is watch it.
#
# `strip` is the big one (debug symbols are most of that number), `lto`
# and one codegen unit buy the rest and cost only CI time, which is
# nobody's afternoon.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
