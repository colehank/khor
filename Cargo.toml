[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/catalog",
    "crates/net",
    "crates/sync",
    "crates/node",
    "crates/cli",
    "apps/gui/core",
    "apps/gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
khor-core = { path = "crates/core" }
khor-catalog = { path = "crates/catalog" }
khor-net = { path = "crates/net" }
khor-sync = { path = "crates/sync" }
khor-node = { path = "crates/node" }
gethostname = "1"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
blake3 = "1"
serde_json = "1"
rmp-serde = "1"
# Document CRDT, not a live protocol: increments are bytes that can land as
# files, so dumb nodes (ssh-only, no process) can carry them.
loro = "1.13"
base64 = "0.22"
iroh = "1.0"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# The live kind's wrapper needs real job control (tcsetpgrp): the child
# must own the terminal so Ctrl-C reaches it and not the record-keeper.
libc = "0.2"
# PTY allocation for the persistent host, one API on every desktop OS
# (openpty on POSIX, ConPTY on Windows). Compiled in — the product
# expects no user-installed dependency, tmux included (docs/SESSION.md).
portable-pty = "0.9"
# The process table, one API on every desktop OS. Discovery needs it for
# two things a vendor's files cannot answer: whether the process behind a
# session is still running, and — for vendors that write no pid anywhere
# — which sessions exist at all (crates/node/src/adaptor).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tracing = "0.1"
