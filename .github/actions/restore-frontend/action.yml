name: Restore the verified frontend
description: Reuse this run's frontend without regenerating or rebuilding it
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: frontend
        path: frontend
    - shell: bash
      run: |
        python3 scripts/release_manifest.py verify --root frontend
        mkdir -p apps/gui/src
        cp -R frontend/dist apps/gui/dist
        cp -R frontend/gen apps/gui/src/gen
        if test -f frontend/lab-world.generated.json; then
          mkdir -p apps/gui/dev/lab/data
          cp frontend/lab-world.generated.json apps/gui/dev/lab/data/world.generated.json
        fi
