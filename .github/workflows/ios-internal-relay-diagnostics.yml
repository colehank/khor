name: iOS internal relay diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-internal-relay-diagnostics
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 120
    environment: apple-testflight
    env:
      SOURCE: a06b724d381f14879da04c9b97fe8b5c2ef3fa1b
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE }}
          path: product
          persist-credentials: false
      - name: Verify diagnostic source and device SDK check
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          gh api 'repos/colehank/khor/actions/runs/44885667798' --jq '[.head_sha,.event,.path,.conclusion]|@tsv' > "$RUNNER_TEMP/ios-verification"
          printf '%s\tpush\t.github/workflows/verify-ios-relay-diagnostics.yml\tsuccess\n' db9f5c7facf6215dffdc0755d3432db30791446c > "$RUNNER_TEMP/expected-verification"
          cmp "$RUNNER_TEMP/expected-verification" "$RUNNER_TEMP/ios-verification"
          python3 scripts/release_manifest.py build-env
          sudo xcode-select -s /Applications/Xcode_26.5.app
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product
          key: ios-relay-diagnostics
          cache-targets: false
          save-if: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: product/apps/gui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify Apple recognizes the solo testing audience
        working-directory: product
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: python3 ../scripts/ios_internal_relay_diagnostics.py check-audience
      - name: Build the diagnostic's frontend
        working-directory: product
        env:
          VITE_KHOR_DIRECTORY_TIMING: '1'
        run: |
          npm ci --prefix apps/gui
          npm run build --prefix apps/gui
      - name: Build and sign the diagnostic archive
        working-directory: product
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: python3 ../scripts/ios_internal_relay_diagnostics.py archive
      - name: Upload only to internal TestFlight and confirm availability
        working-directory: product
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: python3 ../scripts/ios_internal_relay_diagnostics.py upload
