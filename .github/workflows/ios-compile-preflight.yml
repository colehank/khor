name: iOS compile preflight
on:
  push:
    branches: [verify/ios-rustix-compile]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'
jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
  ios-compile:
    needs: frontend
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/restore-frontend
      - uses: ./.github/actions/native-tools
        with:
          target: aarch64-apple-ios
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Check the iPhone app target with its locked release dependencies
        shell: bash
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          cargo check --locked -p khor-gui --target aarch64-apple-ios --features tauri/custom-protocol --lib
