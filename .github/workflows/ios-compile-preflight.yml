name: iOS archive preflight
on:
  push:
    branches: [verify/ios-rustix-compile]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  # This unsigned archive exercises the native link. Candidate builds use the shipping profile.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_RELEASE_LTO: 'false'
jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
  ios-archive:
    needs: frontend
    runs-on: macos-26
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/restore-frontend
      - uses: ./.github/actions/native-tools
        with:
          target: aarch64-apple-ios
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: npm ci --prefix apps/gui
      - name: Archive the complete iPhone app without signing or uploading
        run: python3 scripts/apple_release.py ios-build --signed false
      - name: Verify the resolved system library in the archived executable
        shell: bash
        run: |
          app=apps/gui/src-tauri/gen/apple/build/khor-gui_iOS.xcarchive/Products/Applications/Khor.app/Khor
          test -f "$app"
          test "$(xcrun lipo -archs "$app")" = arm64
          xcrun otool -L "$app" | grep -F /usr/lib/libresolv.9.dylib
