name: Windows desktop validation

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Windows validation run ID whose existing MSI should be tested again
        type: string
      previous_package_run:
        description: Earlier Windows package run to install before testing the upgrade
        type: string
      native_drag:
        description: Send a real Windows file drag when replaying an installed package
        type: boolean
        default: false
      desktop_parity:
        description: Verify system text scaling and native file handoff with the installed MSI
        type: boolean
        default: false
      windows_backdrop:
        description: Verify the installed App's Windows compositor backdrop without WebView debugging
        type: boolean
        default: false
      legacy_shell_ui:
        description: Replay the Windows shell picker from before shell-aware attachments
        type: boolean
        default: false
      shell_selection:
        description: Scope the shell picker when replaying a known installer fixture
        type: choice
        default: all
        options: [all, cmd, powershell]
      acp_fixture:
        description: Replay the scripted ACP agent from the same installer build
        type: boolean
        default: false
      retry_runner:
        description: Runner for testing an existing MSI
        type: choice
        default: windows-2025
        options: [windows-2025, windows-2022]
  push:
    branches: ['verify/windows-desktop-*']

permissions:
  contents: read
  actions: read

concurrency:
  # Manually requested checks pin a revision. Branch pushes can replace stale checks.
  group: windows-desktop-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}-${{ inputs.package_run || 'build' }}-${{ inputs.previous_package_run || 'fresh' }}-${{ inputs.retry_runner || 'default' }}-${{ inputs.windows_backdrop || false }}
  cancel-in-progress: true

jobs:
  frontend:
    if: ${{ !inputs.package_run }}
    uses: ./.github/workflows/frontend.yml
  windows:
    needs: frontend
    uses: ./.github/workflows/windows-desktop.yml
  existing-package:
    if: ${{ inputs.package_run != '' }}
    runs-on: ${{ inputs.retry_runner || 'windows-2025' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: khor-windows-x86_64-app
          path: desktop-product
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - if: ${{ inputs.previous_package_run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: khor-windows-x86_64-app
          path: previous-product
          run-id: ${{ inputs.previous_package_run }}
          github-token: ${{ github.token }}
      - if: ${{ inputs.acp_fixture }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-acp-fixture-windows-x86-64
          path: desktop-fixtures
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
      - run: npm ci --prefix apps/gui
      - name: Verify the existing MSI and native interaction
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          PREVIOUS_PACKAGE_RUN: ${{ inputs.previous_package_run }}
          NATIVE_DRAG: ${{ inputs.native_drag }}
          DESKTOP_PARITY: ${{ inputs.desktop_parity }}
          WINDOWS_BACKDROP: ${{ inputs.windows_backdrop }}
          LEGACY_SHELL_UI: ${{ inputs.legacy_shell_ui }}
          SHELL_SELECTION: ${{ inputs.shell_selection }}
          ACP_FIXTURE: ${{ inputs.acp_fixture }}
        run: |
          $source = gh run view $env:PACKAGE_RUN --repo $env:GITHUB_REPOSITORY --json headSha --jq .headSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_manifest.py verify --root desktop-product --sha $source --run-id $env:PACKAGE_RUN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installerArgs = @("--package", "desktop-product/khor-windows-x86_64.msi", "--output", "$env:RUNNER_TEMP/installation.json", "--expected-source", $source)
          if ($env:PREVIOUS_PACKAGE_RUN) {
            $previous = gh run view $env:PREVIOUS_PACKAGE_RUN --repo $env:GITHUB_REPOSITORY --json headSha --jq .headSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/release_manifest.py verify --root previous-product --sha $previous --run-id $env:PREVIOUS_PACKAGE_RUN
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $installerArgs += @("--upgrade-from", "previous-product/khor-windows-x86_64.msi", "--upgrade-source", $previous)
          }
          if ($env:NATIVE_DRAG -eq "true") {
            $installerArgs += "--native-drag"
          }
          if ($env:DESKTOP_PARITY -eq "true") {
            $installerArgs += "--desktop-parity"
          }
          if ($env:WINDOWS_BACKDROP -eq "true") {
            $installerArgs += "--windows-backdrop"
          }
          if ($env:LEGACY_SHELL_UI -eq "true") {
            $installerArgs += "--legacy-shell-ui"
          }
          if ($env:SHELL_SELECTION -and $env:SHELL_SELECTION -ne "all") {
            $installerArgs += @("--shell-selection", $env:SHELL_SELECTION)
          }
          if ($env:ACP_FIXTURE -eq "true") {
            $installerArgs += @("--acp-fixture", "desktop-fixtures/acp-stub.exe")
          }
          python scripts/check-desktop-installer.py @installerArgs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-installer-retry-evidence
          path: |
            ${{ runner.temp }}/installation.json
            ${{ runner.temp }}/khor-installer-logs/*.log
          if-no-files-found: warn
          retention-days: 14
