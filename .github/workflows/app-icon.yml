name: App icon

on:
  push:
    paths:
      - 'apps/gui/dev/icon-lab/**'
      - 'apps/gui/src-tauri/icons/**'
      - 'apps/gui/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/app_icon.py'
      - 'scripts/requirements-app-icon.txt'
      - 'scripts/tests/test_app_icon.py'
      - 'scripts/mac_icon.py'
      - '.github/workflows/app-icon.yml'
  pull_request:
    paths:
      - 'apps/gui/dev/icon-lab/**'
      - 'apps/gui/src-tauri/icons/**'
      - 'apps/gui/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/*app_icon*'
      - 'scripts/requirements-app-icon.txt'
      - 'scripts/tests/test_app_icon.py'
      - 'scripts/mac_icon.py'
      - '.github/workflows/app-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - run: python3 -m pip install -r scripts/requirements-app-icon.txt
      - run: npm ci --prefix apps/gui/dev/icon-lab
      - run: npm run check --prefix apps/gui/dev/icon-lab
      - run: npm test --prefix apps/gui/dev/icon-lab
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/app-icon.yml .github/workflows/quality.yml
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/app_icon.py check
  native-catalog:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: python3 -m pip install --break-system-packages -r scripts/requirements-app-icon.txt
      - run: python3 scripts/mac_icon.py compile --output "${{ runner.temp }}/khor-icon"
      - name: Compile iPhone and iPad icon catalog
        run: |
          mkdir -p "$RUNNER_TEMP/khor-icon/ios"
          xcrun actool apps/gui/src-tauri/gen/apple/Assets.xcassets --compile "$RUNNER_TEMP/khor-icon/ios" --platform iphoneos --minimum-deployment-target 15.0 --target-device iphone --target-device ipad --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/khor-icon/ios/Info.plist"
      - name: Record compiled icon inventories
        run: |
          xcrun assetutil --info "$RUNNER_TEMP/khor-icon/Assets.car" > "$RUNNER_TEMP/khor-icon/macos-assets.json"
          xcrun assetutil --info "$RUNNER_TEMP/khor-icon/ios/Assets.car" > "$RUNNER_TEMP/khor-icon/ios-assets.json"
      - name: Verify original dark artwork in both native appearances
        run: |
          ICTOOL="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          for platform in macOS iOS; do
            for rendition in Default Dark; do
              "$ICTOOL" apps/gui/src-tauri/icons/Icon.icon --export-image --output-file "$RUNNER_TEMP/khor-icon/$platform-$rendition.png" --platform "$platform" --rendition "$rendition" --width 1024 --height 1024 --scale 1
            done
          done
          python3 - "$RUNNER_TEMP/khor-icon" <<'PY'
          from pathlib import Path
          import json, sys
          from PIL import Image, ImageStat
          root = Path(sys.argv[1])
          for platform in ['macOS', 'iOS']:
              means = []
              for rendition in ['Default', 'Dark']:
                  with Image.open(root / f'{platform}-{rendition}.png') as image:
                      assert image.size == (1024, 1024)
                      means.append(sum(ImageStat.Stat(image.convert('RGB').crop((256, 256, 768, 768))).mean) / 3)
              assert all(40 < value < 120 for value in means), (platform, means)
              assert abs(means[0] - means[1]) < 10, (platform, means)
              print(platform, 'uses the original dark artwork in Default and Dark', means)
          mac = json.loads((root / 'macos-assets.json').read_text())
          stacks = {entry.get('Appearance') for entry in mac if entry.get('AssetType') == 'IconImageStack'}
          assert {'NSAppearanceNameAqua', 'NSAppearanceNameDarkAqua'} <= stacks, stacks
          ios = json.loads((root / 'ios-assets.json').read_text())
          assert any(entry.get('AssetType') == 'Icon Image' and entry.get('Name') == 'AppIcon'
                     for entry in ios), 'Missing compiled iOS app icon'
          print('Compiled Apple catalogs retain the single original dark artwork')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-icon-catalog
          path: ${{ runner.temp }}/khor-icon
          if-no-files-found: error
          retention-days: 7
