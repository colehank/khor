name: App icon

on:
  push:
    paths:
      - 'apps/gui/dev/icon-lab/**'
      - 'apps/gui/src-tauri/icons/**'
      - 'apps/gui/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/app_icon.py'
      - 'scripts/requirements-app-icon.txt'
      - 'scripts/tests/test_app_icon.py'
      - '.github/workflows/app-icon.yml'
  pull_request:
    paths:
      - 'apps/gui/dev/icon-lab/**'
      - 'apps/gui/src-tauri/icons/**'
      - 'apps/gui/src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/**'
      - 'scripts/*app_icon*'
      - 'scripts/requirements-app-icon.txt'
      - 'scripts/tests/test_app_icon.py'
      - '.github/workflows/app-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - run: python3 -m pip install -r scripts/requirements-app-icon.txt
      - run: node --test apps/gui/dev/icon-lab/renderer.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_app_icon.py'
      - run: python3 scripts/app_icon.py check
  native-catalog:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: python3 scripts/mac_icon.py compile --output "${{ runner.temp }}/khor-icon"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-icon-catalog
          path: ${{ runner.temp }}/khor-icon
          if-no-files-found: error
          retention-days: 7
