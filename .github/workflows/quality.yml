name: Quality
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  ios-terminal-keyboard:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          run-id: 45548963386
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-frontend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Build the exact frontend fixture for this verification branch
        run: |
          cp -R "$RUNNER_TEMP/verified-frontend/gen" apps/gui/src/gen
          cp "$RUNNER_TEMP/verified-frontend/lab-world.generated.json" apps/gui/dev/lab/data/world.generated.json
          npm ci --prefix apps/gui
          (cd apps/gui && npx vite build --config dev/lab/vite.config.ts --outDir "$RUNNER_TEMP/terminal-keyboard-lab/developer-lab")
          python3 - <<'EOF'
          import json, os, pathlib, subprocess
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'terminal-keyboard-lab/developer-lab'
          def git(ref): return subprocess.check_output(('git', 'rev-parse', ref), text=True).strip()
          (bundle / 'lab-manifest.json').write_text(json.dumps(dict(schema=1, entry='production-app',
              tree=git('HEAD^{tree}'), snapshot_commit=git('HEAD'))))
          EOF
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-sim
      - name: Build the production paste control for the keyboard probe
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        run: |
          paste_target="$RUNNER_TEMP/native-paste"
          cargo build --locked --manifest-path apps/gui/scripts/native-keyboard-probe/paste-fixture/Cargo.toml \
            --target aarch64-apple-ios-sim --target-dir "$paste_target"
          echo "KHOR_PASTE_PROBE_LIB=$paste_target/aarch64-apple-ios-sim/debug/libterminal_paste_probe.a" >> "$GITHUB_ENV"
      - name: Tap the terminal and swap the actual iOS keyboard with attachments
        run: |
          test "$(uname -m)" = arm64
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          PYTHONPATH=scripts python3 -m khor_lab.terminal_keyboard_probe --simulator "$SIMULATOR_ID" \
            "$RUNNER_TEMP/terminal-keyboard-lab/developer-lab" --out "$RUNNER_TEMP/terminal-keyboard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-terminal-keyboard
          path: |
            ${{ runner.temp }}/terminal-keyboard/*keyboard*.json
            ${{ runner.temp }}/terminal-keyboard/terminal-keyboard.png
            ${{ runner.temp }}/terminal-keyboard/appium.log
          if-no-files-found: warn
          retention-days: 7
