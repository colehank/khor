    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: ./.github/actions/restore-frontend
      - run: npm ci --prefix apps/gui
      - shell: bash
        working-directory: apps/gui
        run: npx playwright-core install --with-deps chromium webkit
      - name: Reproduce every Khor reading-position scenario
        working-directory: apps/gui
        env:
          QUALITY_ONLY: chat-khor
          QUALITY_ENGINES: chrome,webkit
          QUALITY_HEADLESS: '1'
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          QUALITY_OUT: ${{ runner.temp }}/khor-scroll
        run: npm run scroll-lifecycle
      - name: Export the final formatter patch
        if: always()
        run: cargo fmt --all && git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
