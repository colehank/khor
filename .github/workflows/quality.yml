name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_frontend:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  frontend:
    if: ${{ !inputs.reuse_frontend }}
    uses: ./.github/workflows/frontend.yml
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: python3 scripts/check-rust-format.py --check
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: node scripts/check-native-io.mjs

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - run: npm ci
        working-directory: apps/agent
      - run: npm test
        working-directory: apps/agent

  node-native:
    needs: frontend
    if: ${{ !cancelled() && (needs.frontend.result == 'success' || inputs.reuse_frontend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Set the private native build directory
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/khor-quality-target" >> "$GITHUB_ENV"
          echo "KHOR_TEST_MCP_EXECUTABLE=$RUNNER_TEMP/khor-quality-target/debug/khor" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-node-native
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
        working-directory: apps/gui
      - uses: ./.github/actions/restore-frontend
      - run: sudo apt-get update && sudo apt-get install -y tmux openssh-server
      - run: sudo mkdir -p /run/sshd
      - run: npm ci
        working-directory: apps/agent
      - name: Snapshot the actual Cargo graph and prepare the normal worker
        run: |
          native_host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$native_host"
          cargo metadata --locked --format-version 1 --filter-platform "$native_host" > "${{ runner.temp }}/node-metadata.json"
          python3 scripts/native_provenance.py prepare --metadata "${{ runner.temp }}/node-metadata.json" --target-dir "$CARGO_TARGET_DIR" --package khor-cli --name khor --kind bin --tool "$(rustup which cargo)" --tool "$(rustup which rustc)" --apply-refresh --output "${{ runner.temp }}/cli-prepared.json"
      - run: cargo build --locked -p khor-cli --bin khor --message-format=json > "${{ runner.temp }}/cli-artifacts.json"
      - name: Verify the normal worker and prepare the isolated acceptance binary
        run: |
          python3 scripts/native_provenance.py verify --prepared "${{ runner.temp }}/cli-prepared.json" --artifacts "${{ runner.temp }}/cli-artifacts.json" --output "${{ runner.temp }}/cli-provenance.json"
          python3 scripts/native_provenance.py prepare --metadata "${{ runner.temp }}/node-metadata.json" --target-dir "$CARGO_TARGET_DIR" --package khor-node --name khor_node --kind lib --test --tool "$(rustup which cargo)" --tool "$(rustup which rustc)" --prior "${{ runner.temp }}/cli-provenance.json" --apply-refresh --output "${{ runner.temp }}/node-prepared.json"
      - run: cargo test --locked -p khor-node --lib --no-run --message-format=json > "${{ runner.temp }}/node-artifacts.json"
      - run: python3 scripts/native_provenance.py verify --prepared "${{ runner.temp }}/node-prepared.json" --artifacts "${{ runner.temp }}/node-artifacts.json" --output "${{ runner.temp }}/node-provenance.json"
      - name: Run each agent close acceptance test in its own process
        run: python3 scripts/run-node-acceptance.py --suite runtime-close --artifacts "${{ runner.temp }}/node-artifacts.json" --provenance "${{ runner.temp }}/node-provenance.json" --worker-provenance "${{ runner.temp }}/cli-provenance.json" --output "${{ runner.temp }}/node-native-close"
      - name: Verify keeper adoption and SSH installation in scratch homes
        run: |
          cargo test --locked -p khor-node --lib join:: -- --test-threads=1
          cargo test --locked -p khor-core -p khor-node --lib activity -- --test-threads=1
          cargo test --locked -p khor-node --lib gui_run_rejects_old_and_unqualified_reports -- --test-threads=1
          cargo test --locked -p khor-cli --test serve_keeper --test add_ssh -- --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-native-close-evidence
          path: |
            ${{ runner.temp }}/node-artifacts.json
            ${{ runner.temp }}/node-metadata.json
            ${{ runner.temp }}/cli-artifacts.json
            ${{ runner.temp }}/*-prepared.json
            ${{ runner.temp }}/*-provenance.json
            ${{ runner.temp }}/node-native-close
          if-no-files-found: warn

  gui:
    needs: frontend
    if: ${{ !cancelled() && (needs.frontend.result == 'success' || inputs.reuse_frontend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-gen
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/restore-frontend
      - run: npm run test:unit && npm run test:types
      - run: npm run gates && npm run mobile:static
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Run every interaction group and retain all failures
        run: |
          failed=0
          for gate in lock-state ai-elements scroll-lifecycle scroll-compose editor-overwrite chat-poll chat-cancel page-retention-ui native-events native-helpers chat-recovery workspace-content-ui terminal-links-ui notification-ui; do
            echo "::group::$gate"
            if timeout --kill-after=10s 8m npm run "$gate"; then
              echo "$gate passed"
            else
              result=$?
              echo "::error::$gate failed (exit $result)"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          KHOR_TEST_FRONTEND: dist
          QUALITY_ENGINES: chrome,webkit
          QUALITY_HEADLESS: '1'
          EDITOR_OVERWRITE_WEBKIT: '1'
          CHAT_POLL_WEBKIT: '1'
          CHAT_CANCEL_WEBKIT: '1'
          CHAT_RECOVERY_WEBKIT: '1'
          CHAT_RECOVERY_CHECK_DIR: ${{ runner.temp }}/quality-chat-recovery
          COMPOSE_OUT: ${{ runner.temp }}/quality-compose
          NATIVE_HELPERS_CHECK_DIR: ${{ runner.temp }}/quality-native-helpers
          NATIVE_EVENTS_CHECK_DIR: ${{ runner.temp }}/quality-native-events
          CHAT_CANCEL_CHECK_DIR: ${{ runner.temp }}/quality-chat-cancel
          PAGE_RETENTION_UI_OUT: ${{ runner.temp }}/quality-pages
          CHAT_POLL_CHECK_DIR: ${{ runner.temp }}/quality-chat-poll
          EDITOR_OVERWRITE_CHECK_DIR: ${{ runner.temp }}/quality-overwrite
          QUALITY_OUT: ${{ runner.temp }}/quality-scroll
          AI_ELEMENTS_OUT: ${{ runner.temp }}/quality-elements
          WORKSPACE_CONTENT_DIR: ${{ runner.temp }}/quality-workspace
          TERMINAL_LINK_UI_DIR: ${{ runner.temp }}/quality-terminal-links
          NOTIFICATION_UI_DIR: ${{ runner.temp }}/quality-notifications
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-interaction-evidence
          path: |
            ${{ runner.temp }}/quality-scroll
            ${{ runner.temp }}/quality-elements
            ${{ runner.temp }}/quality-overwrite
            ${{ runner.temp }}/quality-chat-poll
            ${{ runner.temp }}/quality-chat-cancel
            ${{ runner.temp }}/quality-chat-recovery
            ${{ runner.temp }}/quality-pages
            ${{ runner.temp }}/quality-native-events
            ${{ runner.temp }}/quality-native-helpers
            ${{ runner.temp }}/quality-compose
            ${{ runner.temp }}/quality-workspace
            ${{ runner.temp }}/quality-terminal-links
            ${{ runner.temp }}/quality-notifications
          if-no-files-found: warn

  windows-agent-process:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify owned processes and cancellable pipes on Windows
        shell: pwsh
        run: |
          cargo run --locked --manifest-path crates/node/tests/windows-process-harness/Cargo.toml *> "$env:RUNNER_TEMP/agent-process.log"
          $processCheckExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/agent-process.log"
          exit $processCheckExit
      - name: Verify bounded GUI socket writers on Windows
        shell: pwsh
        run: |
          rustc --edition=2024 --test crates/node/tests/fanout_harness.rs -o "$env:RUNNER_TEMP/gui-fanout-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/gui-fanout-tests.exe" --nocapture --test-threads=1 *> "$env:RUNNER_TEMP/gui-fanout.log"
          $fanoutCheckExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/gui-fanout.log"
          exit $fanoutCheckExit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-agent-process-evidence
          path: |
            ${{ runner.temp }}/agent-process.log
            ${{ runner.temp }}/gui-fanout.log
          if-no-files-found: warn
