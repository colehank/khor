name: Quality

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        default: node
      interaction_scope:
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  real-terminals:
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: terminal-draft-cli-macos-arm64
          path: native
          github-token: ${{ github.token }}
          run-id: 44666606037
      - name: Verify source and binary before running the isolated test
        run: |
          source=a9bb098db6a3f13d369f2328cf68f228cfc52221
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/quality.yml' ':(exclude)scripts/verify_terminal_agent_drafts.py'
          test "$(cat native/source.txt)" = "$source"
          test "$(shasum -a 256 native/khor | awk '{print $1}')" = "$(cat native/sha256.txt)"
          chmod 700 native/khor
      - name: Test real Codex and Claude Code on two paired local nodes
        run: |
          npm install --prefix "$RUNNER_TEMP/agents" --no-package-lock --no-audit --no-fund @openai/codex@0.170.0 @anthropic-ai/claude-code@2.1.321
          export PATH="$RUNNER_TEMP/agents/node_modules/.bin:$PATH"
          python3 scripts/verify_terminal_agent_drafts.py native/khor --peer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: real-terminal-draft-checks
          path: scripts/native-draft-checks.json
          if-no-files-found: warn
          retention-days: 2
