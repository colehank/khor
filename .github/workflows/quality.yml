name: Quality

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        default: node
      interaction_scope:
        type: string
        default: all

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  KHOR_DRAFT_SOURCE: a9bb098db6a3f13d369f2328cf68f228cfc52221
  KHOR_DRAFT_FRONTEND_SOURCE: 2089acb44f278b1e9470f96eda709d4af5e3ee07

jobs:
  sample-mac:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: frontend
          github-token: ${{ github.token }}
          run-id: 44665531216
      - name: Restore the frontend from the prior candidate with identical UI sources
        run: |
          git diff --exit-code "$KHOR_DRAFT_FRONTEND_SOURCE" "$KHOR_DRAFT_SOURCE" -- apps/gui crates/catalog
          python3 scripts/release_manifest.py verify --root frontend --sha "$KHOR_DRAFT_FRONTEND_SOURCE"
          cp -R frontend/dist apps/gui/dist
          cp -R frontend/gen apps/gui/src/gen
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-execution
          cache-targets: false
          save-if: false
      - name: Build the draft candidate for disposable terminal tests
        run: |
          source=$KHOR_DRAFT_SOURCE
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/quality.yml'
          git diff --exit-code HEAD -- . ':(exclude)apps/gui/dev/lab/data/world.generated.json'
          cargo build --locked -p khor-cli --bin khor
          mkdir -p "$RUNNER_TEMP/terminal-draft-cli"
          cp target/debug/khor "$RUNNER_TEMP/terminal-draft-cli/"
          echo "$source" > "$RUNNER_TEMP/terminal-draft-cli/source.txt"
          shasum -a 256 "$RUNNER_TEMP/terminal-draft-cli/khor" | awk '{print $1}' > "$RUNNER_TEMP/terminal-draft-cli/sha256.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-draft-cli-macos-arm64
          path: ${{ runner.temp }}/terminal-draft-cli
          if-no-files-found: error
          retention-days: 2
