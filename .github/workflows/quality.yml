name: Quality
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_frontend:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-gen
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: frontend
          run-id: 41446458619
          github-token: ${{ github.token }}
      - name: Reuse unchanged generated bindings for source-based browser diagnostics
        working-directory: .
        run: |
          python3 scripts/release_manifest.py verify --root frontend --sha 5747944cc5543e45ee8f9f0a63657a3792fd415e --kind frontend --run-id 41446458619
          cp -R frontend/gen apps/gui/src/gen
      - run: npm run test:unit && npm run test:types
      - run: npm run gates && npm run mobile:static
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Diagnose only the three rc.2 GUI failures
        run: |
          failed=0
          for sample in 1 2 3; do
            export QUALITY_OUT="$RUNNER_TEMP/quality-scroll/sample-$sample"
            export CHAT_RECOVERY_CHECK_DIR="$RUNNER_TEMP/quality-chat-recovery/sample-$sample"
            for gate in scroll-lifecycle chat-recovery; do
              if timeout --kill-after=10s 5m npm run "$gate" > "$RUNNER_TEMP/$gate-$sample.log" 2>&1; then
                echo "$gate sample $sample passed"
              else
                echo "::error::$gate sample $sample failed"
                tail -60 "$RUNNER_TEMP/$gate-$sample.log"
                failed=1
              fi
            done
          done
          exit "$failed"
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          QUALITY_ENGINES: chrome,webkit
          QUALITY_HEADLESS: '1'
          EDITOR_OVERWRITE_WEBKIT: '1'
          CHAT_POLL_WEBKIT: '1'
          CHAT_CANCEL_WEBKIT: '1'
          CHAT_RECOVERY_WEBKIT: '1'
          CHAT_RECOVERY_CHECK_DIR: ${{ runner.temp }}/quality-chat-recovery
          COMPOSE_OUT: ${{ runner.temp }}/quality-compose
          NATIVE_HELPERS_CHECK_DIR: ${{ runner.temp }}/quality-native-helpers
          NATIVE_EVENTS_CHECK_DIR: ${{ runner.temp }}/quality-native-events
          CHAT_CANCEL_CHECK_DIR: ${{ runner.temp }}/quality-chat-cancel
          PAGE_RETENTION_UI_OUT: ${{ runner.temp }}/quality-pages
          CHAT_POLL_CHECK_DIR: ${{ runner.temp }}/quality-chat-poll
          EDITOR_OVERWRITE_CHECK_DIR: ${{ runner.temp }}/quality-overwrite
          QUALITY_OUT: ${{ runner.temp }}/quality-scroll
          AI_ELEMENTS_OUT: ${{ runner.temp }}/quality-elements
          WORKSPACE_CONTENT_DIR: ${{ runner.temp }}/quality-workspace
          TERMINAL_LINK_UI_DIR: ${{ runner.temp }}/quality-terminal-links
          NOTIFICATION_UI_DIR: ${{ runner.temp }}/quality-notifications
          QUALITY_ONLY: chat-khor-blur-restore-small-step,chat-acp-blur-restore-small-step
          CHAT_RECOVERY_SCENARIOS: idb-retries-and-shared-pages,directory-required-shell
          DEBUG: pw:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-interaction-evidence
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/quality-scroll
            ${{ runner.temp }}/quality-elements
            ${{ runner.temp }}/quality-overwrite
            ${{ runner.temp }}/quality-chat-poll
            ${{ runner.temp }}/quality-chat-cancel
            ${{ runner.temp }}/quality-chat-recovery
            ${{ runner.temp }}/quality-pages
            ${{ runner.temp }}/quality-native-events
            ${{ runner.temp }}/quality-native-helpers
            ${{ runner.temp }}/quality-compose
            ${{ runner.temp }}/quality-workspace
            ${{ runner.temp }}/quality-terminal-links
            ${{ runner.temp }}/quality-notifications
          if-no-files-found: warn

