name: Quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
      interaction_scope:
        type: string
permissions:
  contents: read
jobs:
  window-focus:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: |
          xcrun swiftc -swift-version 5 window_focus_diagnostic.swift -o "$RUNNER_TEMP/window-focus"
          "$RUNNER_TEMP/window-focus" > "$RUNNER_TEMP/window-focus.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: window-focus-diagnostic
          path: ${{ runner.temp }}/window-focus.json
