name: Session lifecycle focused verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      slice:
        type: choice
        options: [sync, delegation, installer]
        default: sync
permissions:
  contents: read
jobs:
  seen:
    if: inputs.slice == 'sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-focused
          save-if: 'false'
      - name: Complete sync crate regression
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test --locked -p khor-sync --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seen.log"
      - name: Export formatter patch for source-only editing
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: focused-seen
          path: |
            ${{ runner.temp }}/seen.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  delegation:
    if: inputs.slice == 'delegation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-delegation
          save-if: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: npm ci --prefix apps/gui
      - run: npm run build --prefix apps/gui
      - name: Exercise real ACP delegation, retirement and resume
        run: |
          set -euo pipefail
          git rev-parse HEAD
          export KHOR_RUNTIME_DIR="$RUNNER_TEMP/runtime-images"
          cargo build --locked -p khor-cli --bin khor
          cargo build --locked -p khor-acp --bin acp-stub
          export KHOR_TEST_MCP_EXECUTABLE="$PWD/target/debug/khor"
          export KHOR_TEST_ACP_STUB="$PWD/target/debug/acp-stub"
          cargo test --locked -p khor-node --lib a_real_delegated_acp_host_survives_the_worker_and_keeps_its_parent -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/delegation.log"
      - if: always()
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: delegation-evidence
          path: |
            ${{ runner.temp }}/delegation.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  installer:
    if: inputs.slice == 'installer'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: python3 scripts/check-mac-installer.py
