name: Quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
      interaction_scope:
        type: string
permissions:
  contents: read
jobs:
  loopback-network:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: python3 loopback_network_diagnostic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loopback-network-diagnostic
          path: ${{ runner.temp }}/loopback-diagnostic/results.json
