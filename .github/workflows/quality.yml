name: Quality

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  verify-linux-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: frontend
          run-id: 44681085253
          github-token: ${{ github.token }}
      - name: Confirm source and reuse the release frontend
        run: |
          git diff --exit-code 0597099fdd354db3896792b09736e3d9d37afb7f HEAD -- . ':(exclude).github/workflows/quality.yml'
          git diff --exit-code c99581b52a3ceee7f1aaaee9239a70bef779b33d HEAD -- apps/gui crates/catalog
          python3 scripts/release_manifest.py verify --root frontend --sha c99581b52a3ceee7f1aaaee9239a70bef779b33d
          cp -R frontend/dist apps/gui/dist
          cp -R frontend/gen apps/gui/src/gen
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-execution
          cache-targets: false
          save-if: false
      - name: Exercise the real binary through terminal close
        run: |
          cargo test --locked -p khor-cli --test open -- --test-threads=1
          for i in {1..8}; do
            cargo test --locked -p khor-cli --test open a_private_host_does_not_inherit_an_unrelated_native_agent_store -- --exact --test-threads=1
          done
