name: Quality

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope; releases always run the complete quality gate
        type: choice
        options: [all, agent, runtime, gui, node]
        default: all
  workflow_call:
    inputs:
      reuse_frontend:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  runtime-store:
    if: ${{ inputs.suite != 'node' && inputs.suite != 'gui' && inputs.suite != 'agent' }}
    uses: ./.github/workflows/runtime-store.yml
  frontend:
    if: ${{ inputs.suite != 'agent' && inputs.suite != 'runtime' && !inputs.reuse_frontend }}
    uses: ./.github/workflows/frontend.yml
  scripts:
    if: ${{ inputs.suite != 'gui' && inputs.suite != 'agent' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install the pinned workflow validator
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --location --silent --show-error https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz --output "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Run the same fast checks as local commits
        run: pipx run --spec pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-commit
        env:
          SKIP: khor-gui-types,khor-agent-types
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: node scripts/check-native-io.mjs

  mac-icon:
    if: ${{ inputs.suite != 'node' && inputs.suite != 'gui' && inputs.suite != 'agent' && inputs.suite != 'runtime' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Compile the actual macOS layered icon
        run: python3 scripts/mac_icon.py compile --output "${{ runner.temp }}/khor-icon"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-icon
          path: ${{ runner.temp }}/khor-icon
          if-no-files-found: error
          retention-days: 7

  mac-updates:
    needs: frontend
    if: ${{ inputs.suite != 'node' && inputs.suite != 'gui' && inputs.suite != 'agent' && inputs.suite != 'runtime' && !cancelled() && (needs.frontend.result == 'success' || inputs.reuse_frontend) }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-mac-updates
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/restore-frontend
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Verify native App update admission, rollback and component recovery
        shell: bash
        run: |
          cargo test --locked -p khor-gui --lib update -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/app-updates.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/app-updates.log"
          cargo test --locked -p khor-gui --lib app_companions -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/app-components.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/app-components.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-update-contracts
          path: ${{ runner.temp }}/app-*.log
          if-no-files-found: warn
          retention-days: 7

  agent:
    if: ${{ inputs.suite != 'node' && inputs.suite != 'gui' && inputs.suite != 'runtime' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm ci
        working-directory: apps/agent
      - name: Build the real standalone agent for cold-start tests
        run: node build.mjs x86_64-unknown-linux-gnu "${{ runner.temp }}/khor-agent"
        working-directory: apps/agent
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify the initialized standalone agent retains its inherited runtime image
        run: cargo test --locked -p khor-runtime actual_standalone_agent -- --ignored --nocapture --test-threads=1
        env:
          KHOR_TEST_AGENT_BIN: ${{ runner.temp }}/khor-agent
      - run: npm test
        working-directory: apps/agent
        env:
          KHOR_TEST_AGENT_BIN: ${{ runner.temp }}/khor-agent

  node-native:
    needs: frontend
    if: ${{ inputs.suite != 'gui' && inputs.suite != 'agent' && inputs.suite != 'runtime' && !cancelled() && (needs.frontend.result == 'success' || inputs.reuse_frontend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the private native build directory
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/khor-quality-target"
            echo "KHOR_TEST_MCP_EXECUTABLE=$RUNNER_TEMP/khor-quality-target/debug/khor"
            echo "KHOR_RUNTIME_DIR=$RUNNER_TEMP/runtime-images"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-node-native
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
        working-directory: apps/gui
      - uses: ./.github/actions/restore-frontend
      - run: sudo apt-get update && sudo apt-get install -y tmux openssh-server
      - run: sudo mkdir -p /run/sshd
      - run: npm ci
        working-directory: apps/agent
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Embed the real agent in the native worker and host fixtures
        run: |
          node build.mjs x86_64-unknown-linux-gnu "$RUNNER_TEMP/khor-agent"
          echo "KHOR_AGENT_BUNDLE=$RUNNER_TEMP/khor-agent" >> "$GITHUB_ENV"
        working-directory: apps/agent
      - name: Snapshot the actual Cargo graph and prepare the normal worker
        run: |
          native_host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$native_host"
          cargo metadata --locked --format-version 1 --filter-platform "$native_host" > "${{ runner.temp }}/node-metadata.json"
          python3 scripts/native_provenance.py prepare --metadata "${{ runner.temp }}/node-metadata.json" --target-dir "$CARGO_TARGET_DIR" --package khor-cli --name khor --kind bin --tool "$(rustup which cargo)" --tool "$(rustup which rustc)" --apply-refresh --output "${{ runner.temp }}/cli-prepared.json"
      - run: cargo build --locked -p khor-cli --bin khor --message-format=json > "${{ runner.temp }}/cli-artifacts.json"
      - name: Verify the normal worker and prepare the isolated acceptance binary
        run: |
          python3 scripts/native_provenance.py verify --prepared "${{ runner.temp }}/cli-prepared.json" --artifacts "${{ runner.temp }}/cli-artifacts.json" --output "${{ runner.temp }}/cli-provenance.json"
          python3 scripts/native_provenance.py prepare --metadata "${{ runner.temp }}/node-metadata.json" --target-dir "$CARGO_TARGET_DIR" --package khor-node --name khor_node --kind lib --test --tool "$(rustup which cargo)" --tool "$(rustup which rustc)" --prior "${{ runner.temp }}/cli-provenance.json" --apply-refresh --output "${{ runner.temp }}/node-prepared.json"
      - name: Verify the agent against the actual built CLI and standalone runtime
        run: npm test --prefix apps/agent
        env:
          KHOR_TEST_CLI_BIN: ${{ runner.temp }}/khor-quality-target/debug/khor
          KHOR_TEST_AGENT_BIN: ${{ runner.temp }}/khor-agent
      - run: cargo test --locked -p khor-node --lib --no-run --message-format=json > "${{ runner.temp }}/node-artifacts.json"
      - run: python3 scripts/native_provenance.py verify --prepared "${{ runner.temp }}/node-prepared.json" --artifacts "${{ runner.temp }}/node-artifacts.json" --output "${{ runner.temp }}/node-provenance.json"
      - name: Run each agent close acceptance test in its own process
        run: python3 scripts/run-node-acceptance.py --suite runtime-close --artifacts "${{ runner.temp }}/node-artifacts.json" --provenance "${{ runner.temp }}/node-provenance.json" --worker-provenance "${{ runner.temp }}/cli-provenance.json" --output "${{ runner.temp }}/node-native-close"
      - name: Verify terminal connection failure and recovery boundaries
        run: |
          cargo test --locked -p khor-cli --test runtime_image -- --test-threads=1
          cargo test --locked -p khor-node --lib accounts::pi_usage -- --test-threads=1
          cargo test --locked -p khor-node --lib khor_agent::conversations::tests -- --test-threads=1 | tee "$RUNNER_TEMP/conversations.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/conversations.log"
          cargo test --locked -p khor-gui-core --lib console::tests::slash_receipts -- --test-threads=1 | tee "$RUNNER_TEMP/conversation-commands.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/conversation-commands.log"
          cargo test --locked -p khor-node --lib observer_tests -- --test-threads=1
          cargo test --locked -p khor-node --lib doc_transfer_state::io::tests -- --test-threads=1
          cargo test --locked -p khor-node --lib foreground_satellite_registration_waits -- --test-threads=1
          cargo test --locked -p khor-node --lib cancelling_account_registration_while_root_is_busy -- --test-threads=1
          cargo test --locked -p khor-node --lib connection_failure_does_not_claim_the_host_ended -- --test-threads=1
          cargo test --locked -p khor-node --lib interrupted_and_invalid_handshakes_have_different_recovery -- --test-threads=1
          cargo test --locked -p khor-node --lib a_cookie_refusal_keeps_the_hosts_reason -- --test-threads=1
          cargo test --locked -p khor-node --lib unfinished_bootstrap_is_progress -- --test-threads=1
          cargo test --locked -p khor-gui-core --lib first_rejoin_is_safe_inside_a_runtime_worker -- --test-threads=1
          cargo test --locked -p khor-gui-core --lib term::io_tests:: -- --test-threads=1 | tee "$RUNNER_TEMP/terminal-io.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/terminal-io.log"
          cargo test --locked -p khor-gui-core --test terminal_current -- --test-threads=1
          cargo test --locked -p khor-gui-core --test account_registration -- --test-threads=1
      - name: Verify keeper adoption and SSH installation in scratch homes
        run: |
          cargo test --locked -p khor-node --lib join:: -- --test-threads=1
          cargo test --locked -p khor-core -p khor-node --lib activity -- --test-threads=1
          cargo test --locked -p khor-node --lib gui_run_rejects_old_and_unqualified_reports -- --test-threads=1
          cargo test --locked -p khor-cli --test serve_keeper -- --test-threads=1
      - name: Verify an actual published build upgrades and rolls back while both shells stay live
        run: |
          previous="$RUNNER_TEMP/khor-0.1.15-rc.3"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 https://github.com/colehank/khor/releases/download/v0.1.15-rc.3/khor-linux-x86_64.gz --output "$previous.gz"
          echo "92bf83cca3773456f9da55630d4d7819dc52ade3079720b79379121aacf58208  $previous.gz" | sha256sum --check
          gzip --decompress --stdout "$previous.gz" > "$previous"
          echo "499dec3513b3af917be3dc866950081a09224880591f1e6950a0524ef8a8a709  $previous" | sha256sum --check
          chmod 555 "$previous"
          KHOR_TEST_PREVIOUS_BIN="$previous" cargo test --locked -p khor-cli --test serve_keeper an_actual_published_release -- --ignored --nocapture --test-threads=1 | tee "$RUNNER_TEMP/previous-release.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/previous-release.log"
      - name: Verify signed SSH installation and authentication in scratch homes
        run: |
          npm ci --prefix apps/gui
          python3 scripts/check-ssh-install.py --output "$RUNNER_TEMP/ssh-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: node-native-close-evidence
          path: |
            ${{ runner.temp }}/ssh-native
            ${{ runner.temp }}/node-artifacts.json
            ${{ runner.temp }}/node-metadata.json
            ${{ runner.temp }}/cli-artifacts.json
            ${{ runner.temp }}/*-prepared.json
            ${{ runner.temp }}/*-provenance.json
            ${{ runner.temp }}/node-native-close
          if-no-files-found: warn

  gui:
    needs: frontend
    if: ${{ inputs.suite != 'node' && inputs.suite != 'agent' && inputs.suite != 'runtime' && !cancelled() && (needs.frontend.result == 'success' || inputs.reuse_frontend) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-gen
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/restore-frontend
      - run: npm run test:unit && npm run test:types
      - run: npm run gates && npm run mobile:static
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Run every interaction group and retain all failures
        run: |
          failed=0
          for gate in lock-state ai-elements scroll-lifecycle scroll-compose editor-overwrite chat-poll chat-cancel page-retention-ui native-events native-helpers chat-recovery khor-conversations-ui list-scroll-ui file-handoff quicklook file-pdf-ui workspace-content-ui terminal-links-ui notification-ui; do
            echo "::group::$gate"
            if FILE_HANDOFF_OUT="$RUNNER_TEMP/quality-$gate" timeout --kill-after=10s 8m npm run "$gate"; then
              echo "$gate passed"
            else
              result=$?
              echo "::error::$gate failed (exit $result)"
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          KHOR_TEST_FRONTEND: dist
          QUALITY_ENGINES: chrome,webkit
          QUALITY_HEADLESS: '1'
          EDITOR_OVERWRITE_WEBKIT: '1'
          DEBUG: pw:browser
          CHAT_POLL_WEBKIT: '1'
          CHAT_CANCEL_WEBKIT: '1'
          CHAT_RECOVERY_WEBKIT: '1'
          CHAT_RECOVERY_CHECK_DIR: ${{ runner.temp }}/quality-chat-recovery
          COMPOSE_OUT: ${{ runner.temp }}/quality-compose
          NATIVE_HELPERS_CHECK_DIR: ${{ runner.temp }}/quality-native-helpers
          NATIVE_EVENTS_CHECK_DIR: ${{ runner.temp }}/quality-native-events
          CHAT_CANCEL_CHECK_DIR: ${{ runner.temp }}/quality-chat-cancel
          PAGE_RETENTION_UI_OUT: ${{ runner.temp }}/quality-pages
          CHAT_POLL_CHECK_DIR: ${{ runner.temp }}/quality-chat-poll
          EDITOR_OVERWRITE_CHECK_DIR: ${{ runner.temp }}/quality-overwrite
          QUALITY_OUT: ${{ runner.temp }}/quality-scroll
          AI_ELEMENTS_OUT: ${{ runner.temp }}/quality-elements
          WORKSPACE_CONTENT_DIR: ${{ runner.temp }}/quality-workspace
          TERMINAL_LINK_UI_DIR: ${{ runner.temp }}/quality-terminal-links
          NOTIFICATION_UI_DIR: ${{ runner.temp }}/quality-notifications
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-interaction-evidence
          path: |
            ${{ runner.temp }}/khor-conversations-ui-evidence
            ${{ runner.temp }}/khor-list-scroll-evidence
            ${{ runner.temp }}/quality-file-handoff
            ${{ runner.temp }}/quality-quicklook
            ${{ runner.temp }}/quality-file-pdf-ui
            ${{ runner.temp }}/quality-scroll
            ${{ runner.temp }}/quality-elements
            ${{ runner.temp }}/quality-overwrite
            ${{ runner.temp }}/quality-chat-poll
            ${{ runner.temp }}/quality-chat-cancel
            ${{ runner.temp }}/quality-chat-recovery
            ${{ runner.temp }}/quality-pages
            ${{ runner.temp }}/quality-native-events
            ${{ runner.temp }}/quality-native-helpers
            ${{ runner.temp }}/quality-compose
            ${{ runner.temp }}/quality-workspace
            ${{ runner.temp }}/quality-terminal-links
            ${{ runner.temp }}/quality-notifications
          if-no-files-found: warn

  windows-agent-process:
    if: ${{ inputs.suite != 'gui' && inputs.suite != 'runtime' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify owned processes and cancellable pipes on Windows
        shell: pwsh
        run: |
          cargo run --locked --manifest-path crates/node/tests/windows-process-harness/Cargo.toml *> "$env:RUNNER_TEMP/agent-process.log"
          $processCheckExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/agent-process.log"
          exit $processCheckExit
      - name: Verify bounded GUI socket writers on Windows
        shell: pwsh
        run: |
          rustc --edition=2024 --test crates/node/tests/fanout_harness.rs -o "$env:RUNNER_TEMP/gui-fanout-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/gui-fanout-tests.exe" --nocapture --test-threads=1 *> "$env:RUNNER_TEMP/gui-fanout.log"
          $fanoutCheckExit = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/gui-fanout.log"
          exit $fanoutCheckExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-agent-process-evidence
          path: |
            ${{ runner.temp }}/agent-process.log
            ${{ runner.temp }}/gui-fanout.log
          if-no-files-found: warn
