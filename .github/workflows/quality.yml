name: Quality
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  ios-app:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          run-id: 44705067265
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/released
      - name: Build the exact frontend with compatible generation
        run: |
          python3 scripts/release_manifest.py verify --root "$RUNNER_TEMP/released" --kind frontend --sha 1c7c87e3ed0187e22aaa2897cd8206254e9ac4af
          cp -R "$RUNNER_TEMP/released/gen" apps/gui/src/gen
          npm ci --prefix apps/gui
          cd apps/gui
          npm run test:types
          npx vite build
      - name: Typecheck the iPhone App and its Tauri paste command
        run: cargo check --locked -p khor-gui --lib --target aarch64-apple-ios
