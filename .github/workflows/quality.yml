name: Quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
      interaction_scope:
        type: string
permissions:
  contents: read
  actions: read
jobs:
  source-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: abb22d3d
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: |
          python3 scripts/check-rust-format.py --write
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-format
          path: |
            ${{ runner.temp }}/rustfmt.patch
            ${{ runner.temp }}/source-sha.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          run-id: 42818250406
          github-token: ${{ github.token }}
          path: frontend
      - run: |
          python3 scripts/release_manifest.py verify --root frontend --sha 3e24fa45879c4515fc0d165917f76cb5684ba2a4 --run-id 42818250406
          cp -R frontend/gen apps/gui/src/gen
          npm ci --prefix apps/gui
          cd apps/gui
          npm run test:types
          NOTIFICATION_UI_DIR="$RUNNER_TEMP/notice-fast" PLAYWRIGHT_CHROMIUM_CHANNEL=chrome timeout --kill-after=5s 90s node scripts/check-native-notification-ui.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: notice-fast
          path: |
            ${{ runner.temp }}/notice-fast
            ${{ runner.temp }}/title-check
