name: Quality

on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
        default: node
      interaction_scope:
        type: string
        default: all

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml

  sample-mac:
    needs: frontend
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/restore-frontend
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-execution
          cache-targets: false
          save-if: false
      - name: Build the draft candidate for disposable terminal tests
        run: |
          source=$(git rev-parse HEAD^2)
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/quality.yml'
          git diff --exit-code HEAD -- . ':(exclude)apps/gui/dev/lab/data/world.generated.json'
          cargo build --locked -p khor-cli --bin khor
          mkdir -p "$RUNNER_TEMP/terminal-draft-cli"
          cp target/debug/khor "$RUNNER_TEMP/terminal-draft-cli/"
          echo "$source" > "$RUNNER_TEMP/terminal-draft-cli/source.txt"
          shasum -a 256 "$RUNNER_TEMP/terminal-draft-cli/khor" | awk '{print $1}' > "$RUNNER_TEMP/terminal-draft-cli/sha256.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terminal-draft-cli-macos-arm64
          path: ${{ runner.temp }}/terminal-draft-cli
          if-no-files-found: error
          retention-days: 2
