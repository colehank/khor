name: Session lifecycle focused verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  seen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-focused
          save-if: 'false'
      - name: Complete sync crate regression
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test --locked -p khor-sync --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seen.log"
      - name: Export formatter patch for source-only editing
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: focused-seen
          path: |
            ${{ runner.temp }}/seen.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
