name: Session lifecycle focused verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      slice:
        type: choice
        options: [sync, delegation, installer, format, interaction, mac-package, desktop-package, scripts, agent-runtime, gui-regression, recents, updates, wix-probe, resources, media-fixture, lab-front, windows-install, published-rollback]
        default: sync
      frontend_run:
        type: string
        default: '42999100740'
      bindings_sha:
        type: string
        default: '6ffcd3d3b437495f86005539175a72a54ea081a2'
      checker_sha:
        type: string
        default: ''
      desktop_target:
        type: choice
        options: [all, windows, linux-arm, linux-x86]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  published-rollback:
    if: inputs.slice == 'published-rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/native-tools
        with:
          target: x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: cached-frontend
          run-id: '43011160399'
          github-token: ${{ github.token }}
      - name: Restore the real verified unchanged frontend required by the CLI
        run: |
          python3 scripts/release_manifest.py verify --root cached-frontend --sha 00555d064314e358d4e613d1df35183284c4a55e --run-id 43011160399 --kind frontend
          git diff --exit-code 00555d064314e358d4e613d1df35183284c4a55e HEAD -- apps/gui/src apps/gui/package.json apps/gui/package-lock.json apps/gui/vite.config.ts crates/catalog
          mkdir -p apps/gui/src
          cp -R cached-frontend/dist apps/gui/dist
          cp -R cached-frontend/gen apps/gui/src/gen
          rustup component add rustfmt
      - name: Embed the actual agent and verify the two real published runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix apps/agent
          node apps/agent/build.mjs x86_64-unknown-linux-gnu apps/agent/dist/khor-agent
          export KHOR_AGENT_BUNDLE="$PWD/apps/agent/dist/khor-agent"
          previous="$RUNNER_TEMP/khor-0.1.15-rc.3"
          timeout 120s gh release download v0.1.15-rc.3 --repo colehank/khor --pattern khor-linux-x86_64.gz --output "$previous.gz"
          echo "92bf83cca3773456f9da55630d4d7819dc52ade3079720b79379121aacf58208  $previous.gz" | sha256sum --check
          gzip --decompress --stdout "$previous.gz" > "$previous"
          echo "499dec3513b3af917be3dc866950081a09224880591f1e6950a0524ef8a8a709  $previous" | sha256sum --check
          chmod 555 "$previous"
          KHOR_TEST_PREVIOUS_BIN="$previous" cargo test --locked -p khor-cli --test serve_keeper an_actual_published_release -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/previous-release.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/previous-release.log"
      - name: Retain formatting from the remote Rust toolchain
        if: always()
        run: cargo fmt --all && git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-rollback
          path: |
            ${{ runner.temp }}/previous-release.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  windows-install:
    if: inputs.slice == 'windows-install'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Reuse the exact previously compiled Windows MSI and retain installation diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import hashlib, pathlib, subprocess, zipfile
          target=pathlib.Path('windows-install');target.mkdir()
          archive=target/'compiled.zip'
          with archive.open('wb') as output:
            subprocess.run(['gh','api','repos/colehank/khor/actions/artifacts/13849127806/zip'],stdout=output,check=True,timeout=180)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='3fe5eee1862b384873d756d75cb9b9a9b6fa3263a39d14a6154f4bce2f3f26c8'
          with zipfile.ZipFile(archive) as source:
            matches=[item for item in source.namelist() if item.endswith('/khor-windows-x86_64.msi') or item=='khor-windows-x86_64.msi']
            assert len(matches)==1,matches
            (target/'khor-windows-x86_64.msi').write_bytes(source.read(matches[0]))
          # Diagnostics only: retain the real MSI log without changing its actions.
          checker=pathlib.Path('scripts/check-desktop-installer.py')
          text=checker.read_text()
          start=text.index('            result = subprocess.run(["msiexec.exe", "/i"')
          end=text.index('            assert result.returncode',start)
          text=text[:start]+'            result = invoke_msi("/i", package, destination)\n'+text[end:]
          start=text.index('                result = subprocess.run(["msiexec.exe", "/x"')
          end=text.index('                assert result.returncode',start)
          text=text[:start]+'                result = invoke_msi("/x", package)\n'+text[end:]
          helper='''def invoke_msi(action, package, destination=None):
              executable=Path(os.environ["SystemRoot"])/"System32/msiexec.exe"
              log=Path("windows-install/install.log" if action=="/i" else "windows-install/uninstall.log").resolve()
              command=f'"{executable}" {action} "{package}" /qn /norestart /L*V "{log}"'
              if destination is not None: command+=f' INSTALLDIR="{destination}"'
              print("MSI command",command,flush=True)
              try: return subprocess.run(command,timeout=180)
              finally:
                  diagnostic=subprocess.run(["powershell.exe","-NoProfile","-Command","Get-CimInstance Win32_Process | Where-Object Name -match 'msiexec' | Select-Object Name,ProcessId,CommandLine | ConvertTo-Json"],capture_output=True,text=True,timeout=20)
                  Path("windows-install/processes.json").write_text(diagnostic.stdout)
          '''
          # MSI parses PROPERTY="value with spaces", unlike CRT argv quoting
          # which surrounds the entire PROPERTY=value argument.
          import textwrap
          text=text.replace('def windows(package, expected_source):',textwrap.dedent(helper)+'\n\ndef windows(package, expected_source):')
          checker.write_text(text)
          PYCODE
          python scripts/check-desktop-installer.py --package windows-install/khor-windows-x86_64.msi --expected-source 6ffcd3d3b437495f86005539175a72a54ea081a2 --output windows-install/proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-install-diagnosis
          path: |
            windows-install/*.log
            windows-install/*.json
          retention-days: 7
  seen:
    if: inputs.slice == 'sync' || inputs.slice == 'format'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-focused
          save-if: 'false'
      - name: Complete sync crate regression
        if: inputs.slice == 'sync'
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test --locked -p khor-sync --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seen.log"
      - name: Export formatter patch for source-only editing
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: focused-seen
          path: |
            ${{ runner.temp }}/seen.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  delegation:
    if: inputs.slice == 'delegation'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-delegation
          save-if: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: npm ci --prefix apps/gui
      - run: npm run build --prefix apps/gui
      - name: Exercise real ACP delegation, retirement and resume
        run: |
          set -euo pipefail
          git rev-parse HEAD
          export KHOR_RUNTIME_DIR="$RUNNER_TEMP/runtime-images"
          cargo build --locked -p khor-cli --bin khor
          cargo build --locked -p khor-acp --bin acp-stub
          export KHOR_TEST_MCP_EXECUTABLE="$PWD/target/debug/khor"
          export KHOR_TEST_ACP_STUB="$PWD/target/debug/acp-stub"
          cargo test --locked -p khor-node --lib mcp_worker::tests::a_real_ -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/delegation.log"
          cargo test --locked -p khor-node --lib a_stopped_codex_does_not_demote_its_hosts_active_selected_thread -- --test-threads=1
          cargo test --locked -p khor-node --test pairing pairing_joins_both_tables_and_chat_flows_both_ways -- --test-threads=1
          cargo test --locked -p khor-node --test delegation_wire -- --exact paired_bound_delegation_keeps_authenticated_identity_and_original_parent
          cargo test --locked -p khor-node --test delegation_wire -- --exact paired_cancel_input_fences_absent_message_before_late_send
      - if: always()
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: delegation-evidence
          path: |
            ${{ runner.temp }}/delegation.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  installer:
    if: inputs.slice == 'installer'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: python3 scripts/check-mac-installer.py
  interaction:
    if: inputs.slice == 'interaction'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: npm ci --prefix apps/gui
      - run: npm run build --prefix apps/gui
      - run: node apps/gui/node_modules/playwright-core/cli.js install chromium
      - name: Verify resumed viewport and version-scoped machine updates
        working-directory: apps/gui
        run: |
          npm run viewport-resume
          npm run updates-ui
      - if: ${{ !cancelled() }}
        id: attachment-binaries
        run: cargo build --locked -p khor-cli --bin khor -p khor-gui-core --bin bridge
      - name: Verify attachments with a real App, PTY and file transport
        if: ${{ !cancelled() && steps.attachment-binaries.outcome == 'success' }}
        working-directory: apps/gui
        run: npm run attachment-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: interaction-evidence
          path: |
            ${{ runner.temp }}/khor-updates-ui
            /tmp/khor-attachment-ui-check/ui
          if-no-files-found: warn

  mac-package:
    needs: package-frontend
    if: inputs.slice == 'mac-package'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-tools
        with:
          target: aarch64-apple-darwin
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: npm ci --prefix apps/gui
      - run: npm ci --prefix apps/agent && node apps/agent/build.mjs "$TARGET" apps/agent/dist/khor-agent
      - uses: ./.github/actions/restore-frontend
      - name: Build the actual unsigned App with its matching CLI
        env:
          KHOR_AGENT_BUNDLE: ${{ github.workspace }}/apps/agent/dist/khor-agent
        run: |
          set -euo pipefail
          cargo build --locked -p khor-cli --bin khor --target "$TARGET" --release
          mkdir -p apps/gui/src-tauri/binaries
          cp "target/$TARGET/release/khor" "apps/gui/src-tauri/binaries/khor-$TARGET"
          python3 scripts/apple_release.py mac-build --target "$TARGET" --signed false
      - name: Verify the same program identities survive the real PKG
        run: |
          mkdir -p "$RUNNER_TEMP/mac-package-proof"
          PYTHONPATH=scripts python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          from mac_installer import build, extract
          from release_manifest import executable_info, source_sha, version
          app = pathlib.Path("target") / os.environ["TARGET"] / "release/bundle/macos/Khor.app"
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "mac-package-proof"
          package = directory / "Khor.pkg"
          build(app, package, version(), False)
          subprocess.run(['python3', 'scripts/check-desktop-installer.py', '--package', str(package), '--output', str(directory / 'installation.json')], check=True)
          installed = extract(package, pathlib.Path(os.environ["RUNNER_TEMP"]) / "package-expansion")
          gui = executable_info(installed / "Contents/MacOS/khor-gui")
          cli = executable_info(installed / "Contents/MacOS/khor")
          assert gui["component"] == "desktop-app" and cli["component"] == "cli"
          assert all(gui[key] == cli[key] for key in ("build", "platform", "contract"))
          assert (installed / "Contents/MacOS/khor").read_bytes() == (app / "Contents/MacOS/khor").read_bytes()
          (directory / "proof.json").write_text(json.dumps({"source": source_sha(), "app": gui, "cli": cli}, indent=2))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-package-proof
          path: ${{ runner.temp }}/mac-package-proof/*.json
          if-no-files-found: error

  package-frontend:
    if: inputs.slice == 'desktop-package' || inputs.slice == 'mac-package' || inputs.slice == 'gui-regression' || inputs.slice == 'recents' || inputs.slice == 'updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend-registry
          cache-targets: false
          save-if: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: npm ci --prefix apps/gui
      - run: npm run build --prefix apps/gui
      - run: |
          mkdir -p frontend
          cp -R apps/gui/dist frontend/dist
          cp -R apps/gui/src/gen frontend/gen
          python3 scripts/release_manifest.py create --root frontend --kind frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend
          path: frontend/
          include-hidden-files: true
          if-no-files-found: error

  desktop-package:
    needs: package-frontend
    if: inputs.slice == 'desktop-package'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.desktop_target == 'windows' && '[{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","filename":"khor-windows-x86_64.msi"}]' || inputs.desktop_target == 'linux-arm' && '[{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","filename":"khor-linux-aarch64.deb"}]' || inputs.desktop_target == 'linux-x86' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","filename":"khor-linux-x86_64.deb"}]' || '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","filename":"khor-linux-x86_64.deb"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","filename":"khor-windows-x86_64.msi"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/native-tools
        with:
          target: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev xvfb dbus-x11
      - uses: ./.github/actions/restore-frontend
      - shell: bash
        run: npm ci --prefix apps/gui
      - shell: bash
        run: npm ci --prefix apps/agent && node apps/agent/build.mjs "$TARGET" apps/agent/dist/khor-agent
      - name: Build the actual desktop package
        shell: bash
        env:
          KHOR_AGENT_BUNDLE: ${{ github.workspace }}/apps/agent/dist/khor-agent
        run: python scripts/desktop_installer.py --target "$TARGET" --output desktop-package
      - if: runner.os == 'Linux'
        name: Install, launch and remove the Debian package
        run: xvfb-run -a dbus-run-session -- python3 scripts/check-desktop-installer.py --package desktop-package/${{ matrix.filename }} --output desktop-package/proof.json
      - if: runner.os == 'Windows'
        name: Install, launch and remove the Windows package
        run: python scripts/check-desktop-installer.py --package desktop-package/${{ matrix.filename }} --output desktop-package/proof.json
      - name: Preserve compiled Windows programs and WiX diagnostics on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $proof = 'desktop-package/rebuild'
          New-Item -ItemType Directory -Force $proof | Out-Null
          $release = "target/$env:TARGET/release"
          foreach ($file in @('khor.exe','khor-gui.exe')) {
            $source = Join-Path $release $file
            if (Test-Path $source) { Copy-Item $source $proof }
          }
          foreach ($directory in @('wix','bundle')) {
            $source = Join-Path $release $directory
            if (Test-Path $source) { Copy-Item -Recurse $source $proof }
          }
          if (Test-Path 'apps/gui/src-tauri/binaries') { Copy-Item -Recurse 'apps/gui/src-tauri/binaries' $proof }
          if (Test-Path 'apps/agent/dist') { Copy-Item -Recurse 'apps/agent/dist' "$proof/agent" }
          git rev-parse HEAD | Set-Content "$proof/source.txt"
          Get-ChildItem -Recurse -File $proof | Get-FileHash | ConvertTo-Json | Set-Content "$proof/hashes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-package-${{ matrix.target }}
          path: desktop-package/
          if-no-files-found: warn

  scripts:
    if: inputs.slice == 'scripts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - if: always()
        run: cargo fmt --all && git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: script-verification
          path: ${{ runner.temp }}/format.patch

  agent-runtime:
    if: inputs.slice == 'agent-runtime'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - shell: bash
        run: |
          npm ci --prefix apps/agent
          node apps/agent/build.mjs x86_64-pc-windows-msvc apps/agent/dist/khor-agent
          python - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, subprocess, shutil, tempfile
          program = Path('apps/agent/dist/khor-agent')
          assert program.read_bytes()[:2] == b'MZ'
          with tempfile.TemporaryDirectory(prefix='khor-agent-native-') as temporary:
              executable = Path(temporary)/'host.exe'
              shutil.copyfile(program, executable)
              reply = subprocess.run([str(executable)],input='not-json\n',capture_output=True,text=True,timeout=30)
              assert reply.returncode == 1, (reply.returncode,reply.stderr)
              result = json.loads(reply.stdout)
              assert result == {'type':'failed','error':'Invalid host protocol message'}, result
          Path('agent-runtime-proof.json').write_text(json.dumps({'source': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'target':'x86_64-pc-windows-msvc', 'sha256':hashlib.sha256(program.read_bytes()).hexdigest(), 'bytes':program.stat().st_size, 'executed_on_windows':True, 'host_protocol_confirmed':True}))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-agent-runtime-proof
          path: agent-runtime-proof.json
          if-no-files-found: error

  updates:
    if: inputs.slice == 'updates'
    needs: package-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: ./.github/actions/restore-frontend
      - run: npm ci --prefix apps/gui
      - name: Use the regression against its old implementation
        if: inputs.checker_sha != ''
        env:
          CHECKER_SHA: ${{ inputs.checker_sha }}
        run: |
          [[ "$CHECKER_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$CHECKER_SHA"
          git show "$CHECKER_SHA:apps/gui/scripts/check-updates-ui.mjs" > apps/gui/scripts/check-updates-ui.mjs
      - working-directory: apps/gui
        run: npx playwright-core install --with-deps chromium
      - working-directory: apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
        run: npm run updates-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: about-update-ui
          path: ${{ runner.temp }}/khor-updates-ui

  recents:
    if: inputs.slice == 'recents'
    needs: package-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: ./.github/actions/restore-frontend
      - run: npm ci --prefix apps/gui
      - working-directory: apps/gui
        run: npx playwright-core install --with-deps chromium webkit
      - working-directory: apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
        run: node scripts/check-recent-places-ui.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recent-places
          path: ${{ runner.temp }}/khor-recent-places-ui

  gui-regression:
    if: inputs.slice == 'gui-regression'
    needs: package-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: ./.github/actions/restore-frontend
      - run: npm ci --prefix apps/gui
      - shell: bash
        working-directory: apps/gui
        run: npx playwright-core install --with-deps chromium webkit
      - name: Reproduce every Khor reading-position scenario
        working-directory: apps/gui
        env:
          QUALITY_ONLY: chat-khor
          QUALITY_ENGINES: chrome,webkit
          QUALITY_HEADLESS: '1'
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          QUALITY_OUT: ${{ runner.temp }}/khor-scroll
        run: npm run scroll-lifecycle
      - name: Export the final formatter patch
        if: always()
        run: cargo fmt --all && git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gui-regression
          path: |
            ${{ runner.temp }}/khor-scroll
            ${{ runner.temp }}/format.patch

  wix-probe:
    if: inputs.slice == 'wix-probe'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Reproduce and validate the isolated WiX fragment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          Get-FileHash $zip
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          Expand-Archive $zip $wix
          $proof = Join-Path $env:RUNNER_TEMP 'wix-proof'
          New-Item -ItemType Directory $proof | Out-Null
          $source = Get-Content -Raw 'apps/gui/src-tauri/packaging/cli-path.wxs'
          $red = Join-Path $proof 'red.wxs'
          $green = Join-Path $proof 'green.wxs'
          [IO.File]::WriteAllText($red, $source)
          [IO.File]::WriteAllText($green, $source.Replace('Win64="$(var.Win64)"', 'Win64="yes"'))
          & "$wix/candle.exe" -nologo -arch x64 -out "$proof/red.wixobj" $red *> "$proof/red.log"
          $redExit = $LASTEXITCODE
          Get-Content "$proof/red.log"
          if ($redExit -eq 0 -or -not ((Get-Content -Raw "$proof/red.log") -match 'Undefined preprocessor variable.*Win64')) { throw 'Did not reproduce the undefined fragment variable' }
          & "$wix/candle.exe" -nologo -arch x64 -out "$proof/green.wixobj" $green *> "$proof/green.log"
          $greenExit = $LASTEXITCODE
          Get-Content "$proof/green.log"
          if ($greenExit -ne 0) { throw 'Corrected fragment still fails candle' }
          @{source=(git rev-parse HEAD);red=$redExit;green=$greenExit} | ConvertTo-Json | Set-Content "$proof/result.json"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: wix-fragment-proof
          path: ${{ runner.temp }}/wix-proof

  resources:
    if: inputs.slice == 'resources'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend-registry
          cache-targets: false
          save-if: 'false'
      - name: Run source confinement and real HTTP lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p khor-node --lib file_resource:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/resource-source.log"
          cargo test --locked -p khor-gui-core --lib resource_preview:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/resource-http.log"
          cargo test --locked -p khor-gui-core --test command_tables -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/resource-commands.log"
      - name: Export formatter patch without local compilation
        if: always()
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: resource-stream-evidence
          path: |
            ${{ runner.temp }}/resource-source.log
            ${{ runner.temp }}/resource-http.log
            ${{ runner.temp }}/resource-commands.log
            ${{ runner.temp }}/format.patch

  media-fixture:
    if: inputs.slice == 'media-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate original tiny test media
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          mkdir -p "$RUNNER_TEMP/media-fixture"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=5' -an -c:v libx264 -preset fast -crf 32 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/media-fixture/clip.mp4"
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=8000:duration=5' -c:a pcm_s16le "$RUNNER_TEMP/media-fixture/audio.wav"
          sha256sum "$RUNNER_TEMP/media-fixture/"*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-test-media
          path: ${{ runner.temp }}/media-fixture

  lab-front:
    if: inputs.slice == 'lab-front'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: cached-frontend
          run-id: ${{ inputs.frontend_run }}
          github-token: ${{ github.token }}
      - name: Verify the native inputs before reusing generated types
        env:
          BINDINGS_SHA: ${{ inputs.bindings_sha }}
          BINDINGS_RUN: ${{ inputs.frontend_run }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BINDINGS_SHA" HEAD -- Cargo.toml Cargo.lock crates apps/gui/core apps/gui/dev/lab/data/workspace apps/gui/scripts/generate.mjs scripts/khor_lab/fixture_data.py ':!apps/gui/core/src/resource_preview.rs' ':!crates/node/src/runtime_image.rs'
          python3 - <<'PYCODE'
          import os,pathlib,subprocess
          path='apps/gui/core/src/resource_preview.rs'
          old=subprocess.check_output(['git','show',os.environ['BINDINGS_SHA']+':'+path],text=True)
          new=pathlib.Path(path).read_text()
          # The complete imports/attributes/exported TS declaration precede this
          # private implementation. All other core/crate bytes were checked above.
          assert old.split('struct Context {',1)[0]==new.split('struct Context {',1)[0], 'ResourcePreview binding declaration changed; regenerate it'
          path='crates/node/src/runtime_image.rs'
          old=subprocess.check_output(['git','show',os.environ['BINDINGS_SHA']+':'+path],text=True)
          new=pathlib.Path(path).read_text()
          assert old.split('fn current()',1)[0]==new.split('fn current()',1)[0], 'Runtime types/imports changed; regenerate bindings'
          assert old.split('pub fn process_entry()',1)[1]==new.split('pub fn process_entry()',1)[1], 'Runtime code outside current metadata changed; regenerate bindings'
          PYCODE
          python3 scripts/release_manifest.py verify --root cached-frontend --sha "$BINDINGS_SHA" --run-id "$BINDINGS_RUN" --kind frontend
          mkdir -p apps/gui/src apps/gui/dev/lab/data
          cp -R cached-frontend/gen apps/gui/src/gen
          cp cached-frontend/lab-world.generated.json apps/gui/dev/lab/data/world.generated.json
          python3 scripts/khor_lab/fixture_data.py . --check
      - run: npm ci --prefix apps/gui
      - name: Build the latest real frontend and App Lab without regenerating identical Rust types
        working-directory: apps/gui
        run: |
          npx tsc --noEmit
          npx vite build
          npx tsc --project dev/lab/tsconfig.json
          npx vite build --config dev/lab/vite.config.ts --outDir "$RUNNER_TEMP/developer-lab"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'lab-source.json'
          source.write_text(json.dumps(dict(schema=1,base_commit=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),snapshot_commit=git('rev-parse','HEAD'),dirty=False)))
          subprocess.run(['python3','../../scripts/khor_lab/package.py','../..',os.environ['RUNNER_TEMP']+'/developer-lab',str(source)],check=True)
          PYCODE
      - name: Prepare Chromium and WebKit media engines
        working-directory: apps/gui
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install --no-install-recommends -y fonts-noto-cjk gstreamer1.0-libav
          npx playwright-core install --with-deps chromium webkit
      - name: Exercise the actual App and its live update path
        working-directory: apps/gui
        env:
          LAB_BUNDLE: ${{ runner.temp }}/developer-lab
          LAB_REPORT: ${{ runner.temp }}/lab-report
          QUALITY_ENGINES: chromium,webkit
          QUALITY_HEADLESS: '0'
        run: |
          xvfb-run -a node dev/lab/check-app.mjs
          node dev/lab/check-hot.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lab-diagnosis
          path: |
            ${{ runner.temp }}/lab-report/*.json
            ${{ runner.temp }}/lab-report/*.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: developer-lab-review
          path: |
            ${{ runner.temp }}/developer-lab
            ${{ runner.temp }}/lab-report/*.json
            ${{ runner.temp }}/lab-report/*.png
          retention-days: 7
