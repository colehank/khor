name: Quality
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  ios-terminal-keyboard:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          run-id: 44705067265
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/released
      - name: Build the branch terminal with verified existing generation
        run: |
          python3 scripts/release_manifest.py verify --root "$RUNNER_TEMP/released" --kind frontend --sha 1c7c87e3ed0187e22aaa2897cd8206254e9ac4af
          cp -R "$RUNNER_TEMP/released/gen" apps/gui/src/gen
          cp "$RUNNER_TEMP/released/lab-world.generated.json" apps/gui/dev/lab/data/world.generated.json
          npm ci --prefix apps/gui
          (cd apps/gui && npx vite build --config dev/lab/vite.config.ts --outDir "$RUNNER_TEMP/lab")
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git', *args],text=True).strip()
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'lab/lab-manifest.json').write_text(json.dumps(
              dict(schema=1,entry='production-app',tree=git('rev-parse','HEAD^{tree}'),snapshot_commit=git('rev-parse','HEAD'))))
          PY
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-sim
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Compile the production UIKit paste control for the simulator fixture
        run: |
          paste="$RUNNER_TEMP/native-paste"
          mkdir -p "$paste/src"
          cp apps/gui/scripts/native-keyboard-probe/paste-fixture/Cargo.toml "$paste/Cargo.toml"
          cp apps/gui/scripts/native-keyboard-probe/paste-fixture/lib.rs "$paste/src/lib.rs"
          ln -s "$PWD/apps/gui/src-tauri/src/terminal_paste.rs" "$paste/src/terminal_paste.rs"
          cargo build --manifest-path "$paste/Cargo.toml" --target aarch64-apple-ios-sim
          echo "KHOR_PASTE_PROBE_LIB=$paste/target/aarch64-apple-ios-sim/debug/libterminal_paste_probe.a" >> "$GITHUB_ENV"
      - name: Tap the terminal and swap the actual iOS keyboard with attachments
        run: |
          test "$(uname -m)" = arm64
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          PYTHONPATH=scripts python3 -m khor_lab.terminal_keyboard_probe --simulator "$SIMULATOR_ID" "$RUNNER_TEMP/lab" --out "$RUNNER_TEMP/terminal-keyboard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-terminal-keyboard
          path: |
            ${{ runner.temp }}/terminal-keyboard/*keyboard*.json
            ${{ runner.temp }}/terminal-keyboard/terminal-keyboard.png
            ${{ runner.temp }}/terminal-keyboard/appium.log
          if-no-files-found: warn
