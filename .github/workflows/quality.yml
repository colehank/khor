name: Quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
      interaction_scope:
        type: string
permissions:
  contents: read
jobs:
  signing-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f8f17e63d0303d2f4255a0deb9d57ae3f82653cf
      - run: python3 -m unittest discover -s scripts/tests -p 'test_mac_signing_retry.py' -v 2>&1 | tee "$RUNNER_TEMP/signing-retry.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: signing-retry
          path: ${{ runner.temp }}/signing-retry.log
