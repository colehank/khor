name: Quality
on:
  workflow_dispatch:
    inputs:
      suite:
        type: string
      interaction_scope:
        type: string
permissions:
  contents: read
jobs:
  source-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 236cef38b11263f3bb1bfe4e8649e7b32f3c48c7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: |
          python3 scripts/check-rust-format.py --write
          git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-format
          path: |
            ${{ runner.temp }}/rustfmt.patch
            ${{ runner.temp }}/source-sha.txt
