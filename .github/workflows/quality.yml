name: Session lifecycle focused verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
      slice:
        type: choice
        options: [sync, delegation, installer, format, interaction, mac-package, desktop-package, scripts, agent-runtime, gui-regression, recents, updates, wix-probe, resources, media-fixture, lab-front, frontend-only, windows-install, published-rollback, mac-installed-debug, runtime-cold, recovery-debug, installer-receipt]
        default: sync
      frontend_run:
        type: string
        default: '42999100740'
      bindings_sha:
        type: string
        default: '6ffcd3d3b437495f86005539175a72a54ea081a2'
      checker_sha:
        type: string
        default: ''
      lab_checks:
        type: choice
        options: [all, child-tree, child-tree-chromium, conversation-navigation]
        default: all
      desktop_probe:
        type: choice
        options: [none, drag-routing, drag-all]
        default: none
      desktop_target:
        type: choice
        options: [all, windows, linux-arm, linux-x86]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  receipt-regression:
    if: inputs.slice == 'installer-receipt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the previous installer fails the new isolation regressions
        env:
          SOURCE: ${{ inputs.source_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt-regression"
          git show c6fda5e0032d556a27c0ff5514f615c34c503431:scripts/check-desktop-installer.py > scripts/check-desktop-installer.py
          set +e
          python3 -m unittest discover -s scripts/tests -p test_desktop_installer_processes.py -v > "$RUNNER_TEMP/receipt-regression/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/receipt-regression/red.log"
          test "$result" -ne 0
          grep -F 'Ran 5 tests' "$RUNNER_TEMP/receipt-regression/red.log"
          grep -F 'FAILED (failures=2)' "$RUNNER_TEMP/receipt-regression/red.log"
          git show "$SOURCE":scripts/check-desktop-installer.py > scripts/check-desktop-installer.py
      - name: Require all original cleanup and new log-isolation tests to pass
        run: python3 -m unittest discover -s scripts/tests -p test_desktop_installer_processes.py -v 2>&1 | tee "$RUNNER_TEMP/receipt-regression/green.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installer-receipt-regression
          path: ${{ runner.temp }}/receipt-regression
          if-no-files-found: error
  receipt-windows:
    if: inputs.slice == 'installer-receipt'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: khor-windows-x86_64-app
          path: original
          run-id: '43202395646'
          github-token: ${{ github.token }}
      - name: Validate the exact original MSI and retain its diagnostic-only extras
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, shutil, sys
          sys.path.insert(0, 'scripts')
          from release_manifest import files, verify
          root = pathlib.Path('original')
          receipt = json.loads((root / 'receipt.json').read_text())
          actual = files(root)
          assert set(actual) - set(receipt['files']) == {'khor-windows-x86_64.install.log', 'khor-windows-x86_64.uninstall.log'}
          assert all(actual[n] == v for n, v in receipt['files'].items())
          product = pathlib.Path('product'); product.mkdir()
          for name in [*receipt['files'], 'receipt.json']:
              shutil.copy2(root / name, product / name)
          verify(product, 'c6fda5e0032d556a27c0ff5514f615c34c503431', kind='khor-windows-x86_64-app', run_id='43202395646')
          PY
      - name: Install and uninstall the same MSI using the fixed checker
        run: python scripts/check-desktop-installer.py --package product/khor-windows-x86_64.msi --expected-source c6fda5e0032d556a27c0ff5514f615c34c503431 --output "${{ runner.temp }}/installation.json"
      - name: Require the original receipt to remain strictly valid after the real installation
        shell: bash
        run: |
          python scripts/release_manifest.py verify --root product --sha c6fda5e0032d556a27c0ff5514f615c34c503431 --kind khor-windows-x86_64-app --run-id 43202395646
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          logs = sorted((root / 'khor-installer-logs').glob('*.log'))
          assert len(logs) == 2 and all(p.stat().st_size for p in logs)
          (root / 'receipt-after-install.json').write_text(json.dumps({'original_source': 'c6fda5e0032d556a27c0ff5514f615c34c503431', 'original_run': '43202395646', 'unchanged_receipt': True, 'diagnostic_logs': [p.name for p in logs]}, indent=2))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: installer-receipt-windows
          path: |
            ${{ runner.temp }}/installation.json
            ${{ runner.temp }}/receipt-after-install.json
            ${{ runner.temp }}/khor-installer-logs/*.log
          if-no-files-found: error
  recovery-debug:
    if: inputs.slice == 'recovery-debug'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      CHAT_RECOVERY_SCENARIOS: directory-required-shell
      CHAT_RECOVERY_WEBKIT: '1'
      PLAYWRIGHT_CHROMIUM_CHANNEL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: frontend
          run-id: '43186348191'
          github-token: ${{ github.token }}
      - name: Restore the exact candidate's generated inputs
        env:
          SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 scripts/release_manifest.py verify --root frontend --sha "$SOURCE" --run-id 43186348191 --kind frontend
          mkdir -p apps/gui/src
          cp -R frontend/gen apps/gui/src/gen
      - run: npm ci
        working-directory: apps/gui
      - name: Install the same Chromium and WebKit engines
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          node apps/gui/node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Repeat the unchanged directory recovery interactions on fresh browser contexts
        working-directory: apps/gui
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          mkdir -p "$RUNNER_TEMP/directory-recovery"
          for attempt in 1 2 3; do
            export CHAT_RECOVERY_CHECK_DIR="$RUNNER_TEMP/directory-recovery/attempt-$attempt"
            if npm run chat-recovery 2>&1 | tee "$RUNNER_TEMP/directory-recovery/attempt-$attempt.log"; then
              echo "Repeated recovery attempt $attempt passed"
            else
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: directory-recovery-repeat
          path: ${{ runner.temp }}/directory-recovery
          if-no-files-found: error
  runtime-cold:
    if: inputs.slice == 'runtime-cold'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-review-cold-mac
          cache-targets: true
          save-if: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: frontend
          run-id: '43157617769'
          github-token: ${{ github.token }}
      - name: Reuse only verified unchanged frontend inputs
        run: |
          python3 scripts/release_manifest.py verify --root frontend --sha e23dfce529fd0b6aa18e6801746059128d5bb10a --run-id 43157617769 --kind frontend
          git diff --exit-code e23dfce529fd0b6aa18e6801746059128d5bb10a HEAD -- apps/gui crates/catalog Cargo.toml Cargo.lock
          mkdir -p apps/gui/src
          cp -R frontend/dist apps/gui/dist
          cp -R frontend/gen apps/gui/src/gen
      - name: Reproduce the rejected cold image against the previous implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cold-mac-proof
          git show e23dfce529fd0b6aa18e6801746059128d5bb10a:crates/node/src/runtime_image.rs > crates/node/src/runtime_image.rs
          set +e
          cargo test --locked -p khor-cli --test runtime_image runtime_inspection_allows_a_cold_mac_image_before_opening_user_data -- --exact --nocapture --test-threads=1 > cold-mac-proof/red.log 2>&1
          result=$?
          set -e
          cat cold-mac-proof/red.log
          test "$result" -ne 0
          grep -q 'runtime inspection timed out' cold-mac-proof/red.log
          grep -q 'test result: FAILED' cold-mac-proof/red.log
          git checkout HEAD -- crates/node/src/runtime_image.rs
      - name: Verify all real runtime activation boundaries and owned process retirement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p khor-cli --test runtime_image -- --nocapture --test-threads=1 2>&1 | tee cold-mac-proof/green.log
          python3 -m unittest discover -s scripts/tests -p 'test_desktop_installer_processes.py' 2>&1 | tee cold-mac-proof/processes.log
      - name: Preserve formatter output for the source-only checkout
        if: always()
        run: cargo fmt --all && git diff --binary > cold-mac-proof/format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cold-mac-proof
          path: cold-mac-proof
          if-no-files-found: error
  mac-installed-debug:
    if: inputs.slice == 'mac-installed-debug'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Restore the exact signed Intel installer and retain startup diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, zipfile
          out=Path('intel-installed-debug');out.mkdir()
          archive=out/'signed-build.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh','api','repos/colehank/khor/actions/artifacts/13921791620/zip'],stdout=stream,check=True,timeout=180)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='52c8d8e97e1224f2fc622931fe97c3b25286c702e9418e199ac7b11044ea2df9'
          with zipfile.ZipFile(archive) as source:
              entries=[v for v in source.infolist() if v.filename.endswith('.pkg')]
              assert len(entries)==1
              (out/'Khor.pkg').write_bytes(source.read(entries[0]))
          checker=Path('scripts/check-desktop-installer.py')
          text=checker.read_text()
          text=text.replace('raise AssertionError("Packaged serve exited before publishing its endpoint")', 'raise AssertionError("Packaged serve exited before publishing its endpoint: rc="+str(service.returncode)+"\\n"+(Path(temporary)/"serve.log").read_text(errors="replace")[-16000:])')
          old="            if log is not None:\n                log.close()"
          # Keep evidence before TemporaryDirectory removes the private home.
          replacement="\n".join([
              "            if log is not None:",
              "                log.close()",
              "            debug=Path('intel-installed-debug/logs');debug.mkdir(exist_ok=True)",
              "            for n, file in enumerate(Path(temporary).rglob('*')):",
              "                if file.is_file() and (file.suffix in ('.log', '.stderr', '.out') or file.name.endswith('.log.1')):",
              "                    (debug/(str(n)+'-'+file.name)).write_text(file.read_text(errors='replace')[-16000:])",
          ])
          assert old in text
          text=text.replace(old,replacement)
          before='            service = subprocess.Popen('
          monitor="\n".join([
              "            import threading",
              "            debug=Path('intel-installed-debug/logs');debug.mkdir(exist_ok=True)",
              "            monitor_done=threading.Event()",
              "            def observe_startup():",
              "                seen=set()",
              "                with (debug/'processes.log').open('w') as observations:",
              "                    while not monitor_done.wait(0.25):",
              "                        listing=subprocess.run(['ps','-wwaxo','pid=,ppid=,stat=,args='],capture_output=True,text=True,timeout=5).stdout",
              "                        for row in listing.splitlines():",
              "                            if str(temporary) not in row and str(application) not in row and str(directory/'khor') not in row: continue",
              "                            observations.write(str(time.monotonic())+' '+row+'\\n');observations.flush()",
              "                            parts=row.strip().split(maxsplit=3)",
              "                            if len(parts)!=4 or '_runtime_info' not in parts[3] or parts[0] in seen: continue",
              "                            seen.add(parts[0])",
              "                            subprocess.run(['/usr/bin/sample',parts[0],'1','1','-file',str(debug/('sample-'+parts[0]+'.txt'))],capture_output=True,timeout=8)",
              "            observer=threading.Thread(target=observe_startup,daemon=True);observer.start()",
          ])
          assert before in text
          text=text.replace(before,monitor+'\n'+before)
          before='            if service is not None and service.poll() is None:'
          probes="\n".join([
              "            monitor_done.set();observer.join(timeout=12)",
              "            candidates=[directory/'khor',application]+list(runtime.rglob('khor'))+list(runtime.rglob('khor-gui'))",
              "            timings=[]",
              "            for program in dict.fromkeys(candidates):",
              "                if not program.is_file(): continue",
              "                started=time.monotonic()",
              "                try:",
              "                    result=subprocess.run([str(program),'_runtime_info'],env={'KHOR_RUNTIME_DIR':str(runtime)},capture_output=True,text=True,timeout=30)",
              "                    timings.append({'program':str(program),'seconds':time.monotonic()-started,'code':result.returncode,'stdout':result.stdout[-4000:],'stderr':result.stderr[-4000:]})",
              "                except subprocess.TimeoutExpired:",
              "                    timings.append({'program':str(program),'seconds':time.monotonic()-started,'timeout':True})",
              "            (debug/'probe-timings.json').write_text(json.dumps(timings,indent=2))",
          ])
          assert before in text
          checker.write_text(text.replace(before,probes+'\n'+before))
          PY
      - name: Install and start the preserved package without recompiling it
        run: python3 scripts/check-desktop-installer.py --package intel-installed-debug/Khor.pkg --expected-source e23dfce529fd0b6aa18e6801746059128d5bb10a --output intel-installed-debug/proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-intel-installed-debug
          path: |
            intel-installed-debug/logs
            intel-installed-debug/proof.json
          if-no-files-found: warn
  published-rollback:
    if: inputs.slice == 'published-rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/native-tools
        with:
          target: x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend
          path: cached-frontend
          run-id: '43011160399'
          github-token: ${{ github.token }}
      - name: Restore the real verified unchanged frontend required by the CLI
        run: |
          python3 scripts/release_manifest.py verify --root cached-frontend --sha 00555d064314e358d4e613d1df35183284c4a55e --run-id 43011160399 --kind frontend
          git diff --exit-code 00555d064314e358d4e613d1df35183284c4a55e HEAD -- apps/gui/src apps/gui/package.json apps/gui/package-lock.json apps/gui/vite.config.ts crates/catalog
          mkdir -p apps/gui/src
          cp -R cached-frontend/dist apps/gui/dist
          cp -R cached-frontend/gen apps/gui/src/gen
          rustup component add rustfmt
      - name: Embed the actual agent and verify the two real published runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --prefix apps/agent
          node apps/agent/build.mjs x86_64-unknown-linux-gnu apps/agent/dist/khor-agent
          export KHOR_AGENT_BUNDLE="$PWD/apps/agent/dist/khor-agent"
          previous="$RUNNER_TEMP/khor-0.1.15-rc.3"
          timeout 120s gh release download v0.1.15-rc.3 --repo colehank/khor --pattern khor-linux-x86_64.gz --output "$previous.gz"
          echo "92bf83cca3773456f9da55630d4d7819dc52ade3079720b79379121aacf58208  $previous.gz" | sha256sum --check
          gzip --decompress --stdout "$previous.gz" > "$previous"
          echo "499dec3513b3af917be3dc866950081a09224880591f1e6950a0524ef8a8a709  $previous" | sha256sum --check
          chmod 555 "$previous"
          KHOR_TEST_PREVIOUS_BIN="$previous" cargo test --locked -p khor-cli --test serve_keeper an_actual_published_release -- --ignored --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/previous-release.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/previous-release.log"
      - name: Retain formatting from the remote Rust toolchain
        if: always()
        run: cargo fmt --all && git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-rollback
          path: |
            ${{ runner.temp }}/previous-release.log
            ${{ runner.temp }}/format.patch
          retention-days: 7
  windows-install:
    if: inputs.slice == 'windows-install'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Reuse the exact previously compiled Windows MSI and retain installation diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import hashlib, pathlib, subprocess, zipfile
          target=pathlib.Path('windows-install');target.mkdir()
          archive=target/'compiled.zip'
          with archive.open('wb') as output:
            subprocess.run(['gh','api','repos/colehank/khor/actions/artifacts/13849127806/zip'],stdout=output,check=True,timeout=180)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='3fe5eee1862b384873d756d75cb9b9a9b6fa3263a39d14a6154f4bce2f3f26c8'
          with zipfile.ZipFile(archive) as source:
            matches=[item for item in source.namelist() if item.endswith('/khor-windows-x86_64.msi') or item=='khor-windows-x86_64.msi']
            assert len(matches)==1,matches
            (target/'khor-windows-x86_64.msi').write_bytes(source.read(matches[0]))
          # Diagnostics only: retain the real MSI log without changing its actions.
          checker=pathlib.Path('scripts/check-desktop-installer.py')
          text=checker.read_text()
          start=text.index('            result = subprocess.run(["msiexec.exe", "/i"')
          end=text.index('            assert result.returncode',start)
          text=text[:start]+'            result = invoke_msi("/i", package, destination)\n'+text[end:]
          start=text.index('                result = subprocess.run(["msiexec.exe", "/x"')
          end=text.index('                assert result.returncode',start)
          text=text[:start]+'                result = invoke_msi("/x", package)\n'+text[end:]
          helper='''def invoke_msi(action, package, destination=None):
              executable=Path(os.environ["SystemRoot"])/"System32/msiexec.exe"
              log=Path("windows-install/install.log" if action=="/i" else "windows-install/uninstall.log").resolve()
              command=f'"{executable}" {action} "{package}" /qn /norestart /L*V "{log}"'
              if destination is not None: command+=f' INSTALLDIR="{destination}"'
              print("MSI command",command,flush=True)
              try: return subprocess.run(command,timeout=180)
              finally:
                  diagnostic=subprocess.run(["powershell.exe","-NoProfile","-Command","Get-CimInstance Win32_Process | Where-Object Name -match 'msiexec' | Select-Object Name,ProcessId,CommandLine | ConvertTo-Json"],capture_output=True,text=True,timeout=20)
                  Path("windows-install/processes.json").write_text(diagnostic.stdout)
          '''
          # MSI parses PROPERTY="value with spaces", unlike CRT argv quoting
          # which surrounds the entire PROPERTY=value argument.
          import textwrap
          text=text.replace('def windows(package, expected_source):',textwrap.dedent(helper)+'\n\ndef windows(package, expected_source):')
          checker.write_text(text)
          PYCODE
          python scripts/check-desktop-installer.py --package windows-install/khor-windows-x86_64.msi --expected-source 6ffcd3d3b437495f86005539175a72a54ea081a2 --output windows-install/proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-install-diagnosis
          path: |
            windows-install/*.log
            windows-install/*.json
          retention-days: 7
  seen:
    if: inputs.slice == 'sync' || inputs.slice == 'format'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-lifecycle-focused
          save-if: 'false'
      - name: Complete sync crate regression
        if: inputs.slice == 'sync'
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo test --locked -p khor-sync --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/seen.log"
      - name: Export formatter patch for source-only editing
        if: always()
        shell: bash
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
