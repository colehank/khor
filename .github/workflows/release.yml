# One tag, every platform, one place to download from.
#
# **Why zigbuild and not the plain runner toolchain.** A binary built on
# ubuntu-latest carries that image's glibc floor (2.35+), and the
# machines this ships to are Ubuntu 20.04 (glibc 2.31) — it would
# install fine and fail at exec. `cargo-zigbuild` names the floor
# instead of inheriting it, so one artifact runs on 20.04 and on
# everything newer.
#
# **Why not musl, which would have no floor at all.** A fully static
# binary has no dynamic loader, so it can never `dlopen` a driver
# library: measured side by side on one machine, the glibc build read
# `GPU 0% / 2 卡 显存 43.0G/48.0G` and the musl build reported no GPU at
# all (`crates/node/src/vitals/gpu/nvidia.rs`). "Cannot ask" and "there
# is none" are the same empty field, so the floor is the cheaper price.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # **The face is built once, not four times.**
  #
  # `khor web` serves the desktop GUI's own bundle, and that bundle is
  # compiled into the binary (`crates/web/build.rs`) — so every release
  # build needs `apps/gui/dist` on disk before cargo runs, and without
  # it the build stops with a message rather than shipping a khor whose
  # web face is blank.
  #
  # Building it in each matrix leg would be four node installs producing
  # four artifacts that must be identical and have no mechanism making
  # them so. One job, one artifact, downloaded by all four: whatever
  # ships, every platform ships the same one.
  #
  # It needs the rust toolchain as well as node — `npm run build` runs
  # `npm run gen` first, and the wording and the TS types are generated
  # by cargo from `crates/catalog/zh.toml` and the Rust structs, which
  # is what keeps the frontend from holding its own copy of either.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: frontend-gen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
        working-directory: apps/gui
      - run: npm run build
        working-directory: apps/gui
      - uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: apps/gui/dist
          # A face nobody can see is the failure this whole arrangement
          # exists to prevent, so an empty upload must stop the release
          # rather than travel quietly to four builds.
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: x86_64-unknown-linux-gnu.2.31
            asset: khor-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: aarch64-unknown-linux-gnu.2.31
            asset: khor-linux-aarch64
          - runner: macos-latest
            target: aarch64-apple-darwin
            zig: ""
            asset: khor-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            zig: ""
            asset: khor-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Before the toolchain, because `crates/web/build.rs` reads this
      # directory and a missing one is a build error, not a warning.
      - uses: actions/download-artifact@v4
        with:
          name: gui-dist
          path: apps/gui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Only the cross builds need zig; a mac runner builds its own
      # architectures natively.
      #
      # **zig comes from pip, not from a third-party action.** The
      # toolchain publishes itself as a wheel, and cargo-zigbuild looks
      # for `python -m ziglang` — so this is one fewer action to trust
      # and one fewer thing to break when it is renamed (the first cut
      # of this file died on exactly that).
      - if: matrix.zig != ''
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild --locked
      - name: build
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            cargo zigbuild -p khor-cli --bin khor --target "${{ matrix.zig }}" --release
          else
            cargo build -p khor-cli --bin khor --target "${{ matrix.target }}" --release
          fi
      # **Shipped compressed, because the link is the slow part.**
      # Measured from the machines this installs onto: ~95 KB/s, which
      # makes a 29.7 MB binary five minutes of watching a progress bar
      # — and watching it is the first thing a new machine does. The
      # release profile's `strip` takes it to 20.2 MB and gzip to 8.9,
      # so the same install is ninety seconds. `gzip` is on every box
      # that has a shell, so this costs the installer one pipe.
      - name: name it after the platform
        run: |
          cp "target/${{ matrix.target }}/release/khor" "${{ matrix.asset }}"
          gzip -9 "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}.gz" > "${{ matrix.asset }}.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.gz
            ${{ matrix.asset }}.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A dispatch run builds and stops: cutting a release is what a tag
    # means, and a button that quietly publishes is a button somebody
    # presses to "just check the build".
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The installer ships **as a release asset**, not just as a file in
      # the tree. The documented one-liner used to fetch it from
      # `raw.githubusercontent.com`, and that host is unreachable from
      # the machines this is for — measured from turing: raw timed out
      # after 20s with 0 bytes, while `api.github.com` answered in 0.59s
      # and a release download in 1.82s. A distribution route may not
      # depend on a host its own machines cannot reach.
      - uses: actions/checkout@v4
        with:
          path: src
      - run: cp src/scripts/install.sh dist/install.sh
      # **The tag and the crate version have to agree**, because the
      # binary reports the crate version and a fleet is asked "who is
      # behind" through that number. They sat apart for five releases
      # (0.1.0 in the tree, v0.1.5 on the tag), which is exactly as
      # useful as no version at all.
      - name: tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want=$(grep -m1 '^version = ' src/Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, Cargo.toml says $want" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
