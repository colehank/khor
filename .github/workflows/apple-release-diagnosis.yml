name: Apple release diagnosis
on:
  push:
    branches: [probe/apple-release-validation]
permissions:
  contents: read
  actions: read
jobs:
  intel-startup:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - name: Check the public runner and exact Xcode
        run: |
          uname -m
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          if [ "$RUNNER_ARCH" = ARM64 ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          else
            test "$(uname -m)" = x86_64
          fi
      - name: Verify and run the same previously signed Intel App
        run: |
          mkdir -p "$RUNNER_TEMP/startup"
          cd "$RUNNER_TEMP/startup"
          curl --fail --location --silent --show-error --max-time 180 -o app.tar.gz \
            https://github.com/colehank/khor/releases/download/v0.2.0-rc.29/khor-macos-x86_64.app.tar.gz
          echo '73f36657a2ba9638ea191dc15b481982632b4ad6f22c7d483a527e429f020537  app.tar.gz' | shasum -a 256 -c -
          tar -xzf app.tar.gz
          codesign --verify --deep --strict Khor.app
          file Khor.app/Contents/MacOS/khor-gui
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          trace = Path.cwd() / 'startup.tsv'
          env = dict(os.environ, KHOR_STARTUP_TRACE=str(trace))
          for name in ('khor-gui', 'khor'):
              path = Path.cwd() / 'Khor.app/Contents/MacOS' / name
              started = time.monotonic()
              try:
                  raw = subprocess.check_output([str(path), '_release_info'], timeout=30, env=env)
                  info = json.loads(raw)
                  assert info['build']['source'] == 'b0e4d30acd8a7184a1024c17e5803be9e6d3c849'
                  print(name, f'{time.monotonic()-started:.3f}s', info['component'], info['platform'], flush=True)
              finally:
                  if trace.is_file():
                      print(trace.read_text(), flush=True)
          PYCODE
  keyboard:
    strategy:
      fail-fast: false
      matrix:
        harness: [original, corrected]
    runs-on: macos-26
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0aa1ff1225bcb43d4c640f437150cc9c93bd992b
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: matrix.harness == 'corrected'
        with:
          ref: d1c383193250012bd425e04df5598d2897e04721
          path: correction
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: developer-lab-review
          run-id: 45131214103
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lab
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Compare the WKWebView with the same RC30 bundle and real UIKit assertions
        env:
          HARNESS: ${{ matrix.harness }}
        working-directory: product
        run: |
          if [ "$HARNESS" = corrected ]; then
            cp "$GITHUB_WORKSPACE/correction/scripts/khor_lab/mobile.py" scripts/khor_lab/mobile.py
          fi
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          PYTHONPATH=scripts python3 - "$RUNNER_TEMP/lab/developer-lab" "$RUNNER_TEMP/keyboard" "$SIMULATOR_ID" <<'PYCODE'
          import collections
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import urlsplit
          from khor_lab import terminal_keyboard_probe as probe
          bundle, output, simulator = sys.argv[1:]
          source = Path(bundle) / 'index.html'
          original = source.read_text()
          html, count = re.subn(r'<link rel="modulepreload" crossorigin href="/assets/[^"]+">', '', original)
          assert count == 260, count
          if os.environ['HARNESS'] == 'corrected':
              source.write_text(html)
          requests = collections.Counter()
          class ObservedHandler(probe.Handler):
              def log_request(self, code='-', size='-'):
                  path = urlsplit(self.path).path
                  group = 'absolute_asset' if path.startswith('/assets/') else 'lab'
                  requests[group + ':' + str(code)] += 1
          probe.Handler = ObservedHandler
          sys.argv = ['terminal_keyboard_probe', bundle, '--out', output, '--simulator', simulator]
          try:
              probe.main()
          finally:
              requests = dict(requests)
              (Path(output) / 'keyboard-http-counts.json').write_text(json.dumps(requests))
              print('HTTP requests', requests, flush=True)
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: keyboard-${{ matrix.harness }}
          path: |
            ${{ runner.temp }}/keyboard/*keyboard*.json
            ${{ runner.temp }}/keyboard/terminal-keyboard.png
            ${{ runner.temp }}/keyboard/appium.log
          if-no-files-found: warn
          retention-days: 7
