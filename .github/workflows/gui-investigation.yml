name: GUI failure investigation
on:
  push:
    branches: [fix/gui-ci-interactions]
permissions:
  contents: read
  actions: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/gui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          run-id: 41415494469
          github-token: ${{ github.token }}
          path: frontend
      - name: Reuse unchanged generated interfaces from the diagnostic build
        run: |
          git -C ../.. diff --exit-code b8522151e1daedbe3aaf79eebd9524de183d88b3 HEAD -- crates Cargo.toml Cargo.lock
          python3 ../../scripts/release_manifest.py verify --root ../../frontend --sha b8522151e1daedbe3aaf79eebd9524de183d88b3
          cp -R ../../frontend/gen src/gen
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium webkit
      - name: Capture native crashes and wheel event order without rebuilding the app
        run: |
          failed=0
          mkdir -p "$RUNNER_TEMP/gui-investigation"
          for hmr in 1 0; do
            for attempt in 1 2 3; do
              echo "::group::editor hmr=$hmr attempt=$attempt"
              if EDITOR_OVERWRITE_HMR="$hmr" EDITOR_OVERWRITE_CHECK_DIR="$RUNNER_TEMP/gui-investigation/editor-$hmr-$attempt" timeout --kill-after=10s 3m node scripts/check-editor-overwrite.mjs; then
                echo 'editor passed'
              else
                failed=1
              fi
              echo '::endgroup::'
            done
          done
          for attempt in 1 2 3; do
            echo "::group::wheel attempt=$attempt"
            if QUALITY_OUT="$RUNNER_TEMP/gui-investigation/wheel-$attempt" timeout --kill-after=10s 3m node scripts/check-scroll-lifecycle.mjs; then
              echo 'wheel passed'
            else
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
        env:
          DEBUG: pw:browser
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          EDITOR_OVERWRITE_WEBKIT: '1'
          EDITOR_OVERWRITE_SCENARIOS: mine,two-editors,external-aba
          QUALITY_ENGINES: webkit
          QUALITY_HEADLESS: '1'
          QUALITY_ONLY: chat-khor-blur-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-failure-investigation
          path: |
            ${{ runner.temp }}/gui-investigation/**/report.json
            ${{ runner.temp }}/gui-investigation/**/results.json
            ${{ runner.temp }}/gui-investigation/**/*-events.json
            ${{ runner.temp }}/gui-investigation/**/*.png
          if-no-files-found: error
          retention-days: 3
