name: Windows installer reference diagnosis
on:
  push:
    branches: [diagnose/rc19-windows-v1]
permissions:
  contents: read
  actions: read
jobs:
  reference:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch original previously accepted Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: colehank/khor
          run-id: 43940410752
          github-token: ${{ github.token }}
          name: khor-windows-x86_64-app
          path: reference-product
      - name: Trace one original installer check without changing deadlines
        env:
          REFERENCE_REPORT: ${{ runner.temp }}/windows-reference-report
        run: python scripts/diagnose-windows-installer-reference.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-installer-reference
          path: |
            ${{ runner.temp }}/windows-reference-report
            ${{ runner.temp }}/khor-installer-logs
          if-no-files-found: error
          retention-days: 14
