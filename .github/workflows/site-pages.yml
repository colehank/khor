name: Deploy Khor website

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified site to khor.cloud
        type: boolean
        default: true
      release_tag:
        description: Just-published tag to verify before selecting the newest release
        type: string

permissions:
  contents: read

concurrency:
  group: khor-website-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KHOR_SITE_URL: https://khor.cloud
      KHOR_SITE_BASE: /
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/feat/site-story
          path: site-source
          persist-credentials: false
      - name: Reuse the verified interactive demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dd498949fc72b9e0fc1246cb0340e9bfa7115d7f
          path: site-demo
          sparse-checkout: experience/app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            site-source/apps/site/package-lock.json
            site-source/apps/gui/package-lock.json
      - name: Select the public release and verify its downloads
        working-directory: site-source/apps/site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED_TAG: ${{ inputs.release_tag }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/khor-releases.json"
          if [[ -n "$PUBLISHED_TAG" ]]; then
            [[ "$PUBLISHED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
            endpoint="repos/$GH_REPO/releases/tags/$PUBLISHED_TAG"
            for retry in 1 2 3; do
              if gh api -H 'Cache-Control: no-cache' "$endpoint" > "$RUNNER_TEMP/khor-published-release.json" &&
                 jq -e '.draft == false and .immutable == true' "$RUNNER_TEMP/khor-published-release.json" > /dev/null; then
                break
              fi
              [[ "$retry" != 3 ]] || exit 1
              sleep "$((retry * 3))"
            done
            jq --arg tag "$PUBLISHED_TAG" --slurpfile current "$RUNNER_TEMP/khor-published-release.json" \
              'map(map(select(.tag_name != $tag))) + [$current]' \
              "$RUNNER_TEMP/khor-releases.json" > "$RUNNER_TEMP/khor-resolved-releases.json"
            mv "$RUNNER_TEMP/khor-resolved-releases.json" "$RUNNER_TEMP/khor-releases.json"
          fi
          node scripts/select-release.mjs "$RUNNER_TEMP/khor-releases.json" "$RUNNER_TEMP/khor-published-install.sh"
      - name: Build the static website
        working-directory: site-source/apps/site
        run: |
          test -s "$GITHUB_WORKSPACE/site-demo/experience/app/index.html"
          mkdir -p public/experience
          cp -R "$GITHUB_WORKSPACE/site-demo/experience/app" public/experience/app
          KHOR_SITE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export KHOR_SITE_SOURCE_COMMIT
          export KHOR_SITE_INSTALLER="$RUNNER_TEMP/khor-published-install.sh"
          npm ci
          npm ci --prefix ../gui
          npm run tokens
          npm exec -- astro build
          sh -n dist/install.sh
          test -s dist/download/index.html
          test -s dist/download.json
          test -s dist/experience/app/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-source/apps/site/dist

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
