name: Codex adaptor

on:
  pull_request:
    paths:
      - 'crates/node/src/adaptor/**'
      - 'crates/node/tests/fixtures/vendors/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/codex-adaptor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests exercise native file locks as well as both transcript formats.
      - run: cargo test --locked -p khor-node --lib adaptor::codex
