name: Distribute tagged release
on:
  push:
    tags: ['v*', '!v*-*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing rc tag to retry distribution, or stable tag to promote
        type: string
        required: true
      run_id:
        description: RC build run ID (only required for an rc distribution retry)
        type: string
      candidate_tag:
        description: Exact published rc tag when multiple candidates share the stable source
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: distribute-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      rc: ${{ steps.plan.outputs.rc }}
      tag: ${{ steps.plan.outputs.tag }}
      candidate_tag: ${{ steps.plan.outputs.candidate_tag }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: python3 scripts/distribute_candidate.py plan
  testflight:
    needs: plan
    if: needs.plan.outputs.rc == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    environment: apple-testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Fetch the candidate that passed every required check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
        run: python3 scripts/distribute_candidate.py fetch
      - name: Upload once and confirm the exact Apple build
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: python3 scripts/distribute_candidate.py testflight
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight-receipt
          path: testflight.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
  github:
    needs: [plan, testflight]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.testflight.result == 'success' || needs.plan.outputs.rc == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ needs.plan.outputs.run_id }}
      CANDIDATE_TAG: ${{ needs.plan.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the original rc artifacts
        if: needs.plan.outputs.rc == 'true'
        run: python3 scripts/distribute_candidate.py fetch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.rc == 'true'
        with:
          name: testflight-receipt
      - name: Publish the verified assets without rebuilding or overwriting
        run: python3 scripts/distribute_candidate.py publish
  appstore:
    needs: [plan, github]
    if: ${{ !cancelled() && needs.github.result == 'success' && needs.plan.outputs.rc == 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    environment: apple-store
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_TAG: ${{ needs.plan.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Submit the tested Apple build; keep public release manual
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          gem install fastlane --version 2.238.0 --no-document --user-install
          khor_gem_bin="$(ruby -e 'print Gem.user_dir')/bin"
          export PATH="$khor_gem_bin:$PATH"
          python3 scripts/distribute_candidate.py appstore-review
