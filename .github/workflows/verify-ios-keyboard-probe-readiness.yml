name: Verify iOS keyboard probe readiness
on:
  push:
    branches: [verify/ios-keyboard-probe-readiness]
permissions:
  contents: read
  actions: read
jobs:
  keyboard:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ecadc128327d6c3aa5b0c3422c0b6ceff47fc546
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: developer-lab-review
          run-id: '44886196231'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/terminal-keyboard-lab
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - name: Run the readiness patch against the saved failing input
        run: |
          git fetch --no-tags origin 58ed42cd344427f4a462e0c2c8c073d7a2771905
          git show 58ed42cd344427f4a462e0c2c8c073d7a2771905:scripts/khor_lab/mobile.py > scripts/khor_lab/mobile.py
          sudo xcode-select -s /Applications/Xcode_26.5.app
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          PYTHONPATH=scripts python3 -m khor_lab.terminal_keyboard_probe --simulator "$SIMULATOR_ID" \
            "$RUNNER_TEMP/terminal-keyboard-lab/developer-lab" --out "$RUNNER_TEMP/terminal-keyboard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-keyboard-probe-readiness
          path: |
            ${{ runner.temp }}/terminal-keyboard/*keyboard*.json
            ${{ runner.temp }}/terminal-keyboard/terminal-keyboard.png
            ${{ runner.temp }}/terminal-keyboard/appium.log
          if-no-files-found: warn
          retention-days: 7
