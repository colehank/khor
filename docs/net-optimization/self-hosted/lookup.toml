pkarr_put_rate_limit = "smart"
data_dir = "/var/lib/khor-lookup"

[http]
port = 3343
bind_addr = "127.0.0.1"

[dns]
port = 5353
bind_addr = "127.0.0.1"
default_soa = "ns1.devices.example.org. hostmaster.devices.example.org. 0 10800 3600 604800 3600"
default_ttl = 30
origins = ["devices.example.org.", "."]

[metrics]
disabled = true

[mainline]
enabled = false
