<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:var(--body)/1.5 var(--font);font-variant-numeric:tabular-nums;accent-color:var(--accent);caret-color:var(--accent)}::selection{background:var(--fill);color:var(--ink)}button,input,select{font:inherit;color:inherit}button,select{cursor:default}button{min-height:var(--touch);border:1px solid var(--line);border-radius:var(--radius);padding:var(--in) var(--row);background:transparent;white-space:nowrap}button:hover{background:var(--fill)}button:active{background:var(--fill)}button[aria-pressed="true"]{background:var(--fill);border-color:var(--ink)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}select{min-height:var(--touch);max-width:100%;padding:var(--in);border:1px solid var(--line);border-radius:var(--radius);background:transparent}h1,h2,p,figure{margin:0}h1{font-size:var(--title);font-weight:600}h2{font-size:var(--body);font-weight:600}svg{display:block;flex-shrink:0}header{display:flex;align-items:center;justify-content:space-between;gap:var(--gap);padding:var(--in) var(--pane);border-bottom:1px solid var(--line)}header span{color:var(--secondary);font-size:var(--callout)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;max-width:1160px;margin:0 auto;min-height:calc(100dvh - 61px)}.preview{position:sticky;top:0;align-self:start;padding:40px var(--pane) var(--pane);background:var(--canvas)}.hero-stage{display:flex;flex-direction:column;align-items:center;gap:var(--gap);padding-bottom:32px}#hero>svg{width:var(--hero);height:var(--hero)}.hero-info{text-align:center}.hero-info strong{font-size:var(--title);font-weight:600}.hero-info p{color:var(--secondary);font-size:var(--callout);margin-top:4px}.comparison-head{display:flex;align-items:center;justify-content:space-between;gap:var(--in);padding-bottom:var(--gap)}.comparison-head select{font-size:var(--callout)}#comparisons{display:grid;grid-template-columns:repeat(6,minmax(var(--comparison-size,48px),1fr));gap:var(--in);overflow-x:auto;padding-bottom:4px}.comparison{display:flex;align-items:center;flex-direction:column;gap:var(--in);min-width:0}.comparison-avatar{width:var(--preview-size);height:var(--preview-size)}.comparison-avatar svg{width:100%;height:100%}figcaption{color:var(--secondary);font-size:var(--caption);white-space:nowrap}.is-khor figcaption{font-weight:600;color:var(--ink)}.note{font-size:var(--callout);color:var(--secondary);margin-top:var(--gap)}details{border-top:1px solid var(--line);margin-top:var(--pane)}summary{min-height:var(--touch);display:flex;align-items:center;justify-content:space-between;list-style:none;cursor:default;font-size:var(--callout);color:var(--secondary)}summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:var(--input)}details[open]>summary::after{content:"−"}#actual-sizes{display:flex;align-items:end;justify-content:center;gap:var(--gap);padding:var(--in) 0 var(--gap)}#actual-sizes figure{text-align:center}#actual-sizes figure>div{height:64px;display:flex;align-items:end;justify-content:center}#actual-sizes figcaption{margin-top:var(--in)}.controls{border-left:1px solid var(--line);padding:var(--pane);min-width:0}.group{padding:0 0 var(--pane);margin-bottom:var(--pane);border-bottom:1px solid var(--line)}.group>h2{margin-bottom:var(--row)}.group:last-child{margin-bottom:0;border-bottom:0}.button-row{display:flex;gap:var(--in);flex-wrap:wrap}.button-row>button{flex:1}.control{margin-top:var(--gap)}.control-label{display:flex;align-items:center;justify-content:space-between;gap:var(--in)}.control-label span{font-size:var(--callout);color:var(--secondary)}.range-row{display:flex;align-items:center;gap:var(--row);min-height:var(--touch)}input[type="range"]{flex:1;width:100%;min-width:0;height:var(--touch);margin:0;touch-action:pan-y}.numeric{display:flex;align-items:center;gap:4px;min-width:72px;justify-content:flex-end;color:var(--secondary);font-size:var(--callout)}input[type="number"]{width:60px;min-height:var(--touch);border:1px solid var(--line);border-radius:var(--radius);background:transparent;text-align:center;font-size:var(--input);appearance:textfield}input[type="number"]::-webkit-inner-spin-button{appearance:none}.setting{display:flex;justify-content:space-between;align-items:center;gap:var(--gap);min-height:var(--touch);margin-top:var(--in)}.setting input[type="checkbox"]{width:20px;height:20px;margin:var(--row) 0}.machine-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--in)}.machine-choices button{padding:var(--in) 4px;font-size:var(--callout)}.advanced{margin-top:var(--gap)}.advanced summary{color:var(--ink);font-size:var(--body)}.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.primary:hover{background:var(--accent);filter:brightness(.95)}.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--in)}.export-grid .primary{grid-column:1/-1}.save-status{font-size:var(--caption);color:var(--secondary);margin-top:var(--row)}.quiet{border-color:transparent;font-size:var(--callout);color:var(--secondary);padding:var(--in) 0}#notice{position:fixed;bottom:max(var(--pane),env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:var(--in) var(--gap);border-radius:var(--radius);background:var(--ink);color:var(--canvas);font-size:var(--callout);pointer-events:none;z-index:3}#notice:empty{display:none}.header-title{display:flex;align-items:baseline;gap:var(--row)}

<body>
<header><div class="header-title"><h1>会话头像</h1><span>khor</span></div><select data-param="theme" aria-label="预览主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></header>
<main class="layout">
<section class="preview" aria-label="头像预览">
 <div class="hero-stage"><div id="hero"></div><div class="hero-info"><strong>khor</strong><p>标记占比 <b id="size-value"></b></p><p>机器底图 · <span id="machine-value"></span></p></div></div>
 <div class="comparison-head"><h2>会话类型对比</h2><select data-param="compareSize" aria-label="对照头像尺寸"><option value="24">24 px</option><option value="32">32 px</option><option value="48">48 px</option><option value="64">64 px</option></select></div>
 <div id="comparisons"></div>
 <p id="comparison-note" class="note"></p>
 <details><summary>实际尺寸 · 16–64 px</summary><div id="actual-sizes"></div></details>
</section>
<aside class="controls" aria-label="调整头像">
 <section class="group"><h2>标记大小</h2><div class="button-row"><button type="button" data-preset="accepted">定稿 65%</button><button type="button" data-preset="large">放大版</button><button type="button" data-preset="original">现有尺寸</button></div><div class="control"><div class="control-label"><label>占头像直径</label><span>实际图形占比</span></div><div class="range-row" data-range="size" aria-label="标记占比"></div></div><label class="setting"><span>对照图标使用相同占比</span><input type="checkbox" data-param="equalSize"></label></section>
 <section class="group"><h2>机器底图</h2><div id="machine-choices" class="machine-choices"></div><p class="note">来自现有机器头像渲染器的六张样本，同一底图用于所有类型</p></section>
 <section class="group"><h2>标记与底图</h2><label class="setting"><span>标记颜色</span><select data-param="ink"><option value="auto">按机器底图自动</option><option value="dark">深色</option><option value="light">浅色</option></select></label><div class="control"><div class="control-label"><label>标记不透明度</label></div><div class="range-row" data-range="opacity" aria-label="标记不透明度"></div></div><div class="control"><div class="control-label"><label>增加底图衬色</label><span>柔化图案干扰</span></div><div class="range-row" data-range="veil" aria-label="底图衬色"></div></div><p class="note">自动颜色和基础衬色沿用机器头像的原始参数</p>
 <details class="advanced"><summary>调整坛城几何</summary><div class="control"><label>外圆线宽</label><div class="range-row" data-range="outer" aria-label="外圆线宽"></div></div><div class="control"><label>菱形线宽</label><div class="range-row" data-range="diamond" aria-label="菱形线宽"></div></div><div class="control"><label>内圆线宽</label><div class="range-row" data-range="inner" aria-label="内圆线宽"></div></div><div class="control"><label>四颗外珠半径</label><div class="range-row" data-range="satellite" aria-label="外珠半径"></div></div><div class="control"><label>中心珠半径</label><div class="range-row" data-range="core" aria-label="中心珠半径"></div></div><div class="control"><label>内圆半径</label><div class="range-row" data-range="innerRadius" aria-label="内圆半径"></div></div></details></section>
 <section class="group"><h2>保存这一版</h2><div class="export-grid"><button type="button" class="primary" id="export-svg">导出头像 SVG</button><button type="button" id="export-mark">导出单色标记</button><button type="button" id="export-json">导出参数</button><button type="button" id="import-json">导入参数</button><button type="button" id="reset">恢复定稿</button></div><p id="save-status" class="save-status" role="status"></p><input type="file" id="import-file" accept=".json,application/json" hidden></section>
</aside>
</main>

<script type="module">                                                                                                                     
                                                                                                                                                      
                                           
                                                                                                                                                                                                                                                         
const data                                                                              = JSON.parse(document.querySelector('#avatar-data') .textContent );
const defaults         = { size: 65, outer: 40, diamond: 40, inner: 45, satellite: 55, core: 69, innerRadius: 170, opacity: 100, veil: 0, machine: 0, ink: 'auto', theme: 'system', compareSize: 48, equalSize: false };
const limits                                           = { size: [30, 94, .25], outer: [8, 96, 1], diamond: [0, 80, 1], inner: [8, 96, 1], satellite: [0, 76, 1], core: [20, 128, 1], innerRadius: [120, 224, 1], opacity: [30, 100, 1], veil: [0, 35, 1] };
const storageKey = 'khor.session-avatar-tuner.v1';
let params         = { ...defaults };
let uid = 0;
let noticeTimer = 0;
const paths                         = {
    shard: 'M32.414 59.35L50.376 70.5H72.5v-71H33.728L26.5 13.381l19.057 27.08L32.414 59.35z',
    sweep: 'M22.216 24L0 46.75l14.108 38.129L78 86l-3.081-59.276-22.378 4.005 12.972 20.186-23.35 27.395L22.215 24z'
};
function clean(value         )         {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('参数格式不正确');
    const result = { ...defaults };
    const input = value                           ;
    for (const [key, [min, max, step]] of Object.entries(limits)) {
        const number = input[key];
        if (typeof number === 'number' && Number.isFinite(number)) (result                                      )[key] = Math.round(Math.min(max, Math.max(min, number)) / step) * step;
    }
    if (typeof input.machine === 'number' && Number.isInteger(input.machine)) result.machine = Math.min(data.machines.length - 1, Math.max(0, input.machine));
    if (['auto', 'dark', 'light'].includes(String(input.ink))) result.ink = String(input.ink);
    if (['system', 'light', 'dark'].includes(String(input.theme))) result.theme = String(input.theme);
    if ([24, 32, 48, 64].includes(Number(input.compareSize))) result.compareSize = Number(input.compareSize);
    if (typeof input.equalSize === 'boolean') result.equalSize = input.equalSize;
    return result;
}
try { const saved = localStorage.getItem(storageKey); if (saved) params = clean(JSON.parse(saved)); } catch { /* File/private browsing can deny storage. */ }
function mark()        {
    const radius = Math.max(368 + params.outer / 2, 368 + params.satellite, 368 + params.diamond / 2);
    const side = 2 * radius / .92;
    const min = 512 - side / 2;
    return {
        box: `${min} ${min} ${side} ${side}`,
        body: `<g fill="none" stroke="currentColor"><circle cx="512" cy="512" r="368" stroke-width="${params.outer}"/><path d="M512 144L880 512L512 880L144 512Z" stroke-width="${params.diamond}" stroke-linejoin="round"/><circle cx="512" cy="512" r="${params.innerRadius}" stroke-width="${params.inner}"/></g><g fill="currentColor"><circle cx="512" cy="144" r="${params.satellite}"/><circle cx="880" cy="512" r="${params.satellite}"/><circle cx="512" cy="880" r="${params.satellite}"/><circle cx="144" cy="512" r="${params.satellite}"/><circle cx="512" cy="512" r="${params.core}"/></g>`
    };
}
function ink(face      )         { return (params.ink === 'auto' ? face.mark.ink : params.ink) === 'dark' ? '#14140f' : '#ffffff'; }
function avatar(type = 'khor', pixels = 80)         {
    const face = data.machines[params.machine].face;
    const c = face.canvas;
    const id = `face-${++uid}`;
    const blur = face.paint.blur;
    const glyph = type === 'khor' ? mark() : data.glyphs[type];
    const box = c * (type === 'khor' || params.equalSize ? params.size / 92 : .5625);
    const offset = (c - box) / 2;
    const veil = Math.min(.42, face.mark.veil + params.veil / 100);
    // Core-provided ink and veil stay attached to the face, independent of page theme.
    const veilInk = face.mark.ink === 'dark' ? '#ffffff' : '#000000';
    const body = `<defs><clipPath id="${id}"><rect width="${c}" height="${c}" rx="${c * face.radius_ratio}"/></clipPath><filter id="${id}-blur" filterUnits="userSpaceOnUse" x="${-blur * 3.43}" y="${-blur * 3.43}" width="${c + blur * 6.86}" height="${c + blur * 6.86}" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${blur}"/></filter></defs><g clip-path="url(#${id})"><g style="isolation:isolate"><rect width="${c}" height="${c}" fill="${face.background}"/>${face.paint.veins.map(v => `<path d="${paths[v.vein]}" fill="${v.color}" filter="url(#${id}-blur)" transform="translate(${v.dx} ${v.dy}) rotate(${v.rotate} ${c / 2} ${c / 2}) scale(${v.scale})"${v.overlay ? ' style="mix-blend-mode:overlay"' : ''}/>`).join('')}</g><rect width="${c}" height="${c}" fill="${veilInk}" opacity="${veil}"/><svg x="${offset}" y="${offset}" width="${box}" height="${box}" viewBox="${glyph.box}" fill="currentColor" color="${ink(face)}" opacity="${params.opacity / 100}">${glyph.body}</svg></g>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${pixels}" height="${pixels}" viewBox="0 0 ${c} ${c}" role="img" aria-label="${type} 会话头像">${body}</svg>`;
}
function announce(message        )       {
    const node = document.querySelector             ('#notice') ;
    node.textContent = message;
    window.clearTimeout(noticeTimer);
    noticeTimer = window.setTimeout(() => { node.textContent = ''; }, 3000);
}
function render()       {
    const theme = params.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : params.theme;
    document.documentElement.dataset.theme = theme;
    document.querySelector('#hero') .innerHTML = avatar('khor', 224);
    document.querySelector('#size-value') .textContent = `${params.size.toFixed(1)}%`;
    document.querySelector('#machine-value') .textContent = data.machines[params.machine].name;
    (document.querySelector('#comparisons')               ).style.setProperty('--comparison-size', `${params.compareSize}px`);
    document.querySelector('#comparisons') .innerHTML = ['khor', 'Claude', 'Codex', 'Cursor', '终端', 'Agent'].map(type => `<figure class="comparison${type === 'khor' ? ' is-khor' : ''}"><div class="comparison-avatar" style="--preview-size:${params.compareSize}px">${avatar(type, params.compareSize)}</div><figcaption>${type}</figcaption></figure>`).join('');
    document.querySelector('#actual-sizes') .innerHTML = [16, 24, 32, 48, 64].map(size => `<figure><div>${avatar('khor', size)}</div><figcaption>${size} px</figcaption></figure>`).join('');
    document.querySelector('#comparison-note') .textContent = params.equalSize ? '各标记使用相同占比，方便比较视觉重量' : '其他类型保留现有占比；khor 使用左侧当前参数';
    for (const [key] of Object.entries(limits)) {
        const value = (params                                     )[key];
        document.querySelectorAll                  (`[data-param="${key}"]`).forEach(control => { if (document.activeElement !== control) control.value = String(value); });
    }
    for (const key of ['ink', 'theme', 'compareSize']) (document.querySelector(`[data-param="${key}"]`)                     ).value = String((params                                      )[key]);
    (document.querySelector('[data-param="equalSize"]')                    ).checked = params.equalSize;
    document.querySelectorAll                   ('[data-machine]').forEach(button => { button.setAttribute('aria-pressed', String(Number(button.dataset.machine) === params.machine)); });
    document.querySelectorAll                   ('[data-preset]').forEach(button => { button.setAttribute('aria-pressed', String(button.dataset.preset === (params.size === 65 ? 'accepted' : params.size === 80.5 ? 'large' : params.size === 51.75 ? 'original' : ''))); });
}
function save()       {
    try { localStorage.setItem(storageKey, JSON.stringify(params)); document.querySelector('#save-status') .textContent = '已保存在此设备'; }
    catch { document.querySelector('#save-status') .textContent = '当前浏览器无法自动保存，请导出参数'; }
}
function download(name        , content        , mime        )       {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const anchor = document.createElement('a'); anchor.href = url; anchor.download = name; anchor.click();
    window.setTimeout(() => URL.revokeObjectURL(url), 60000);
    announce(`已导出 ${name}`);
}
document.querySelector('#machine-choices') .innerHTML = data.machines.map((machine, index) => `<button type="button" data-machine="${index}" aria-pressed="false">${machine.name}</button>`).join('');
for (const [key, [min, max, step]] of Object.entries(limits)) {
    const slot = document.querySelector(`[data-range="${key}"]`) ;
    const label = slot.getAttribute('aria-label') ;
    slot.innerHTML = `<input type="range" min="${min}" max="${max}" step="${step}" data-param="${key}" aria-label="${label}"><span class="numeric"><input type="number" min="${min}" max="${max}" step="${step}" inputmode="decimal" data-param="${key}" aria-label="${label}数值">${['size', 'opacity', 'veil'].includes(key) ? '<span>%</span>' : ''}</span>`;
}
document.addEventListener('input', event => {
    const target = event.target                                        ;
    const key = target.dataset.param;
    if (!key) return;
    let value         ;
    if (key in limits) { if (target.value.trim() === '') return; value = Number(target.value); if (!Number.isFinite(value)) return; }
    else if (key === 'equalSize') value = (target                    ).checked;
    else if (key === 'compareSize') value = Number(target.value);
    else value = target.value;
    params = clean({ ...params, [key]: value });
    render(); save();
});
document.addEventListener('change', event => {
    const input = event.target                    ;
    if (input.matches('input[type="number"][data-param]')) { input.value = String((params                                      )[input.dataset.param ]); }
});
document.addEventListener('click', event => {
    const button = (event.target           ).closest                   ('button'); if (!button) return;
    if (button.dataset.machine !== undefined) { params.machine = Number(button.dataset.machine); render(); save(); }
    if (button.dataset.preset) { if (button.dataset.preset === 'accepted') params = { ...params, size: defaults.size, outer: defaults.outer, diamond: defaults.diamond, inner: defaults.inner, satellite: defaults.satellite, core: defaults.core, innerRadius: defaults.innerRadius, opacity: defaults.opacity, veil: defaults.veil, ink: defaults.ink }; else params.size = button.dataset.preset === 'large' ? 80.5 : 51.75; render(); save(); }
});
document.querySelector('#reset') .addEventListener('click', () => { params = { ...defaults, theme: params.theme }; render(); save(); announce('已恢复定稿参数'); });
document.querySelector('#export-json') .addEventListener('click', () => download('khor-session-avatar.json', JSON.stringify({ version: 1, ...params }, null, 2), 'application/json'));
document.querySelector('#export-svg') .addEventListener('click', () => download('khor-session-avatar.svg', avatar('khor', 512), 'image/svg+xml'));
document.querySelector('#export-mark') .addEventListener('click', () => { const glyph = mark(); download('khor-session-mark.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="${glyph.box}" fill="currentColor">${glyph.body}</svg>`, 'image/svg+xml'); });
document.querySelector('#import-json') .addEventListener('click', () => (document.querySelector('#import-file')                    ).click());
document.querySelector('#import-file') .addEventListener('change', async event => {
    const input = event.target                    ; const file = input.files?.[0]; if (!file) return;
    try {
        if (file.size > 100000) throw new Error('参数文件过大，请选择导出的 JSON');
        const value = JSON.parse(await file.text());
        if (!value || typeof value !== 'object' || !('size' in value)) throw new Error('请选择头像工具导出的 JSON');
        params = clean(value); render(); save(); announce('已导入参数');
    } catch (error) { announce(error instanceof Error ? error.message : '无法读取参数文件'); }
    input.value = '';
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (params.theme === 'system') render(); });
render(); save();
</script>
