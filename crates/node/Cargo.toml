[package]
name = "khor-node"
version.workspace = true
edition.workspace = true

[dependencies]
khor-acp = { path = "../acp" }
agent-client-protocol = "2"
khor-core.workspace = true
khor-catalog.workspace = true
khor-detect.workspace = true
khor-net.workspace = true
khor-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
iroh.workspace = true
tokio.workspace = true
gethostname.workspace = true
serde_bytes.workspace = true
blake3.workspace = true
portable-pty.workspace = true
sysinfo.workspace = true
jiff.workspace = true
reqwest.workspace = true
gix = { version = "0.87.1", default-features = false, features = ["status", "blob-diff", "revision", "sha1", "max-performance-safe", "merge"] }
# The walk behind `khor search` (工作区第六轮 第 47 条). It is ripgrep's
# own directory walker, and what khor is buying is one thing it will not
# write twice: **`.gitignore` read the way git reads it** — nested
# files, negations, the global one, `.git/info/exclude`. A search that
# returned `target/` and `node_modules/` would answer every query with
# somebody else's code, and a hand-rolled ignore reader is the kind of
# almost-right that goes wrong on the one project that needs it.
# License: MIT OR Unlicense.
ignore = "0.4"
# The app lock's PIN, hashed rather than kept (`crates/node/src/lock.rs`).
# Argon2id at the crate's own defaults, which are the OWASP ones — the
# parameters are a judgment this repo has no business re-deriving, and a
# hand-rolled KDF for a screen lock would be the worst kind of homework.
# License: MIT OR Apache-2.0 (checked before use, not after).
argon2 = "0.5"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
office_oxide = "0.1.11"
pdfboss-output = "2.4.0"
pdfboss-core = "2.4.0"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The one road to a recycle bin, on the three platforms that have one
# (`crates/node/src/files.rs` — the three candidates and what each cost).
# Not on iOS/Android, which have no such place: there `files::remove`
# answers that it cannot, and the face says 直接删 instead of guessing a
# platform (`TRASH_HERE`).
#
# `default-features = false` drops `chrono`, which only dates the items
# in a listing — khor never lists a recycle bin, only puts things in
# one. It costs nothing either way (chrono is already in the tree), so
# this is about compiling less, not about the count.
# `coinit_apartmentthreaded` is the Windows COM mode the crate asks
# callers to pick; with none chosen it does not build there.
# License: MIT, and `urlencoding`'s (its one new neighbour) is MIT too —
# checked before use, not after.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

# The GPU reading is the one part of vitals with no cross-platform API
# behind it, so each platform brings its own and no other platform pays
# for it (crates/node/src/vitals/gpu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys.workspace = true
core-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper.workspace = true
