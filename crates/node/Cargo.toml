[package]
name = "khor-node"
version.workspace = true
edition.workspace = true

[dependencies]
khor-acp = { path = "../acp" }
agent-client-protocol = "2"
khor-core.workspace = true
khor-catalog.workspace = true
khor-detect.workspace = true
khor-net.workspace = true
khor-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
base64.workspace = true
getrandom.workspace = true
iroh.workspace = true
tokio.workspace = true
gethostname.workspace = true
serde_bytes.workspace = true
blake3.workspace = true
portable-pty.workspace = true
sysinfo.workspace = true
jiff.workspace = true
reqwest.workspace = true
gix = { version = "0.87.1", default-features = false, features = ["status", "blob-diff", "revision", "sha1", "max-performance-safe", "merge"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
csv = "1.4.0"
office_oxide = "0.1.11"
pdfboss-output = "2.4.0"
pdfboss-core = "2.4.0"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The GPU reading is the one part of vitals with no cross-platform API
# behind it, so each platform brings its own and no other platform pays
# for it (crates/node/src/vitals/gpu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys.workspace = true
core-foundation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper.workspace = true
