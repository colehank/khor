[package]
name = "khor-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "khor"
path = "src/main.rs"

[dependencies]
khor-node.workspace = true
khor-catalog.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The real-agent gate reaches into the session store to find the host
# socket, the way a face does (`tests/agents.rs`).
khor-core.workspace = true
khor-acp = { path = "../acp" }
agent-client-protocol = "2"
