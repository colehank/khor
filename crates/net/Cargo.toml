[package]
name = "khor-net"
version.workspace = true
edition.workspace = true

[dependencies]
# PEM parsing for `KHOR_RELAY_CA` (endpoint::ca_roots): the rustls already
# in the tree under iroh and khor-cli (Apache-2.0 OR ISC OR MIT), no new
# crate.
rustls = { version = "0.23", default-features = false, features = ["std"] }
khor-catalog.workspace = true
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
# Reading the mdns service's event stream, which is a `Stream` and needs
# a `StreamExt` to consume. iroh's own, so no new version in the tree.
n0-future = "0.3"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
# The signed certificate and roster bodies (`trust`). **Not a new
# package**: iroh already brings it, and it is the codec iroh signs its
# own records with — compact, and one byte string per value, so what the
# root signs is exactly what travels.
# License: MIT OR Apache-2.0 (checked before use).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# The root key as 24 words and back (`root`). The rust-bitcoin one:
# the checksum and the English list are the standard's, so words written
# down today read back in any BIP-39 tool, and a hand-rolled word list is
# the one thing a recovery path must not be homework for.
# License: CC0-1.0 (checked before use; not copyleft).
bip39 = "2"
# The congestion controller khor binds with (`endpoint::transport`): iroh
# takes a factory but does not re-export noq's controllers, so they are
# named from noq-proto itself, the version iroh pins (one copy in the
# tree — the vendored one, vendor/noq-proto/KHOR.md — not a new package).
# License: MIT OR Apache-2.0.
noq-proto = { version = "1.3.0", default-features = false }

[dev-dependencies]
serde_json.workspace = true
# The relay-restart acceptance (批23) embeds a real relay it can kill
# and resurrect — the aliyun one is shared infrastructure, and a test
# that reboots it saws the branch the whole fleet dials on (2026-08-20,
# three reboots = 40 minutes of "unreachable" that was really the
# bridge). Version-locked to the workspace iroh.
iroh-relay = { version = "1.2.0", features = ["server"] }
# The congestion and priority measurement (`tests/congestion.rs`) drives
# the QUIC under iroh directly, through a road it simulates: noq at the
# version iroh pins, and rcgen for the throwaway certificate. Both are
# already in the tree (iroh, iroh-relay); no new package.
# License: MIT OR Apache-2.0 (both; checked before use).
noq = { version = "1.3.0", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
rcgen = "0.14"
