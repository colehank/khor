# ── the app lock (docs/MORE.md 安全) ─────────────────────────────────
# **The PIN is the key every face has**, so the lock cannot come on
# without one: a phone opening the web face has no Touch ID to fall back
# on. Refused rather than quietly switched back off — a switch that turns
# itself off is a screen lying about its own state.
