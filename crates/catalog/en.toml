lock-on = "Locked"
lock-off = "Unlocked"
lock-pin-set = "PIN set"
lock-pin-none = "no PIN yet"
lock-idle-never = "never locks on idle"
lock-idle-after = "locks after {0} idle minutes"
identity-reset = "the identity key is gone; the next khor mints a new one, and to the network that is another machine"
unread = "unread {0}"
unreachable-for = "unreachable for {0}"
