# The English translation of zh.toml. zh.toml is the source of truth:
# every user-facing word is authored there first. Sections, keys, and
# order here mirror zh.toml one for one, and every {0}/{1}/... set must
# match its zh.toml counterpart exactly (count and identity, not order).
# A key present in zh.toml and missing here is a build error (build.rs
# checks the key sets and placeholder sets at compile time). Within a
# section, no two keys may share the exact same English text, same as
# zh.toml. Proper nouns, command names, flags, and vendor names are
# carried over unchanged from zh.toml, never translated.

[state]
busy = "Busy"
blocked = "Blocked"
done = "Done"
errored = "Errored"
failed = "Failed"
idle = "Idle"

[category]
khor = "khor"
shell = "Shell"
unknown = "Unrecognized"

[hop]
direct = "Direct"
relay = "Relay"
quiet = "Not connected"
no-serve = "Serve not running"

[avatar]
axis-palette = "Palette"
axis-variant = "Style"
axis-shape = "Shape"
axis-palette-slot = "Color {0}"

liquid = "Liquid"
monokai = "Monokai"
mocha = "Mocha"
nord = "Nord"
okabe = "Okabe-Ito"
warm = "Warm paper"
# zh.toml deliberately moved the word off "Mandala" (the key stays,
# so devices already on this palette keep it) because the screen
# already carries the boring-avatars family's own vocabulary and this
# palette needed its own name. English keeps that same move rather
# than reintroducing "Mandala": what the set actually is, cream paper
# and ink.
mandala = "Paper & ink"

marble = "Wash"
bauhaus = "Geometric"
beam = "Smiley"

circle = "Circle"
rounded = "Rounded"
square = "Square"

[config]
# The `khor config` key table (docs/MORE.md 设置). Section names, key
# names and value names all cross the wire, so these are data with the
# same shape as the state words and the face options.
appearance = "Appearance"
language = "Language"
general = "General"
session = "Sessions"
workspace = "Workspace"
confirm = "Confirm dangerous actions"

theme = "Theme"
kind-mark = "Kind mark"
lang = "Interface language"
tabs-limit = "Tab limit"
session-form = "New sessions open as"
files-click = "Single click"
# Under "Ask before", so each key names the act rather than repeating
# the question.
confirm-takeover = "Taking over a session"
confirm-delete = "Deleting"

# What is stored is the choice, `auto` included — never the theme it
# resolves to today.
auto = "Match system"
light = "Light"
dark = "Dark"
# Each language names itself, identically in both files: somebody who
# cannot read the interface finds the way out by these two words.
zh = "中文"
en = "English"
chat = "Chat"
term = "Terminal"
preview = "Preview"
pin = "Keep open"
on = "On"
off = "Off"
face = "On the face"
corner = "Corner badge"

[cli]
usage = """
usage: khor <verb>
  id                    this machine's identity
  avatar [machine] [--palette palette] [--colors five colors]
         [--variant style] [--shape shape]
                        a machine's avatar; with no arguments, shows
                        what it is now and what's available, and with
                        no machine, this one. **One copy for the whole
                        network**: anyone may restyle any machine and
                        the later write wins (the road a rename takes).
                        The old name face still answers and goes next
                        version — an avatar is a picture, an interface
                        is a face (see faces)
  devices               the network's machines
  top [machine]         what this machine is busy with: process top
                        and the last 24 hours of CPU
  ls <machine> [path]   that machine's directory (no path = its home
                        directory)
  pull <machine> <file> [directory]
                        pulls a file over from that machine (defaults
                        to the current directory)
  git [status <machine> <repo path> | diff <machine> <file>]
                        that machine's git repo, read-only. status's
                        first line is the branch; each line after is a
                        file that differs from HEAD (M modified / A
                        staged / D deleted / U untracked); diff lists
                        where one file differs — line numbers are the
                        file's current ones, and under each hunk are
                        the original lines from HEAD
  places [machine]      directories that machine has opened sessions
                        in (no machine = this machine)
  ws ls | add [-m machine] <directory> | rm [-m machine] <directory> |
     pin [-m machine] <directory> | unpin [-m machine] <directory>
                        workspaces: "which directory on which
                        machine", set by you — not inferred from git
                        or session records. ls prints one line each:
                        pin mark, name, machine:path; add adds one (no
                        -m = this machine; . works); rm removes it
                        from the table — the directory itself is
                        untouched; pin/unpin puts it at the top
  rm [-m machine] <path>
                        deletes that file or directory. **On this
                        machine it goes to the trash; on other
                        machines and satellites it's deleted outright,
                        unrecoverable** (no trash there). A directory
                        goes with everything inside it; refuses if the
                        path doesn't exist
  mkdir [-m machine] <path>
                        creates a directory on that machine. Only one
                        level — refuses if the parent doesn't exist;
                        also refuses if the name already exists. No
                        -p, no -f
  touch [-m machine] <path>
                        creates an empty file on that machine. Refuses
                        if the name already exists — **it won't empty
                        the existing one**
  mv [-m machine] <old path> <new path>
                        renames something on that machine — crossing
                        directories is the same command. Refuses if
                        the new name already exists; no overwrite, no
                        -f
  launch [-m machine] <path|url>
                        has that machine open this with its own
                        opener (Mac: open, Linux: xdg-open;
                        `KHOR_LAUNCHER` can point to another).
                        **Opens on that machine, not the one in front
                        of you**; only takes absolute paths and
                        http/https URLs. `open` means "open a session
                        on that machine" — that's a different command
  search [-m machine] <directory> <word>
                        finds that word under that directory on that
                        machine: first, files whose names contain it
                        (one path per line), then lines whose content
                        contains it (`path:line: that line`).
                        Case-insensitive, plain substring, not a
                        regex; on this machine it respects .gitignore,
                        on a satellite it only skips .git. Caps out at
                        50 names, 200 lines, 5 seconds — says so on
                        stderr when it hits the limit
  read <machine> <file>
                        reads a document out as text: md/csv/tsv as-is
                        (they're already text); docx/xlsx/pptx, their
                        old formats (doc/xls/ppt), and pdf get
                        converted to markdown. It reads the text and
                        structure, not the layout
  code [--stop] <machine> [repo path]
                        opens VS Code for the web on that machine,
                        prints a local link (the link carries a key;
                        no path = whichever one it last opened). One
                        server per machine — switching projects just
                        switches the link. The first run downloads a
                        server from Microsoft (about 640 MB); never
                        again after that. It's not a session — no row,
                        and close doesn't apply; use --stop to shut it
                        down
  put [--new | --base <base copy>] <machine> <local file> <remote path>
                        writes a local file to that path on that
                        machine (pull's reverse). By default it reads
                        first then writes; if something changed it in
                        between, the whole write is refused — not one
                        byte lands. --new says it differently: there
                        shouldn't be a file there yet; --base gives
                        the copy you started from — if the other side
                        changed, it does a three-way merge: a clean
                        merge gets written, but if anything conflicts
                        nothing is written — the marked-up result goes
                        to stdout with exit code 1
  borrow <machine>      borrows that machine's network: opens a local
                        proxy port — point a browser at it and traffic
                        goes out from there (needs serve running;
                        close that session to shut the port)
  tabs [ls] | open [-m machine] <url> | close|focus|pin|unpin <n|id>
                        the browsing tabs this screen has open. **Local,
                        never replicated**: what is open belongs to this
                        screen, not to the person (places you keep do
                        travel). ls prints the front and pinned marks, a
                        number, the id, the title and the address. pin
                        keeps a tab on top (it won't close until unpinned);
                        unpin lets it go. All four
                        take either: **the number** is the row's place in
                        that listing — what a hand types, and it moves
                        when a tab closes; **the id** names one tab for
                        good, which is what a script should hold
  usage [--days N]      tokens spent per machine, by day and category
                        (defaults to 7 days)
  sessions [--by recent|category|device|state|place] [--all]
                        session list (defaults to recent); --by
                        switches the arrangement; pinned rows stay
                        on top; already-seen old sessions default to
                        just a count, --all lists them all. The list
                        holds what you started, what you imported and
                        each machine's own conversation
  find <word>           one search over sessions, machines, workspaces,
                        browsing tabs and pages (⌘K in the window reads
                        the same list)
  import [<number|id>...]
                        with nothing, lists what can be imported (agents
                        started elsewhere, tmux sessions, ACP
                        conversations), numbered; with numbers or ids,
                        brings those onto the list
  tell <machine> <words...>
                        leaves a message in that machine's window
                        (always taken literally)
  send <machine> <file|words...>
                        sends to that machine: an existing file gets
                        transferred (a summary arrives first, the
                        actual transfer waits for the other side's
                        permission); otherwise it's treated as a
                        message. If your words happen to match a
                        filename, use tell instead
  accept <transfer id>  grants permission and receives the full
                        transfer (run this on the machine receiving
                        the file)
  log <machine>         shows that window's messages
  run [--tui] [--title <name>] -- <command...>
                        a temporary session: lives as long as this
                        terminal, visible on the network the whole
                        time
  open [-d] [--tui|--gui] [--agent <name> [--resume <id>]] [--on <machine>] [--title <name>] [-- command]
                        a persistent session: survives closing the
                        terminal, can be reattached (defaults to
                        attaching; -d just opens it; --gui speaks the
                        ACP protocol — khor draws the conversation —
                        for an agent that speaks it; --agent uses a
                        registered agent (see agents), and implies
                        --gui; --resume continues one of its own
                        listed conversations (see agents sessions);
                        --on opens it on another machine — no command
                        means that machine's own shell; --gui/--agent
                        combined with --on starts that machine's own
                        agent there, taking no command and no
                        --resume)
  accounts [ls]         registered accounts (this machine's Claude Code
                        and Codex logins are each registered on their own
                        the first time they are read, and not again once
                        deleted); add <name>
                        --provider
                        newapi|claude|openai|deepseek|moonshot|
                        moonshot-cn|openrouter [--base-url <url>]
                        [--budget <number>] --key <key>|--key-stdin
                        registers one (the key stays only on this
                        machine); a subscription is add <name>
                        --provider claude|codex --kind sub, with no key
                        — it reads the Claude Code or Codex login on
                        this machine,
                        so whichever machine it's registered on is the
                        one it reads from; rm <id|name> removes one
  quota [--why]         how much each account has used: read live for
                        this machine, from whatever the last sync
                        brought back for the others; --why prints what
                        each way of reading this machine's
                        subscriptions did this time
  attach <session>      attaches to a persistent session (Ctrl-\\
                        detaches); connects to whichever machine the
                        row is on — you don't say which
  takeover <session>    takes over an agent session: ends its
                        terminal, the conversation continues from here
  agents [known | sessions <name> [--ask] | add <name> [...] | rm <name>]
                        registers agents that speak ACP: no arguments
                        shows what's registered. Register once and the
                        whole network knows it (whether the command
                        exists on each machine is only found out when
                        it's started); claude, codex, khor, shell —
                        khor uses those four names itself. known shows
                        the ACP registry snapshot bundled with khor;
                        @<id> uses that snapshot's command directly.
                        sessions shows its conversations (reads what's
                        recorded; --ask actually asks, which starts a
                        process); once asked, the answer syncs across
                        the network — other machines don't have to ask
                        again
  state <word|--hook>   (for process hooks) reports status; --hook
                        reads Claude events from stdin
  seen <session>        marks it read
  rename [-m] <session|machine> [name...]
                        gives it a name (shared across the whole
                        network, layered over its own name); no name =
                        removes it, its own name shows through
                        unchanged; -m renames a machine — that only
                        changes the name people see, the channel name
                        the network archives under doesn't move, so
                        conversations and read status don't move house
  pin [-m] <session|machine>
                        pins it (-m pins a machine); pin it from any
                        machine — it's the same one across the whole
                        network. A directory is pinned as a workspace
                        (ws add, then ws pin); a page with tabs pin
  unpin [-m] <session|machine>
                        unpins it
  close <session>       closes it (stops the session's process; the
                        conversation folds up its row, history and
                        received files stay — a new message brings it
                        back on its own; an imported row only leaves the
                        list, the session itself untouched, and is a
                        candidate again)
  serve                 stays resident: answers others, runs this
                        machine's commands on their behalf, syncs the
                        whole network every 5 seconds (also opens the
                        web access on the LAN — see web)
  relay --dev | --tls-cert cert --tls-key key | --acme domain [--acme-contact email]
        [--token key | --only-mine] [--rate bytes/s] [--metrics addr]
        [--bind addr] [--http addr] [--state dir] | --stats [--state dir]
                        runs a relay on this machine (iroh-relay, the
                        same code). --dev is plain HTTP on port 3340 by
                        default; TLS takes a certificate you have, or
                        --acme gets one from Let's Encrypt. --token
                        admits only clients carrying that shared key;
                        --only-mine admits only the devices on this
                        network's roster and not revoked (the same rule
                        every request here passes), no key typed
                        anywhere.
                        --rate limits each client. Metering keeps totals
                        only — per device how many connections and how
                        long online, plus the relay's bytes — in the
                        --state directory (default .khor/relay);
                        --stats prints that metering and starts nothing
  web [--new]           the web access link: open it on your phone
                        or another computer and you have the whole
                        network. serve is what opens it — this
                        just hands out the key; the link carries the
                        key, so don't paste it into a document that
                        syncs. --new rotates it — every link already
                        handed out stops working
  gui                   opens the desktop app's window (the desktop
                        app is khor-gui, installed alongside khor; if
                        it's not installed, this tells you where to
                        get it)
  faces                 which of khor's interfaces are up on this
                        machine: whether the desktop app is running,
                        whether web access is listening and on which
                        port. **"face" here means an interface, not the
                        avatar** — that one is avatar
  quit                  shuts down: stops this machine's serve and
                        every session host (files all stay — serve
                        again and everything comes back)
  hooks [install|uninstall]
                        shows whether the hooks are installed; install
                        adds them, uninstall removes them (both only
                        touch khor's own entries; doing it twice is
                        the same as doing it once)
  lock [status|on|off|pin|timeout minutes]
                        the password on the screens (the app window and
                        web access). It does NOT lock this terminal —
                        whoever types khor is already logged in here.
                        No arguments shows the current state; pin reads
                        one line from standard input (so it stays out of
                        argv, shell history and ps), and an empty line
                        clears the PIN, which turns the lock off with it;
                        timeout takes 0/1/5/15/60 (0 is never). The
                        macOS app can also open with Touch ID — an extra
                        key, never the key: the PIN is the one every
                        face has
  config [list | get <key> | set <key> <value>]
                        this machine's own preferences (they don't
                        travel the network). No arguments is list, one
                        line per setting with the value it has now —
                        every setting, not only the ones that were set.
                        An unknown key, and a value a key doesn't take,
                        are each refused by name; the refusal for a
                        value names the ones it does take
  doctor [--json] [--fix <check>]
                        checks this machine over: one line per check —
                        name, state (ok / warn / failed / not measured)
                        and a sentence. Not measured is NOT ok — it
                        means nothing was read. Each check has three
                        seconds of its own, so one that hangs doesn't
                        hold up the rest. --json prints it raw (the GUI
                        page reads the same answer); --fix runs one
                        check's remedy (checks that have one say so at
                        the end of their line)
  invite                issues a one-time pairing ticket (requires
                        serve running)
  pair <ticket>         joins the network with a ticket
  adopt <ssh host> [name]
                        brings an ssh-only machine into the network (a
                        satellite): identity comes from your
                        known_hosts, everything runs on its behalf
                        through this machine; to remove it, use
                        forget. Requires passwordless ssh (one that
                        prompts for a password can't connect)
  pending [--json]      what waits for the root holder: machines paired
                        in that have no certificate yet, satellites
                        adopted by a machine without the root, machines
                        removed elsewhere and not revoked yet. One line
                        each: id, name, what it waits for
  approve <machine>     on the machine holding the root: signs a waiting
                        machine's certificate (or its revocation) and
                        syncs it to the network right away
  revoke <machine>      on the machine holding the root: once the network
                        has the new roster, nobody answers that machine.
                        It stays in the table; forget removes the row too
  root [show [--json] | words <this machine> | recover <24 words> | init]
                        the user's root key: it only signs (which
                        machines are yours), never connects or encrypts.
                        show says which root this machine trusts, whether
                        it holds it and the roster's version; words
                        prints the 24 recovery words (type this machine's
                        name to see them); recover restores the root onto
                        this machine; init gives a network from before
                        roots its root and signs every machine in the
                        table. Bare, it prints the store path (for the
                        installer)
  sync                  syncs with the whole network right now
  mcp                   exposes khor's commands as tools (for
                        agents, not for typing by hand)
  version               which version is installed on this machine
                        (see devices for versions across the network)
  forget <machine>      removes a machine from the network: nobody
                        recognizes it anymore, and it can no longer
                        see the network either. To come back it has to
                        pair again (issue a ticket from a machine that
                        still recognizes it)
  leave <this machine>  takes this machine out of the network: sends
                        "I'm leaving" while the connections are still
                        up, then empties this machine's table down to
                        itself and drops what the others left here.
                        This machine's own sessions, workspaces,
                        identity and settings are untouched. Typing
                        this machine's name is the confirmation (the
                        same rule forget follows). A fresh ticket and
                        pair bring it back in
  pause                 pauses this machine's place in the network: it
                        stops syncing with the others and they see it
                        offline, while its own sessions, workspaces and
                        web access go on working. A restart is still paused
  resume                resumes it: syncing again, and the next round
                        catches up
                        pause <machine> pauses talking to that one machine
                        only: not dialling it, not answering it, not syncing
                        with it; it keeps running, and devices marks its row
                        (paused). resume <machine> puts it back
  watch <machine> [directory ...]
                        has a machine watch the volumes those
                        directories sit on (shared across the whole
                        network — that machine's row in devices prints
                        how much space is left for each); no
                        directories = clears the watch"""
this-machine = "(this machine)"
watching = "{0} watching: {1}"
watching-none = "{0} isn't watching any directories"
in-use = "(current)"
pinned-mark = "(pinned)"
# The mark after 「(this machine)」 while it is paused (docs/MORE.md
# 暂停). Apart from the road column: a road says how this machine
# reaches that one, pausing is this machine's own state.
paused-mark = "(paused)"
group-header = "── {0}"
group-pinned = "Pinned"
name-separator = ", "

# ── `khor doctor`'s checklist (docs/MORE.md 自检) ─────────────────────
# One row per check: a name, a state, one sentence for a person, and a
# remedy where khor has one. **The sentence is chosen on the node side**
# — what a row says has no one shape to model — so what lives here is
# the wording, not the choosing. CLI and GUI read the same entries.
doctor-name-version = "Version"
doctor-name-identity = "Identity key"
doctor-name-store = "Local data"
doctor-name-serve = "Resident"
doctor-name-web = "Web access"
doctor-name-relays = "Relays"
doctor-name-peers = "Other machines"
doctor-name-roads = "Connections"
doctor-name-hooks = "Hooks"
doctor-name-agents = "Agents"
doctor-name-vscode = "VS Code"
doctor-name-disk = "Disk headroom"
doctor-name-launcher = "Opener"
doctor-name-roster = "Roster"
# The four states. **Untaken is not ok**: a green row means somebody
# looked, and not having looked is a different fact.
doctor-ok = "OK"
doctor-warn = "Attention"
doctor-fail = "Error"
doctor-unmeasured = "Untaken"
# One check overran its own budget. The name rides along: a row that
# vanished would read as a clean bill.
doctor-timed-out = "no answer in {0}s"
# What a remedy says it did.
doctor-fixed-chmod = "the key is readable by you alone again"
doctor-fixed-hooks = "hooks reinstalled"
doctor-fixed-serve = "a resident was started"
doctor-no-fix = "khor cannot mend this one: {0}"
# The hint at the end of a mendable row. **It names the check's own
# key**, because that is what `--fix` takes.
doctor-fixable = "khor doctor --fix {0}"
# The GUI page's two actions. The CLI has neither: checking again is
# typing it again, and the remedy is printed at the end of the row.
doctor-again = "Check again"
doctor-mend = "Repair"
# The three groups the healthy checks fold under. Which check belongs to
# which is the node's (`khor_node::doctor::group`), beside the key table.
doctor-group-machine = "This machine"
doctor-group-network = "Network"
doctor-group-tools = "Tools"
# The verdict line. "All good" only when every check is ok: a check that
# could not be taken is not a check that passed.
doctor-all-well = "All good"
doctor-needs-you = "{0} need looking at"
doctor-well-count = "{0} fine"
# ── `khor faces`: which of khor's interfaces are up here ─────────────
face-name-app = "Desktop app"
face-up = "Open"
face-down = "Not open"
face-at = "port {0}"
face-current = "Current"
# ── what each check says ──
doctor-version-split = "the command line is {0}, this one is {1}"
doctor-version-no-cli = "no khor command on this machine"
doctor-identity-ok = "there, readable by you alone"
doctor-identity-loose = "others can read it too (mode {0})"
doctor-identity-gone = "not there: {0}"
doctor-identity-unreadable = "cannot read it: {0}"
doctor-store-ok = "opens, takes a write, holding {0}"
doctor-store-shut = "cannot write to it: {0}"
# Two halves, told apart: a live pid on file and a socket that answers
# fail separately, and "not running" would send somebody to start a
# second one.
doctor-serve-ok = "running (pid {0})"
doctor-serve-none = "not running"
doctor-serve-deaf = "pid {0} on file, but it does not answer"
doctor-serve-many = "this machine is running {0} serves: {1}"
doctor-serve-one-of = "pid {0} (store {1})"
doctor-web-ok = "port {0} is listening, key is there"
doctor-web-nokey = "port {0} is listening, but the key file is missing"
doctor-web-quiet = "nothing is listening on port {0}"
doctor-relay-ms = "{0} {1}ms"
doctor-relay-quiet = "{0} out of reach"
doctor-relays-none = "no relay at all"
# A peer's version comes off its readings, never a question of its own,
# so a machine khor has not heard from has none — an answer, not a gap.
doctor-peer = "{0} {1} {2}"
doctor-peer-behind = "{0} {1} {2}, not what this one runs"
doctor-peer-mute = "{0} {1}, version unknown"
doctor-peers-alone = "not paired with any machine yet"
# What the checklist says while this machine is paused (docs/MORE.md
# 暂停). Not a warning: it is doing what it was told.
doctor-peers-paused = "Paused — not syncing with the others, and they see this machine offline. To resume: khor resume"
doctor-peers-unread = "cannot read the machine table"
doctor-road = "{0} first reply {1}ms, direct {2}/{3}"
doctor-road-fresh = "{0} first reply {1}ms"
doctor-roads-none = "serve has not dialled another machine since it started"
doctor-roads-no-serve = "serve is not running, so there are no connection readings"
doctor-roads-unanswered = "serve did not answer (it may be older than this khor)"
doctor-road-unread = "link unread"
doctor-wires = "Wires: {0} dialled ({1} failed), late answers {2}, readings asked again {3}"
doctor-wires-retired = "let go — silent {0}, not responding {1}, closed {2}, network changed {3}, new endpoint {4}"
doctor-wires-reads = "readings — direct {0}, relay {1}, not connected {2}; network changes {3}; status questions timed out {4}"
doctor-wires-peer = "{0}: {1} failed dials, {2} not responding"
doctor-hooks-ok = "every claude hook is installed"
doctor-hooks-part = "{0} event hook(s) missing, or pointing at another khor"
doctor-hooks-unread = "cannot read claude's settings"
doctor-agents-ok = "all {0} registered command(s) found"
doctor-agents-missing = "command not found: {0}"
doctor-agents-none = "no agent registered"
doctor-agents-unread = "cannot read the agent registry"
doctor-vscode-ready = "{0}, server already fetched"
doctor-vscode-fetch = "{0}, server not fetched yet (the first open fetches it)"
doctor-vscode-none = "no code on this machine"
doctor-disk = "{0} / {1}, {2} left"
doctor-disk-unknown = "cannot say how much is left on this volume"
doctor-launcher-ok = "uses {0}"
doctor-launcher-missing = "{0} is not on PATH"
doctor-launcher-none = "this machine has no opener"

# ── what `khor lock` prints (docs/MORE.md 安全) ───────────────────────
# One line, three fields: whether the faces lock, whether there is a key,
# and how long idle before one locks itself. **It locks the screens, not
