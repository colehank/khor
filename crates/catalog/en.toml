# khor's verbs as an agent's tools (`khor_node::mcp`). A model reads
# these and repeats them to a person: the reading three say they change
# nothing, the acting three say what they do next to their names.
mcp-devices = "Every machine on the network, with its CPU/memory/disk/GPU right now. Reads only; changes nothing."
mcp-sessions = "Every session on the network: id, state word, title, and which machine it's on. Reads only; changes nothing."
mcp-ls = "Lists a directory on a machine. Without a path, that machine's home directory. Reads only; changes nothing."
mcp-ls-machine = "The machine's name (as devices lists it)"
mcp-ls-path = "An absolute path; omitted means the home directory"
mcp-open = "Opens a persistent session on a machine running one command. **This starts a process on that machine.**"
mcp-open-machine = "Which machine to open it on"
mcp-open-command = "The command to run (handed to that machine's shell)"
mcp-open-title = "What the row is called; omitted means the command itself"
mcp-open-cwd = "Which directory to run in; omitted means that machine's home directory"
mcp-close = "Closes a session. **This ends the process on that machine.**"
mcp-close-session = "The id of the session to close"
mcp-tell = "Leaves a line in a machine's window. **Whoever is there will see it.**"
mcp-agents = "List local ACP agents and configured A2A agents, or agents on a paired khor home named by machine. A2A cards include skills and selected HTTP interface. Availability means configured/program present, not authenticated or reachable now."
mcp-agent-disconnect = "Disconnect an a2a:<name> registration on the selected khor home (default here). Existing task receipts remain queryable and cancelable."
mcp-agent-connect = "Connect a native A2A v1 agent by Agent Card URL or service base URL. The remote machine needs no khor. The name is returned as a2a:<name>. Omit machine to use this khor execution home. No secrets in arguments; bearer setup uses khor agents connect <name> <url> --token-stdin locally."
mcp-delegate = "Delegate to a registered ACP agent or a native a2a:<name> agent. Omit machine for this khor home; native A2A targets need no khor on the remote machine. Starting is not completion: task_wait until terminal or input required. Use context for a follow-up; use task plus the user reply for an A2A task awaiting input. Never infer user approval. Retry only identical arguments and request ID; uncertain A2A sends are reconciled without replay."
mcp-task-status = "Read the durable status, partial output, revision and pending permission of a delegated task."
mcp-task-wait = "Wait for task changes, a terminal state or required input. revision is the latest decimal string. For ACP khor.approval ask the user before task_answer. For A2A TASK_STATE_INPUT_REQUIRED, ask the user and send their reply via delegate with task/context and a new request ID. AuthRequired may need credential setup."
mcp-task-cancel = "Request cancellation of a delegated task. Confirm task status; cancellation intent alone does not prove the agent stopped."
mcp-task-answer = "Answer the exact pending ACP permission after user approval. Use its ask ID and a listed option ID; omit option to dismiss. Never infer approval from the delegation itself."
mcp-task-list = "List this caller device's task receipts for an agent, optionally by context or after cursor. Follow returned next for another page. Native A2A lists are cached receipts (cached=true); use task_status or task_wait for a fresh reading."
mcp-listing-cut = "…(there's more; this listing was cut)"
mcp-open-needs-command = "open needs a command"
mcp-closed = "Session closed"
mcp-told = "Message delivered"

