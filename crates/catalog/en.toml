# Characters, not digits: refusing a longer passphrase for having letters
# in it would be refusing the stronger answer.
lock-pin-too-short = "A PIN is at least {0} characters"
# An unreadable hash is khor being broken, **not a wrong PIN**. Folded
# into one word, somebody retypes a correct PIN forever.
lock-cant-hash = "this machine's PIN record cannot be read: {0}"
lock-no-such-timeout = "no such step: {0} (there are {1})"
