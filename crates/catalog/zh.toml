# 「记账那半只认 khor 自己认得的」is the honest half of the reason: a
# session filed under `claude` would look covered by the claude line in
# 用量, which counts only what the claude adaptor read off disk.
agent-name-blank = "得给它起个名字"
agent-name-reserved = "这个名字 khor 自己在用: {0}(claude、codex、khor、shell 都留着)"
agent-needs-a-command = "得说清它怎么起:khor agents add <名字> -- <命令...>"
# 拿注册表快照里的一个 id 去登记(`@<id>`,或者界面上那颗「接进来」),
# 两种失法。**从 [cli] 挪到这儿是因为它们不再只有一张脸**——2026-08-31
# 起 `Node::known_argv` 是两张脸共用的那一个判断。
#
# 下面两句必须读起来不一样:第一句是「没这个东西」,第二句是「有,而且
# 好好的,只是 khor 没有它的启动命令」。合成一句的话,18 个发二进制的
# agent 会被读成「接不了」。
agents-unknown-id = "快照里没有这个 id: {0}(khor agents known 看有哪些)"
agents-id-not-startable = "{0} 是自己装的那一类,khor 没有它的启动命令——装好之后: khor agents add <名字> -- <命令...>"
# 续一段对话,而这段对话不在 khor 记下来的那批里。**不是「找不到」,是
# 「没问到过」**——两张脸都拿记下来的那条记录里的目录去续(`session/load`
# 得报出这段对话当初开在哪儿,真适配器会拒绝对不上的),所以一个没被记过
# 的 id 缺的不是它自己,是它的地址。说清下一步是「去问那个 agent」,
# 不然人会以为这段对话没了。
resume-unknown-session = "没问到过这段对话: {0}——先问一次 {1}"
# khor 要起一个程序,而它的命令在 PATH 上找不到。
#
# **这句话存在的理由是它之前说的是别的**,而且是两次,同一个病灶两处
# 出口。2026-08-31:`khor serve` 是 launchd 起的,拿的是
# `/usr/bin:/bin:/usr/sbin:/sbin`——
#
#   - `npx` 在 `/opt/homebrew/bin`。注册表里 22 个「khor 起得来」的全是
#     npx 行,于是界面上一个都起不来,而屏幕上写的是「这个 agent 没起来,
#     或者它不说 ACP」。**一句关于别人家软件的错结论。**
#   - `tmux` 也在 `/opt/homebrew/bin`。于是在界面上切到任何一个 tui 行的
#     终端,宿主一落地就死在 exec 上,而屏幕上写的是「宿主没在 5 秒内
#     就位」。**一句关于速度的错结论**——那件事一秒都没花,它是当场不可能。
#
# 两次都指着一个没坏的东西。所以这句必须带上那个可执行文件的名字,和
# khor 到底在哪儿找过——两个事实两个下一步:装上它 / 这条命令写错了。
# PATH 很长,照样整条印出来:**把答案裁掉的短句子,不比长句子好。**
#
# **键名不带 agent**:同一句话现在也归终端用,而一个只描述了一半用处的
# 键名,会掩护下一个把它读窄了的人。
command-not-found = "找不到这个命令: {0}。khor 在这条 PATH 上找过: {1}。装上它,或者设 KHOR_PATH 指给 khor"
no-such-dir = "没有这个目录: {0}"
# Two machines sharing one home (a cluster's NFS export is the usual
# way) would share one identity. Says whose it is and what to do, in
# that order — the fix is one line and the user has to know which line.
# The binary this process runs from was deleted and nothing is at its
# path any more — an upgrade that moved it, usually. Says what to do:
# the resident process cannot spawn anything until it is restarted from
# a file that exists.
# A fixed-target pipe could not open its stream. Only ever seen in a
# log: the terminal protocol has no room to say it.
tunnel-pipe-failed = "管子接不到 {0}: {1}"
self-moved = "khor 自己的程序不在 {0} 了(升级或搬走了),重启 serve"
# What the scheduler is told about itself, appended to the vendor's own
# system prompt (docs/AGENT.md). Short on purpose: the tools carry their
# own descriptions, and a long brief competes with the user's actual
# request for the model's attention. The one thing prose must say is the
# thing no tool schema can — that the machines are *somebody's*, and
# that reading is free while moving is not.
agent-brief = """你接在 khor 上:一张连着这个人所有机器的网。\
khor 那组工具是你的手——devices/sessions/ls 是看,随便用;\
open/close/tell 会在别人的机器上留下痕迹,用之前说清楚你要做什么。\
这些机器是这个人的,不是测试环境。"""
store-belongs-to = "这个仓是 {0} 的,这台是 {1}。共用 home 的机器各要一份:给这台设 KHOR_HOME"
