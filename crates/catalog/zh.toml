# Three answers to one miss, because a miss has three causes and they
# call for three different next moves. `no-such-transfer` is the one
# with nothing pending behind it — a live session id handed to accept, a
# mesh of one. The other two are what a miss means on a machine with
# peers, and they were the same sentence until 2026-08-27: accept
# refused an id that had merely not been replicated yet with the words
# for an id that does not exist, so the only way through was to guess
# which one had happened and run it again ten seconds later.
#
# The line between them is not wording, it is the outcome of one full
# sync round: every machine answered and it is still missing = it is
# missing; somebody did not answer = khor does not know, and 不知道 may
# not be painted as 没有 (docs/SESSION.md 离线不是第七个词, same rule).
no-such-transfer = "没有这个传输: {0}"
transfer-absent-after-sync = "没有这个传输: {0}(网里每台机器都同步过一轮了,这个号多半是错的)"
