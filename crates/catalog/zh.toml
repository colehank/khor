# Why anybody would press it. **完成 is the whole of what the hook buys**
# — `adaptor::claude::hook` maps SessionStart/UserPromptSubmit/Stop/
# Notification, and `Stop` is the only source of 完成 **for discovered
# sessions** (docs/HOOKS.md; an ACP-opened session is the other
# first-hand witness — khor is the end the turn ends at, `gui_host`). It does **not** produce 中断: there is no State::Errored
# on that path at all, so promising one here would be a word khor cannot
# keep. Reading the disk already gives 忙碌/待批/空闲/失败.
#
# **Rewritten 2026-08-27, and what changed is who the sentence is
# addressed to.** It read「装上钩子,claude 答完一轮才报得出「完成」,不装只
# 显示成空闲」— three mechanism facts (something gets installed, the
# vendor's program is what it is installed into, and a state word is
# derived from a report) for a person who is looking at a button and
# asking one question: what do I get. What they get is a word they
# already read every day in the list, so the answer is said in that
# word and in no others (docs/UX.md 文案: 不解释实现).
#
# It is drawn **only while the hook is not installed** (`MachineCard`),
# which is the other half of the same judgment: before pressing this is
# the reason to press, after pressing it is a remark about a thing
# already true — and a remark nobody asked for is 装饰性说明, which this
# repo zeroes rather than shortens.
