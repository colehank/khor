web-face-down = "serve 在跑，但 {0} 这个地址问不出话来，所以这条链接发出去也是打不开的。\n  两种常见原因：那个口被别的东西占着（看一眼 serve 的输出，或设 KHOR_WEB_PORT 换口），\n  或者系统防火墙没放行 khor——macOS 第一次会弹框问「是否允许接受传入连接」，\n  点过「拒绝」或者没人在跟前点，它就会像这样：握手连得上，数据一个字节也不给"
# A machine running an older khor answers the process-top / CPU-day
# op with Refused. Said as a fact about its version, never as "no
# processes": the empty face is the other reading, and it points at a
# machine that is not idle.
#
# **Only for a refusal that carries no words of its own.** It used to be
# printed for *every* refusal of a Load, and on 2026-09-04 ordering by
# PID on a remote printed it while that same machine answered its top
# and its day chart on every other column in the same second. Note what
# went wrong: the far side really was an older khor, so the first half
# was true — it is the second half, 「还报不了进程和 CPU 走势」, that
# turned one unreadable word into a whole broken op. A guess that is
# right about the cause can still send the reader to fix the wrong
# thing.
load-predates = "那台机器上的 khor 版本较旧，无法报告进程和 CPU 趋势"
# What the far side actually said. Its own words rather than a guess at
# what they mean: a refusal that reaches here with a reason in it is the
# one case where the machine on the other end has already answered the
# question, and translating that answer into a sentence about its
# version is how a working machine gets blamed for a frame it merely
# could not read.
load-refused = "那台机器拒绝了这次读取：{0}"
# ⚠️ **`workspaces-predates` / `workspaces-refused` were deleted here on
# 2026-09-14** (工作区批①). They said a machine could not list its
# workspaces, and nothing asks a machine that any more: the list is a
# replicated table read off this disk (`khor_sync::workspaces`), so
# there is no refusal to translate.
#
# Refused by `khor ws add`: the path on that machine is not a directory.
# **Only this machine's own filesystem answers with this sentence** — a
# path on another machine is probed with `Ls`, and that machine's own
# words about why it could not list it are better than this one
# (the `load-*` pair's lesson above).
ws-not-a-dir = "这不是一个目录：{0}"
# A path that is not inside any checkout, asked a git question. **Not
# an error about khor** — it is a fact about where the file is, and the
# same sentence covers both「你打开的不是仓库」and「这个文件在仓库外」.
no-checkout = "这个路径不在 git 仓库里"
# git's two ops refuse as one pair, not four sentences. A khor old
# enough to lack the status op lacks the diff op too — they shipped in
# the same batch — so splitting them would be two keys for one version
# fact, and the second one would never be the one a person sees.
# Split from each other on the `load-*` pair's measured lesson: a
# refusal that carries words repeats them, and only a wordless one gets
# blamed on the version.
git-predates = "那台机器上的 khor 版本较旧，无法读取 git"
git-refused = "那台机器拒绝了这次 git 请求：{0}"
git-history-satellite = "这台机器经由 ssh 接入，khor 读不到它的 git 历史"
chat-ended = "这段对话已结束"
# An older khor asked to save a file. **Only the wordless refusal gets
