# 那一格下面那句。
#
# ⚠️ **墓碑:`accounts-unit-keep`(「留空就用平台报的」)活了一天,2026-09-07 撤。**
# 它不是措辞不好,是**它描述的那个行为被用户否掉了**:那天上午留空的意思还是「用平台
# 报的那个码」,当天下午用户裁「默认是 $」,于是同一句话开始描述一件不再发生的事。
# **一句写得很准的、关于旧行为的话,比一句含糊的话更危险**——含糊的话没人敢照着推,
# 它敢。
#
# **这一格空着的意思和密钥那格不一样**,所以两句不复用:密钥空着是「不动已存的」,
# 这一格空着是「用默认那个符号」。
#
# 符号本身不进这句文案,是当参数递进来的——`$` 是记号不是词,和 `·`、`¥` 一样,
# 这个仓的规矩是记号不进目录(它在每一种语言里都是同一个记号,没有可译的东西)。
