# which is exactly the ten-second guessing this was written to end — so
# the line carries the shape of the silence, not just its existence:
# how many machines are about to be asked, and what one that is off
# costs. Both numbers are read off the thing itself (the device table,
# `khor_node::link::dial_budget_seconds`); neither is a guess, and a
# printed worst case that is not true would be worse than no line.
syncing-for-offer = "本机还没有这笔传输的记录，先同步一轮；需要询问 {0} 台机器，无法联系的每台最多等待 {1} 秒"
pulled = "收下了，这一趟拉了 {0} 字节"
pulled-to = "拉了 {0} 字节，落在 {1}"
