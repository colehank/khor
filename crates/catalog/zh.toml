#
# Before it, the indicator appeared only until the first chunk landed,
# on the reasoning that the stream itself then says the turn is alive.
# That is true of a turn that is *printing* and false of the case a
# person actually wonders about: a tool call two minutes deep prints
# nothing, and a stream that has stopped moving looks exactly like a
# stream that has finished. So it stands for the whole turn now, and it
# carries the one fact the stream cannot carry.
