# ── the wire between machines (node) ──
request-unreadable = "读不完请求: {0}"
cant-write-reply = "写不出应答: {0}"
bad-invite = "配对码不对,或已经被用过了"
# A separate word from the one above, because the two have different
# fixes: a wrong or spent code means look at what you pasted, an expired
