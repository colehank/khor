chat-image-too-big = "这张图 {0}MB,超过 {1}MB 发不出去"
# This conversation's own context, as a share of the window the agent
# reported. **Not a token count**: the numbers are six digits long and
# nobody acts on them, while "how full" is the one thing a person
# decides from — whether to keep going or start a new conversation.
#
# The word is 上下文 rather than 记忆 or 窗口: it is the agent's own
# vocabulary, so a person who has seen it anywhere else already knows
# what it counts, and this face does not get to rename it.
#
# It says nothing until an agent reports a window. That is not a
# fallback — a share needs a denominator, and khor's 垫片 refuses to
# invent one (`cagent::window_in`), so no reading and a reading of zero
# must not look the same here.
chat-context = "上下文 {0}%"
# What this conversation has cost, when the agent reports it. Cumulative
