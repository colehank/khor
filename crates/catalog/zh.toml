doctor-group-machine = "本机"
doctor-group-network = "网络"
doctor-group-tools = "工具"
# 顶上那一句结论。**「一切正常」只在一项不落全是好的时候说**:
# 未量的那些不算正常——「看过了」和「没看成」是两件事,页面把它们
# 混成一句,就是在替一台机器打包票。
doctor-all-well = "一切正常"
doctor-needs-you = "{0} 项需要注意"
# 收起来那一行。点开才展开。
