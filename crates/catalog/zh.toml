# The one wording file (docs/UX.md 文案): every user-facing word lives
# here and only here. Keys are stable and travel the wire; words are
# looked up at the last moment. {0}/{1} are positional arguments.
# Within a section, two keys may not share one text — refusing by name
# needs names that differ (enforced at build time).

[state]
busy = "忙碌"
blocked = "待批"
done = "完成"
errored = "中断"
failed = "失败"
idle = "空闲"

# Whose session a row is (khor_core::Session::category). **Vendor names
# are deliberately absent**: `claude` and `codex` are proper nouns, and
# `word()` echoes what it does not know, so echoing them is the
# translation. Only the two Khor produces itself, plus the honest gap,
# need a word here.
[category]
khor = "khor"
shell = "命令"
# A row nobody could place. Not "其他" — that reads like a category the
# row belongs to, and the whole point is that we could not tell.
unknown = "未识别"

# A machine's face: the three axes a person picks on, and what each one
# offers. Keys are the stable ones the code already travels under — a
# factory palette's `id` (khor_core::avatar::PRESETS), a `Variant::key`,
# a `FaceShape::key` — so a word is looked up and never stored.
#
# **A key prefixed `axis-` names a heading; every other key here names an
# option somebody can pick.** That split is what
# `every_face_option_has_a_word_and_every_word_names_an_option` walks, and
# it is a prefix rather than a convention about dashes because a future
# palette id may well carry one.
# 这台机器现在走哪条路够到另一台(khor_core::Hop)。**读数,不是设置。**
# 校园网上实测直连 3.8–9.8ms、中继 6.0ms——人从手感上分不出来,所以
# 「悄悄退回中继」需要一个词才看得见。
#
# 读的是常驻手里那条长连接选中的路,两次采样一致才换词;没有连接、或连接
# 静默被收回,就是「未连」——连接闲着会关,下次打开照样拨得通,所以它不是
# 「不通」。「不通」只在常驻最近一次去够它失败(拨号失败、请求没人应)、
# 之后又没听到它任何动静时才说(NET-13,khor_core::Link::down_ms)。
# 「serve 未运行」有解(去起 serve),所以单列。
# (2026-10-03 NET 轮去掉了「未知」:它曾代表五件不相干的事——iroh 地址簿
# 里没有、状态查询失败、答得晚、少一行、手机换了新端点——没有一件是
# 「路不知道」。现在各说各的:未连接,或者保留上一次的读数。)
#
# 没有「直连+中继」这一档:实测直连开着的时候中继一直也开着(iroh 拿它当
# 保险,不拆),所以那个词会出现在每一条健康的行上——常年都在的词等于没有词,
# 而且会让人以为中继还被需要。「直连」回答的正是那个问题:打洞成没成。
[hop]
direct = "直连"
relay = "中继"
quiet = "未连"
down = "不通"
# 本机没有常驻,压根没人能读这个数——和「未连接」分开,因为它有解:去起 serve。
no-serve = "serve 未运行"

[avatar]
axis-palette = "色板"
axis-variant = "画法"
axis-shape = "形状"
# One well per color slot. Numbered rather than named: no slot has a
# fixed job — which one becomes the ground and which one the first stroke
# is decided per machine by its id (khor_core::avatar::pick), so calling
# one of them 底色 would be wrong on most machines.
axis-palette-slot = "颜色 {0}"

# ── the factory palettes ──
# The borrowed sets keep their own names. Monokai, Nord, Catppuccin's
# Mocha and Okabe-Ito are what those palettes are *called*, and inventing
# a Chinese name for one leaves the user unable to look it up or to
# recognize it from anywhere else they have seen it. Same judgment as the
# vendor names deliberately absent from [category].
liquid = "液态"
monokai = "Monokai"
mocha = "Mocha"
nord = "Nord"
okabe = "Okabe-Ito"
warm = "暖纸"
# **The key stays `mandala`, the word does not.** The key is the code's
# — it is what a device reports about itself, and changing it would throw
# away what everybody already picked. The word is a person's, and on this
# screen "Mandala" reads as *that other app's theme*: khor is its own
# product, and a family resemblance in the palette is not a reason to let
# the sibling's name onto the surface. 纸墨 is what the set actually is,
# in the words its own criterion uses — cream paper, moss, slate, one
# cinnabar (`PRESETS`, the mandala row).
mandala = "纸墨"

# ── the three compositions ──
# Named for what they look like, not for upstream's file names: marble /
# bauhaus / beam are boring-avatars' internal words and say nothing to
# somebody choosing a picture. The swatch beside each word is the real
# face, so the word only has to be a handle — it does not have to explain
# the composition, and docs/UX.md 文案 says it must not try.
marble = "晕染"
bauhaus = "几何"
beam = "笑脸"

# ── the three crops ──
circle = "圆形"
rounded = "圆角"
square = "方形"

[config]
# ── `khor config` 的键表 (docs/MORE.md 设置) ──────────────────────────
# 这一节里的名字是**数据**,和状态词、脸的选项同一类:节的名字、设置项的
# 名字、每个取值的名字都要跨线(`khor config set <项> <值>`),词在最后
# 一刻才查。所以它和那三节一样生成 `word()` 与 `KEYS`,两个方向都有门
# (`crates/node/src/tests.rs`):每个键有词,每个词名着一个真存在的东西。
#
# ⚠️ **名字里只许字母、数字和减号**——生成器拿它造 Rust 标识符,一个点
# 会造出 `SESSION.FORM` 这种编译不过的东西。
#
# 节:设置页和安全页把这些行分成几堆。
appearance = "外观"
# 头像(UX-32):每一行、每个标签那枚身份位怎么拼——底座是谁的,标记是什么。
avatar = "头像"
language = "语言"
session = "会话"
workspace = "工作区"
# 设置's pages (UX-16) that `khor config list` heads its groups with, and
# 连接's name on the face; 外观, 会话, 工作区 are the sections' words.
connection = "连接"
security = "安全"
# 这一节在**安全页**上,不在设置页(docs/MORE.md 把它写在安全那一条下面),
# 理由是它旁边那几节都是「按下去要付出点什么」的事。
confirm = "危险操作二次确认"

# 设置项。名字说的是**这一项管什么**,不是它现在是什么。
theme = "主题"
# 会话、机器、工作区那枚头像怎么说「这是哪一类」(负责人 2026-10-02)。
kind-mark = "类型标记"
# 类型标记是角标时,角上那枚是什么(UX-32):`kind` 底座是机器的脸、角上是类型;
# `machine` 底座是类型的字形、角上是机器的脸。类型标记是浮现时这一行不画。
corner-is = "角标是"
# **一行设置的说明**:名字是 `<键>-note`,写这一项**会发生什么**
# (components/SettingsGroup「note 写会发生什么」)。不是每个键都有;有的
# 那一个,门要它的前半截是一个真存在的键(`crates/node/src/tests.rs`)。
lang = "界面语言"
# 标签页上限:超过这个数,再开一个就关掉最久没碰、没置顶、没有未保存改动的那个。
# 取值 off 或 4–50;数字本身就是词,不进这张表。
tabs-limit = "标签页上限"
session-form = "新会话默认打开方式"
files-click = "单击文件"
confirm-takeover = "接管会话"
# 每条侧边栏右键「删除」之前那一问(docs/SHELL.md 第四轮);取代「删除工作区」那一项。
confirm-delete = "删除"

# 取值。
# `auto` 是**跟着这台机器的桌面走**,不是「khor 自己猜」——所以词说的是
# 跟谁,不是「自动」。存下来的是这个选择本身,不是它当下解出来的深或浅:
# 一份因为那天晚上桌面是深色而存成「深色」的配置,是一台从此不再跟着桌面
# 走的机器,而没有人说过要这样。
auto = "跟随系统"
light = "浅色"
dark = "深色"
# 两个语言的名字**各用各自的语言写**,而且两份 toml 里一模一样:一个看不懂
# 当前界面的人,正是要靠这两个词找到出路——「English」写成「英语」对他没用。
zh = "中文"
en = "English"
chat = "对话"
term = "终端"
# 预览位上的标签是斜体的那一个,下一次单击会顶掉它;双击照旧保持打开,
# 所以「预览」不是一条没有出口的路。
# `pin` 是这个值的键(CLI 照旧 `files-click pin`),词是 VS Code 中文版那一个
# ——「钉住」2026-09-21 退休(docs/SHELL.md 第二轮:一个动作一个词,而这里说的
# 不是置顶,是这个标签不再被下一次单击顶掉)。
preview = "预览"
pin = "保持打开"
on = "开"
off = "关"
# 类型标记的两种画法(负责人 2026-10-02:「角标、浮现这样」)。`face` 是标记
# 直接画在机器的脸上、居中;`corner` 是脸的右下角一枚角标。
face = "浮现"
corner = "角标"
# 角标是的两个取值(UX-32)。
kind = "类型"
machine = "机器"

[cli]
usage = """
用法：khor <动词>
  id [--reset 机器名]    本机身份；--reset 删除身份密钥并重新生成——
                        **对全网来说这就是换了一台机器**，别的机器还认着
                        旧的、不认新的，要回去得重新配对。所以它要你把
                        这台机器的名字原样打一遍
  avatar [机器] [--palette 色板] [--colors 五个颜色] [--variant 画法]
         [--shape 形状]
                        一台机器的头像；不带参数看现在是什么、有哪些可选，
                        不给机器就是本机。**全网同一份**：谁都能改任何一台，
                        后写的赢（和改名同一条路）。
                        旧名 face 还认，下一版撤——头像是头像，
                        界面是界面（见 faces）
  devices [--roads]     网里的机器；--roads 再列每台到其他机器的路
                        （它最后一次报告的）
  top [机器]            这台机器在忙什么：进程 top 与最近 24 小时 CPU
  ls <机器> [路径]       看那台机器的目录（不给路径=它的主目录）
  pull <机器> <文件> [目录]
                        把那台机器上的文件拉过来（默认落当前目录）
  drop [-m 机器] <文件> [--to session | --on 机器] [--into 目录]
                        把文件放到 session 所在的机器上能读到的地方，打印
                        它在那边的绝对路径。同一台机器不复制，原样打印；
                        别的机器落在那边的 ~/khor-drop/，由那台机器直接去
                        拉（重名加 -2、-3），超过 200 MB 不收。--into 改落
                        那边的这个目录，同一台机器也复制过去
  git [status <机器> <仓库路径> | diff <机器> <文件>]
                        那台机器上的 git 仓库，只读。status 头一行是分支，
                        往下每行一个和 HEAD 不一样的文件（M 改过 /
                        A 进了索引 / D 删了 / U 没跟踪）；diff 列出一个文件
                        差在哪几处，行号是文件现在的行号，每处底下是 HEAD
                        那边原来的那几行
  places [机器]          那台机器上开过 session 的目录（不给机器=本机）
  ws ls | add [-m 机器] <目录> | rm [-m 机器] <目录> |
     pin [-m 机器] <目录> | unpin [-m 机器] <目录>
                        工作区：你自己指定的「哪台机器上的哪个目录」，
                        不由 git 或者 session 记录推出来。ls 每行是
                        置顶标记、名字、机器：路径；add 加一个（不给 -m
                        就是本机，可以写 .）；rm 移出这张表，目录本身
                        一个字节都不动；pin/unpin 让它排在最前面
  rm [-m 机器] <路径>     把那个文件或目录删掉。**本机的进废纸篓，别的机器
                        和卫星是直接删、找不回来**（那边没有废纸篓）。
                        目录连里面的一起走；路径不存在就拒绝
  mkdir [-m 机器] <路径>  在那台机器上建一个目录。只建一级，上一级不在就
                        拒绝；名字已经有了也拒绝，没有 -p 也没有 -f
  touch [-m 机器] <路径>  在那台机器上建一个空文件。名字已经有了就拒绝，
                        **不会把原来那个清空**
  mv [-m 机器] <原路径> <新路径>
                        在那台机器上给一个名字改名，跨目录也是这一条。
                        新名字已经有了就拒绝，不覆盖，没有 -f
  launch [-m 机器] <路径|网址>
                        让那台机器用它自己的开启器打开这个东西（Mac 是
                        open，Linux 是 xdg-open；`KHOR_LAUNCHER` 可以指
                        另一个）。**开在那台机器上，不是你面前这台**；
                        只收绝对路径和 http/https 网址。`open` 是「在那台
                        机器上开一个 session」，不是这一条
  search [-m 机器] <目录> <词>
                        在那台机器的那个目录下面找这个词：先是名字里带它的
                        文件（一行一个路径），再是内容里带它的行
                        （`路径:行号: 那一行`）。不区分大小写，当纯子串，
                        不是正则；本机这条路尊重 .gitignore，卫星那条
                        只跳过 .git。最多 50 个名字、200 行、跑 5 秒，
                        到顶了在 stderr 上说一句
  read <机器> <文件>      把文档读成文字打出来：md/csv/tsv 原样（它们本来
                        就是文本），docx/xlsx/pptx 和它们的旧格式
                        （doc/xls/ppt）、pdf 转成 markdown。读的是文字和
                        结构，不是排版
  code [--stop] <机器> [仓库路径]
                        在那台机器上开 VS Code 的网页版，打印本地链接
                        （链接里带密钥；不给路径就是它上次开的那个）。
                        一台机器一个服务端，换项目只是换链接。第一次会从
                        微软下一份服务端（约 640 MB），之后不用。它不是
                        session，没有行也不能 close，收摊用 --stop
  put [--new | --base 底本] <机器> <本地文件> <远端路径>
                        把本地文件写到那台机器的那个路径上（pull 的反向）。
                        默认先读一遍再写，中间被人改过就整个拒绝、一个字节
                        都不落；--new 是另一种说法：那儿本来就不该有文件；
                        --base 给出你动手前那份，那边变过就三方合并：合得
                        干净就写进去，有对不上的地方一个字节都不写，把带
                        标记的结果打到标准输出，退出码 1
  borrow <机器>         借那台机器的网：起一个本地代理口，浏览器指过来就从
                        它那儿出去（要 serve 在跑；close 那条 session 收口）
  tabs [ls] | open [-m 机器] <网址> | close|focus|pin|unpin <序号|id>
                        浏览器这块屏幕上开着的标签页。**本机的，不同步**：
                        开着什么是这块屏幕的事，别的机器不看（常去的地方才跟着人走）。
                        ls 每行是当前/置顶标记、序号、id、标题、网址。pin 置顶一个
                        （排在最上，取消置顶之前 close 不掉），unpin 取消置顶。
                        都收两样：**序号**是这次列出来的第几个，手敲用它，
                        关掉一个之后会挪；**id** 认死一个不会挪，脚本用它
  usage [--days N]      各机器花掉的 token，按天按类别（默认 7 天）
  sessions [--by recent|category|device|state|place] [--all]
                        session 列表（默认最近）；换一种排列方式，置顶永远在最上；
                        看过的旧会话默认只报条数，--all 全列出来。列表里只有
                        新建的、导入的和对设备的对话
  find <词>              一次搜会话、机器、工作区、浏览标签和设置页（窗口里 ⌘K 同一份）
  import [<序号|id>...]  不带参数列出可导入的会话（外面开的智能体、tmux 会话、
                        ACP 对话），带序号；带序号或 id 就把它们导进列表
  tell <机器> <话...>    给机器的窗口留言（永远当字面的话）
  send <机器> <文件|话...>
                        给那台机器：是个存在的文件就传文件（摘要先到，
                        对方许可后才传），不是就当留言；
                        话恰好和文件同名时用 tell
  accept <传输号>        许可并收下全量（在收文件的那台机器上跑）
  log <机器>            看那个窗口的消息
  run [--tui] [--title 名] -- <命令...>
                        临时 session：跟着这个终端活，全程网里可见
  open [-d] [--tui|--gui] [--agent 名字 [--resume id]] [--on 机器] [--title 名] [-- 命令]
                        持久 session：终端关了还在，能重连（默认接上；-d 只开；
                        --gui 走 ACP 协议，khor 画对话，给会说这个协议的 agent；
                        --agent 用登记过的那个 agent（见 agents），自带 --gui；
                        --resume 续上它自己列出来的某段对话（见 agents sessions）；
                        --on 在别的机器上开，不给命令就用那台自己的 shell；
                        --gui/--agent 配 --on 在那台机器上起它自己的 agent，
                        不接命令，也不接 --resume）
  accounts [ls]         登记过的账号（本机的 Claude Code、Codex 登录第一次读到
                        时各自动登记一条，删掉后不再自动建）；add <名字> --provider
                        newapi|claude|openai|deepseek|moonshot|moonshot-cn|
                        openrouter [--base-url 地址]
                        [--budget 数] --key 密钥|--key-stdin 登记（密钥只留在这台
                        机器上）；订阅是 add <名字> --provider claude|codex
                        --kind sub，不填密钥——它读的是这台机器上 Claude Code
                        或 Codex 的登录，
                        所以登记在哪台就读哪台；rm <id|名字> 撤掉
  quota [--why]         每个账号用了多少：本机的现读，别的机器的按上次带回来的；
                        --why 印出本机每家订阅每条取数策略这一回做了什么
  attach <session>      接上一个持久 session（Ctrl-\\ 断开）；
                        行在哪台机器上就接哪台，不用说
  takeover <session>    接管一个 agent 会话：结束它的终端，对话从这里继续
  agents [known | sessions <名字> [--ask] | add <名字> [...] | rm <名字>]
                        登记会说 ACP 的 agent：不带参数看登记过哪些。
                        登记一次全网都认得（命令在不在各机器上，起的时候才知道）；
                        claude、codex、khor、shell 这四个名字 khor 自己在用。
                        known 看随包带的 ACP 注册表快照；@<id> 直接用快照里那条命令。
                        sessions 看它有哪些对话（读记下来的；--ask 才真去问，那会起一个进程）；
                        问过的答案全网同步，别的机器不用再起一遍
  state <词|--hook>     （给进程钩子用）汇报状态；--hook 从标准输入读 Claude 事件
  seen <session>        标已读
  rename [-m] <session|机器> [名字...]
                        给它起个名（全网同一份，盖在它自己的名上）；
                        不给名字=撤销，它自己的名原样露出
                        -m 改机器名；机器改的只是人看的那个名字，
                        网络归档用的频道名不动，所以对话和已读都不搬家
  pin [-m] <session|机器>
                        置顶（-m 置顶机器）；在哪台上置顶都一样，全网同一份。
                        目录要置顶就把它加成工作区再 ws pin；网页是 tabs pin
  unpin [-m] <session|机器>
                        取消置顶
  close <session>       关掉（session 停掉进程；对话收起这一行，历史和
                        收下的文件都留着，再来消息它自己回来；导入的行只从
                        列表里拿掉，那边的会话一个字节不动，它回到候选里）
  serve                 常驻：应答别人、代跑本机动词、每 5 秒同步全网
                        （顺带把网页版也开在局域网上，见 web）
  relay --dev | --tls-cert 证书 --tls-key 私钥 | --acme 域名 [--acme-contact 邮箱]
        [--token 密钥 | --only-mine] [--rate 字节每秒] [--metrics 地址]
        [--bind 地址] [--http 地址] [--state 目录] | --stats [--state 目录]
                        在这台机器上跑一台中继（iroh-relay，同一份代码）。
                        --dev 是明文 HTTP，默认 3340 口；TLS 用现成的证书，
                        或者 --acme 找 Let's Encrypt 要一张。--token 只放行
                        带这把共享密钥的客户端；--only-mine 只放行这张网名单
                        上、没被撤销的设备（和每个请求过的那道门同一条规矩），
                        谁也不用填密钥。--rate 给每个客户端限速。
                        计量只存总数：每台设备连了几次、在线多久，加中继收发的
                        总字节，写在 --state 目录（默认 .khor/relay）；
                        --stats 打印这份计量，不起中继
  web [--new]           网页版的链接：拿手机或者别的电脑打开它，就是整个网。
                        网页版由 serve 开，这条只发密钥；链接里带密钥，别贴进
                        会同步的文档。--new 换一把，之前发出去的链接全作废
  gui                   开桌面 app 的窗口（桌面 app 是装在 khor 旁边的
                        khor-gui；没装它会告诉你去哪儿拿）
  faces                 本机开着哪几张 khor 界面：桌面 app 在不在跑、
                        网页版在不在听、听的是哪个端口。**这里的「脸」是
                        界面，不是头像**——头像那一个是 avatar
  quit                  收摊：停掉本机的 serve 和所有 session 宿主
                        （文件都留着，再 serve 就都回来）
  hooks [install|uninstall]
                        看钩子装没装；install 装上、uninstall 卸掉（都只碰
                        khor 自己那几条，做两遍=做一遍）
  lock [status|on|off|pin|timeout 分钟]
                        屏幕上那几个界面的打开密码（app 窗口和网页版）。
                        **不锁命令行**——`khor` 后面站着的人已经登进这台
                        机器了。不带参数=看现在什么样；pin 从标准输入读
                        一行（不进 argv，也就不进 shell 历史和 ps），
                        打一行空的=撤掉 PIN，锁也跟着关；timeout 收
                        0/1/5/15/60（0 是永不）。macOS 的 app 上还能用
                        Touch ID 开，那是额外的一把：PIN 是每张脸都有的那把
  config [list | get <项> | set <项> <值>]
                        这台机器自己的偏好（不跟着网走）。不带参数=list，
                        每行一个设置项和它现在的值——**列的是全部，不是
                        设过的那几个**；没有这个项、或者这个项不收这个值，
                        都按名字拒绝，拒绝里带着它收的那几个值
  doctor [--json] [--fix 项]
                        自检：一行一项，名字、状态（正常/注意/异常/未量）、
                        一句话。**「未量」不是「好」**——它是没量到。
                        每项各自 3 秒超时，一项卡住不拖累别项。
                        --json 出原样（GUI 那一页读的是同一份）；
                        --fix 跑那一项的修法（能修的项在行尾写着怎么跑）
  invite                出一张一次性配对票（要求 serve 在跑）
  pair <票>             凭票入网
  adopt <ssh主机> [名字] 领一台只有 ssh 的机器进网（卫星）：身份从你的
                        known_hosts 来，一切操作经本机代跑；移除还是
                        forget。要求免密 ssh（有密码提示的连不上）
  pending [--json]      等持根的机器批的：刚配进来还没拿到证书的机器、不持根
                        的机器领进来的卫星、在别处删掉了还没撤销的机器。一行
                        一台：id、名字、等的是什么
  approve <机器>         在持根的机器上批一台待批的：签它的证书（移除就签它的
                        撤销），马上同步给全网
  revoke <机器>          在持根的机器上撤销一台：全网拿到新名单后都不再应答它。
                        它还留在机器表里；连行一起删用 forget
  root [show [--json] | words <本机名> | recover <24 个词> | init]
                        用户根钥匙：只签字（哪些机器是你的），不连网也不加密。
                        show 看本机认哪把根、持不持、名单第几版；words 打印
                        24 个恢复词（把本机名字原样打一遍才给看）；recover
                        用恢复词把根找回到这台；init 给有根以前的老网生一把根，
                        把机器表里的都签上。不带参数只打印 store 路径（安装
                        脚本用）
  sync                  立即和全网各同步一趟
  mcp                   把 khor 的动词当工具讲出去（智能体用，不是人敲的）
  version               本机装的是哪一版（网里各机器的版本看 devices）
  forget <机器>          把一台机器移出网络：全网都不再认它，它也不再看得见网。
                        要回来得重新配对（在还认它的那台上出票）
  leave <本机名>         本机离开网络：先趁还连着把「我走了」发出去，再把
                        本机的机器表清到只剩自己、别人留在这儿的东西清掉。
                        本机自己的会话、工作区、身份、设置一样不动。
                        把本机的名字原样打一遍就是确认（和 forget 同一条规矩）。
                        拿一张新票 pair 可以再入网
  pause                 暂停接入网络：不再与别的机器同步，别的机器那边看见这台
                        离线；本机的会话、工作区、网页版照常用。关机重开还是暂停的
  resume                恢复接入：重新同步，下一轮就能对上
                        pause <机器>：只暂停和那一台的往来——不拨它、不接它、
                        不和它同步，它自己照常运行；devices 里那一行标（已暂停）。
                        resume <机器> 接回来
  watch <机器> [目录 ...] 让一台机器盯着这几个目录所在的卷（全网同一份，
                        devices 里那台机器多印每个目录还剩多少）；不给目录=清空"""
this-machine = "（本机）"
# `khor watch` 的回声:这台机器现在盯着的目录,一行一个;清空了就说清空了。
watching = "{0} 盯着：{1}"
watching-none = "{0} 没有盯着的目录"
# Marks the option a machine is wearing, in a list of options. Without
# it `khor face` prints a catalogue and answers "what am I" nowhere —
# and the whole reason to run it with no arguments is that question.
in-use = "（现在）"
# Said on a row that someone pinned. The list already puts pinned rows on
# top, and "on top" alone is not readable: without a mark, a row leading
# the list looks like the most recent one.
pinned-mark = "（置顶）"
# 本机暂停接入时挂在「(本机)」后面的记号(docs/MORE.md 暂停)。和路那一列
# 分开:路说的是「这台怎么够到那台」,暂停说的是这台机器自己的状态。
paused-mark = "（已暂停）"
# A group heading in a grouped listing. The rule marks it as a heading
# rather than a row, which matters in a list where every other line is
# tab-separated data.
group-header = "── {0}"
# The heading pinned rows sit under. Same fact as pinned-mark, said as a
# heading rather than as a tag on one row.
group-pinned = "置顶"
name-separator = "、"

# ── `khor doctor` 的一张清单 (docs/MORE.md 自检) ──────────────────────
# 每一项:名字、状态、一句人话,能修的带一个动作。**句子在节点这一侧写成**
# ——一行说的不是一个有固定形状的事实(「钥匙别人也读得了」和
# 「端口 54670 没人听」没有共同的形状可建模),所以挑词这一步下沉,词本身
# 还在这儿。CLI 和 GUI 两边读同一份。
doctor-name-version = "版本"
doctor-name-identity = "身份密钥"
doctor-name-store = "本机数据"
doctor-name-serve = "常驻"
doctor-name-web = "网页版"
doctor-name-relays = "中继"
doctor-name-peers = "其他机器"
doctor-name-roads = "连接诊断"
doctor-name-hooks = "钩子"
doctor-name-agents = "智能体"
doctor-name-vscode = "VS Code"
doctor-name-disk = "磁盘余量"
doctor-name-launcher = "开启器"
doctor-name-roster = "名单"
# 四个状态词。**「未量」不是 ok**:一行绿着的意思是有人看过了,而没看过是
# 另一件事(docs/SESSION.md 认不出就不落词,落在读数上的那一版)。
doctor-ok = "正常"
doctor-warn = "注意"
doctor-fail = "异常"
doctor-unmeasured = "未量"
# 一项自己超时了。名字带着,因为一行消失会读成一切正常。
doctor-timed-out = "{0} 秒内无响应"
# 修法按下去之后那一句。
doctor-fixed-chmod = "已将密钥权限改为仅你可读"
doctor-fixed-hooks = "已重新安装钩子"
doctor-fixed-serve = "已启动常驻进程"
doctor-no-fix = "khor 无法修复这一项：{0}"
# 一行后面那个提示:这一项 khor 能修,而且怎么修。**报的是这一项自己的键**,
# 因为 `--fix` 收的就是它;印修法自己的键会是一个这条命令不认的词。
doctor-fixable = "khor doctor --fix {0}"
# GUI 那一页上的两个动作。**CLI 没有这两个词**:再查一遍在命令行上就是
# 再敲一遍,而修法在命令行上是行尾印出来的那一句(`doctor-fixable`)。
# 放在 [cli] 是因为这一节的词两边共用,而这两条只有一边画得出来。
# 2026-09-20 用户改口:「不叫修好它, 就叫修复. 你这些动词哪学的,太尴尬了」。
# 界面上的动词一律用中文软件里通行的标准词,先过一遍「系统设置里会不会这么写」。
doctor-again = "重新检查"
doctor-mend = "修复"
# ── 诊断页把正常的那些收起来之后,分的三组 ────────────────────────
# (docs/MORE.md 第二轮 自检页:「正常的收成一行「N 项正常」,点开才展开,
# 分三组:本机、网络、工具」。)**哪一项归哪一组是节点说的**
