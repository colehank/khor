# The one wording file (docs/UX.md 文案): every user-facing word lives
# here and only here. Keys are stable and travel the wire; words are
# looked up at the last moment. {0}/{1} are positional arguments.
# Within a section, two keys may not share one text — refusing by name
# needs names that differ (enforced at build time).

[state]
busy = "忙碌"
blocked = "待批"
done = "完成"
errored = "中断"
failed = "失败"
idle = "空闲"

# Whose session a row is (khor_core::Session::category). **Vendor names
# are deliberately absent**: `claude` and `codex` are proper nouns, and
# `word()` echoes what it does not know, so echoing them is the
# translation. Only the two Khor produces itself, plus the honest gap,
# need a word here.
[category]
khor = "Khor"
shell = "命令"
# A row nobody could place. Not "其他" — that reads like a category the
# row belongs to, and the whole point is that we could not tell.
unknown = "认不出的"

# A machine's face: the three axes a person picks on, and what each one
# offers. Keys are the stable ones the code already travels under — a
# factory palette's `id` (khor_core::avatar::PRESETS), a `Variant::key`,
# a `FaceShape::key` — so a word is looked up and never stored.
#
# **A key prefixed `axis-` names a heading; every other key here names an
# option somebody can pick.** That split is what
# `every_face_option_has_a_word_and_every_word_names_an_option` walks, and
# it is a prefix rather than a convention about dashes because a future
# palette id may well carry one.
# 这台机器现在走哪条路够到另一台(khor_core::Hop)。**读数,不是设置。**
# 校园网上实测直连 3.8–9.8ms、中继 6.0ms——人从手感上分不出来,所以
# 「悄悄退回中继」需要一个词才看得见。
#
# 五个词里有三个是「没话说」,而它们是三件事:「没在连」是答案、
# 「serve 没在跑」有解(去起 serve)、「说不出」两者都不是。
# 合成任意两个,都会让人去做错的事,或者根本不知道该做什么。
#
# 没有「直连+中继」这一档:实测直连开着的时候中继一直也开着(iroh 拿它当
# 保险,不拆),所以那个词会出现在每一条健康的行上——常年都在的词等于没有词,
# 而且会让人以为中继还被需要。「直连」回答的正是那个问题:打洞成没成。
[hop]
direct = "直连"
relay = "中继"
quiet = "没在连"
# 本机没有常驻,压根没人能读这个数——和「说不出」分开,因为它有解:去起 serve。
no-serve = "serve 没在跑"
unsure = "说不出"

[avatar]
axis-palette = "色板"
axis-variant = "画法"
axis-shape = "形状"
# One well per color slot. Numbered rather than named: no slot has a
# fixed job — which one becomes the ground and which one the first stroke
# is decided per machine by its id (khor_core::avatar::pick), so calling
# one of them 底色 would be wrong on most machines.
axis-palette-slot = "颜色 {0}"

# ── the factory palettes ──
# The borrowed sets keep their own names. Monokai, Nord, Catppuccin's
# Mocha and Okabe-Ito are what those palettes are *called*, and inventing
# a Chinese name for one leaves the user unable to look it up or to
# recognize it from anywhere else they have seen it. Same judgment as the
# vendor names deliberately absent from [category].
liquid = "液态"
monokai = "Monokai"
mocha = "Mocha"
nord = "Nord"
okabe = "Okabe-Ito"
warm = "暖纸"
# **The key stays `mandala`, the word does not.** The key is the code's
# — it is what a device reports about itself, and changing it would throw
# away what everybody already picked. The word is a person's, and on this
# screen "Mandala" reads as *that other app's theme*: khor is its own
# product, and a family resemblance in the palette is not a reason to let
# the sibling's name onto the surface. 纸墨 is what the set actually is,
# in the words its own criterion uses — cream paper, moss, slate, one
# cinnabar (`PRESETS`, the mandala row).
mandala = "纸墨"

# ── the three compositions ──
# Named for what they look like, not for upstream's file names: marble /
# bauhaus / beam are boring-avatars' internal words and say nothing to
# somebody choosing a picture. The swatch beside each word is the real
# face, so the word only has to be a handle — it does not have to explain
# the composition, and docs/UX.md 文案 says it must not try.
marble = "晕染"
bauhaus = "几何"
beam = "笑脸"

# ── the three crops ──
circle = "圆形"
rounded = "圆角"
square = "方形"

[cli]
usage = """
用法: khor <动词>
  id                    本机身份
  face [--palette 色板] [--colors 五个颜色] [--variant 画法] [--shape 形状]
                        本机的脸;不带参数看现在是什么、有哪些可选
  devices               网里的机器
  top [机器]            这台机器在忙什么:进程 top 与最近 24 小时 CPU
  ls <机器> [路径]       看那台机器的目录(不给路径=它的主目录)
  pull <机器> <文件> [目录]
                        把那台机器上的文件拉过来(默认落当前目录)
  borrow <机器>         借那台机器的网:起一个本地代理口,浏览器指过来就从
                        它那儿出去(要 serve 在跑;close 那条 session 收口)
  usage [--days N]      各机器花掉的 token,按天按类别(默认 7 天)
  sessions [--by recent|category|device|state|place] [--all]
                        session 列表(默认最近);换一种排布,置顶永远在最上;
                        看过的旧会话默认只报条数,--all 全列出来
  tell <机器> <话...>    给机器的窗口留言(永远当字面的话)
  send <机器> <文件|话...>
                        给那台机器:是个存在的文件就传文件(摘要先到,
                        对方许可后才传),不是就当留言;
                        话恰好和文件同名时用 tell
  accept <传输号>        许可并收下全量(在收文件的那台机器上跑)
  log <机器>            看那个窗口的消息
  run [--tui] [--title 名] -- <命令...>
                        临时 session:跟着这个终端活,全程网里可见
  open [-d] [--tui|--gui] [--agent 名字 [--resume id]] [--on 机器] [--title 名] [-- 命令]
                        持久 session:终端关了还在,能重连(默认接上;-d 只开;
                        --gui 走 ACP 协议,khor 画对话,给会说这个协议的 agent;
                        --agent 用登记过的那个 agent(见 agents),自带 --gui;
                        --resume 续上它自己列出来的某段对话(见 agents sessions);
                        --on 在别的机器上开,不给命令就用那台自己的 shell;
                        --gui/--agent 配 --on 在那台机器上起它自己的 agent,
                        不接命令,也不接 --resume)
  accounts              登记过的 API 账号;add <名字> --provider newapi|claude|openai|
                        deepseek|moonshot|moonshot-cn|openrouter [--base-url 地址]
                        [--budget 数] --key 钥匙|--key-stdin 登记(钥匙只留在这台
                        机器上);rm <id|名字> 撤掉
  quota                 每个账号用了多少:本机的现读,别的机器的按上次带回来的
  attach <session>      接上一个持久 session(Ctrl-\\ 断开);
                        行在哪台机器上就接哪台,不用说
  takeover <session>    接管一个 agent 会话:结束它的终端,对话从这里继续
  agents [known | sessions <名字> [--ask] | add <名字> [...] | rm <名字>]
                        登记会说 ACP 的 agent:不带参数看登记过哪些。
                        登记一次全网都认得(命令在不在各机器上,起的时候才知道);
                        claude、codex、khor、shell 这四个名字 khor 自己在用。
                        known 看随包带的 ACP 注册表快照;@<id> 直接用快照里那条命令。
                        sessions 看它有哪些对话(读记下来的;--ask 才真去问,那会起一个进程);
                        问过的答案全网同步,别的机器不用再起一遍
  state <词|--hook>     (给进程钩子用)汇报状态;--hook 从标准输入读 Claude 事件
  seen <session>        标已读
  rename <session> [名字...]
                        给它起个名(全网同一份,盖在它自己的名上);
                        不给名字=撤销,它自己的名原样露出
  pin [-m|-d] <session|机器|机器 路径>
                        置顶(-m 钉机器,-d 钉某台机器上的目录);
                        钉在哪台都一样,全网同一份
  unpin [-m|-d] <session|机器|机器 路径>
                        取消置顶
  close <session>       关掉(session 停掉进程;对话收起这一行,历史和
                        收下的文件都留着,再来消息它自己回来)
  serve                 常驻:应答别人、代跑本机动词、每 5 秒同步全网
                        (顺带把网页脸也开在局域网上,见 web)
  web [--new]           网页脸的链接:拿手机或者别的电脑打开它,就是整个网。
                        脸是 serve 开的,这条只发钥匙;链接里带钥匙,别贴进
                        会同步的文档。--new 换一把,之前发出去的链接全作废
  gui                   开桌面 app 的窗口(桌面 app 是装在 khor 旁边的
                        khor-gui;没装它会告诉你去哪儿拿)
  quit                  收摊:停掉本机的 serve 和所有 session 宿主
                        (文件都留着,再 serve 就都回来)
  hooks [install|uninstall]
                        看钩子装没装;install 装上、uninstall 卸掉(都只碰
                        khor 自己那几条,做两遍=做一遍)
  invite                出一张一次性配对票(要求 serve 在跑)
  pair <票>             凭票入网
  adopt <ssh主机> [名字] 领一台只有 ssh 的机器进网(卫星):身份从你的
                        known_hosts 来,一切操作经本机代跑;请出去还是
                        forget。要求免密 ssh(有密码提示的连不上)
  sync                  立即和全网各同步一趟
  mcp                   把 khor 的动词当工具讲出去(智能体用,不是人敲的)
  version               本机装的是哪一版(网里各机器的版本看 devices)
  forget <机器>          把一台机器请出网:全网都不再认它,它也不再看得见网。
                        要回来得重新配对(在还认它的那台上出票)"""
this-machine = "(本机)"
# Marks the option a machine is wearing, in a list of options. Without
# it `khor face` prints a catalogue and answers "what am I" nowhere —
# and the whole reason to run it with no arguments is that question.
in-use = "(现在)"
# Said on a row that someone pinned. The list already puts pinned rows on
# top, and "on top" alone is not readable: without a mark, a row leading
# the list looks like the most recent one.
pinned-mark = "(置顶)"
# A group heading in a grouped listing. The rule marks it as a heading
# rather than a row, which matters in a list where every other line is
# tab-separated data.
group-header = "── {0}"
# The heading pinned rows sit under. Same fact as pinned-mark, said as a
# heading rather than as a tag on one row.
group-pinned = "置顶"
name-separator = "、"
unread = "未读 {0}"
unreachable-for = "{0}没联系上"
# The quiet note (词的保鲜期批): a live word nobody can vouch for has
# said nothing for this long. Beside the word, never instead of it —
# the word stays, this says how stale it is (离线轴的第二种情形:
# 机器够得着,信号断了). {0} is a bare duration off the age ladder.
quiet-for = "{0}没消息"
# Adoption's report (附属机器批): {0} the name, {1} this machine — the
# sponsor is said out loud because it is the satellite's home from now
# on, and the promise (全网都看得见) is the CRDT doing what it always
# does, said so nobody goes checking.
adopted = "领进来了: {0},经 {1} 说话;全网马上都看得见它"
# A satellite's road column: it has no road of its own — its sponsor
# speaks for it — so where every other machine shows 直连/中继 this
# shows who it speaks through (both faces use it; 呈现处标「经 <sponsor>」
# is the batch's own acceptance line).
via-sponsor = "经 {0}"
# The tmux probe's two outcomes, told at adoption so the terminal's
# nature is no surprise later (docs/SESSION.md 例外墓碑: persistence on
# a satellite is borrowed from its own tmux, never hosted by khor).
sat-tmux-yes = "它有 tmux,在它上面开的终端能持久"
sat-tmux-no = "它没有 tmux,在它上面开的终端是临时的(连接断了就没了)"
# Said only when the number is non-zero. Zero rows and zero unreadable is
# an idle machine; zero rows and a non-zero count is khor being out of
# date, and nothing but this line tells the two apart.
#
# Neither "智能体" nor "落盘" any more: the count also covers a tmux
# session khor could not describe, and tmux is not an agent and is not
# read off disk — it is asked. A machine with **no** tmux is not counted
# here at all, because zero rows is then the truth (adaptor::tmux).
adaptor-behind = "有 {0} 个正在跑的 session 读不出来,khor 认不得它给的格式"
# The fold's one line (退场批): dead + looked at + past the threshold
# stays off the default listing, and this says how many — a count that
# is silent would read as the rows having been deleted, which they
# never are.
old-sessions-hidden = "{0} 条旧会话没列出来(--all 全看)"
age-seconds = "{0} 秒"
age-minutes = "{0} 分钟"
age-hours = "{0} 小时"
age-days = "{0} 天"
# A machine's readings (khor_core::Vitals). Each unit prints its own
# denominator: 「78%」 and 「78% / 12 核」 are two different sentences, and
# only the second one can be acted on.
vitals-cpu = "CPU {0}% / {1} 核"
vitals-mem = "内存 {0} / {1}"
vitals-disk = "磁盘 {0} / {1}"
# The same readings' names on their own, for the face of a ring: the arc
# is the gauge, the middle holds the value, and the name goes under it.
# **The sentence above and the name here are never on screen together** —
# the sentence is what the ring turns over to show, so this is not the
# same words printed twice, it is the short form and the long form of one
# reading, each on the side that has room for it.
vitals-name-cpu = "CPU"
vitals-name-mem = "内存"
vitals-name-disk = "磁盘"
# The disk khor's home sits on could not be identified. It gets a word
# rather than being left out, because a missing line and a machine that
# could not answer read the same otherwise — and 「0 / 0」 would read as
# an empty disk (docs/SESSION.md 认不出就不落词).
vitals-disk-unknown = "磁盘 说不上"
# The graphics hardware, when khor could read it. **There is deliberately
# no 「说不上」 word to match the disk's above**, and the asymmetry is the
# judgment: khor's home is always on some filesystem, so failing to name
# it means khor could not answer and is worth saying out loud. A machine
# with no GPU, or one khor cannot ask, is an ordinary machine — a line
# announcing that on every desktop without a card is noise reporting a
# non-event. So the whole line is simply absent (khor_core::Gpu).
vitals-gpu = "GPU {0}% / {1} 卡"
vitals-name-gpu = "GPU"
# Video memory, summed over the cards. Absent on unified-memory machines,
# where those bytes are already counted in 「内存」 above and a second line
# would put the same memory on screen twice under another name.
vitals-vram = "显存 {0} / {1}"
# 一张卡自己的一句(khor_core::GpuCard):几张卡就几句,不再平均。名字是驱动
# 报的原话,报不出名字的卡由两端各自退回「GPU」那个词。显存跟在同一句里,
# 不拆第二段——smoke 按两空格数段落,GUI 一卡一环,两边段数要对得上。
vitals-gpu-card = "{0} {1}%"
vitals-gpu-card-mem = "{0} {1}%,显存 {2} / {3}"
# The card's day section and the words its dials turn over to
# (2026-09-03, redesigned twice to the user's references: four dials —
# CPU, GPU, 内存, 磁盘 — each an aggregate whose parts are a row apiece
# under it; a dial's face is the arc and its name, and what it turns
# over to is the quantity behind the share). `storage` went with the
# section it headed: a volume's row is its own mount point spelled out,
# and a heading over one row is a word that names nothing the row does
# not (2026-09-03「就写 /Volumes/disk0 就可以」).
# **`day-trend` 撤掉了,没有替代键**(2026-09-04)。那块图搬进四个环下面那个槽
# 之后,槽顶上那一行是它的三个读法词;再放一个标题要么把词挤出去、要么把图压下去。
# 而它说的那件事本来就不必说:一块画着 CPU/GPU/内存/磁盘 四行、横轴是钟点、右端
# 写着「现在」的图,不需要一句话告诉人它是「24 小时趋势」。
# The chart's own rows. Four readings, each on its own baseline
# (2026-09-03:「GPU、CPU、Mem、Disk 都绘制」): four lines in one frame
# cross, and a crossing is a place where two numbers become one shape.
# Stacked rows share the time axis instead, so a spike at 14:20 lines up
# vertically across all four without any of them hiding another. The
# row's name is the reading's own word (CPU / GPU / 内存 / 磁盘) — the
# same word its dial wears, so nobody has to learn a second vocabulary.
# 一行在右边说的那个数:一天的最高点,因为一条只画形状的行答不了「多高」。
# **热力带和山脊只画数字本身**(后面跟一个 7px 的 % 号),叠放那张才把话说全
# ——那里一根发丝是一个时刻,时间被压掉了,所以「什么时候」得写出来。
day-peak-at = "峰值 {0} · {1}"
# 三种**读法**,不是三个视图:同一份数据、同一个游标、同一组峰值,换的只是怎么看。
# 所以切换控件是三个词,不是 tab——无边框、无底色、无胶囊:tab 说的是「三个地方」,
# 而这里自始至终是一个地方。
day-view-heat = "热力带"
day-view-ridge = "山脊"
day-view-para = "叠放"
# 游标读数条:那一刻,和那一刻每个读数是多少。**换读法不许丢掉它**——丢了就说明
# 三种读法各自记着自己的状态,那它们就不是同一份数据的三种看法了。
day-at = "{0} · {1}"
# 一段没人记的桶,写在那段空缺里,也写进游标读数条。**「没采到」不是 0**:
# 一条画过去的线会声称机器当时在做某件没人量过的事(docs/UX.md 不知道就说不知道)。
day-gap = "没采到"
# 时间轴最右端。整点刻度让位给它——两个词落在同一条基线上会读成一句话。
day-now = "现在"
# 明度阶的名字。**明度即数据**是这块图的全部读法,而一条没有图例的色阶
# 是一把要人自己猜的尺。
day-shade = "明度"
# 压力色那一格的说明。**只有内存和磁盘**:满了会真的坏事的是这两个。
# 阈值取自档位表的最高一档,不写死——写死的数字会在档位改动之后继续言之凿凿。
day-strain-legend = "内存/磁盘 {0}+"
# 叠放那张的刷选读数:在一根轴上上下划,落在那一段的时刻整束亮起来,这一行说
# 「那些时刻别的指标是多少」。**中位不是平均**:一段刷选里常有几个离群的桶,
# 平均会被它们拽走,而这一行要答的是「那阵子通常是什么样」。
day-brush-head = "{0} 的 {1} 个时刻({2} 小时):"
day-brush-median = "{0} 中位 {1}"
day-brush-none = "{0} 无数据"
day-brush-empty = "{0} {1}:没有一个时刻落在这儿"
cores-sub = "{0} 核"
gpu-sub-nomem = "{0} 卡"
# The disk dial's whole, said as **how big and how many** rather than
# as used-over-total: the sum of two volumes rounds to 「1.1T / 1.1T」
# at one decimal — a sentence that reads full while the arc beside it
# says 95%. Used-over-total is right for one filesystem (`vitals-disk`,
# what `khor devices` prints per volume) and wrong for a sum, and the
# fix is the sentence, not more decimals.
disk-whole = "磁盘 {0} · {1} 卷"
# What every fill dial turns over to: how much is **left**, which is the
# number a person acts on — 95% and 「还剩 53.8G」 are the same reading,
# and only the second one answers 「能不能再放一份进去」.
fill-left = "还剩 {0}"
# The CPU and memory dials' second line: the day's high-water mark, from
# the same 288 buckets the chart below draws. Not an average — an
# average over a day of a machine that idles at night says nothing about
# whether it was ever short.
day-peak = "24 小时峰值 {0}"
uptime-days = "已运行 {0} 天"
uptime-hours = "已运行 {0} 小时"
updated-at = "更新于 {0}"
# **`yesterday-at` 撤掉了,没有替代键**(2026-09-04)。它是那块图上面
# 「昨天 15:34 → 15:34」里的「昨天」。整句一起删的:**窗口是画在轴上的**——
# 每三小时一个整点刻度,右端一个「现在」——再用一句话复述一遍,是同一个事实说
# 两遍,而复述的那一遍是会过期的那一遍。
# 一个卷一句(khor_core::Volume):磁盘不再只报 khor 家底那一块。名字的短写
# (Data→/、其余取末段)是画法,CLI 与脸各自拼,bytes() 先例。
vitals-vol = "{0} {1} / {2}"
# The GPU memory column's head, and the word an older node's aggregate
# reading wears under its dial: one fact, one word, both places.
vitals-name-vram = "显存"
# The machine card's process top (2026-09-02:「环下面显示进程top」):
# the two column heads that are not a vitals name. CPU and 内存 reuse
# `vitals-name-cpu` / `vitals-name-mem` — same fact, same word.
# The process table's columns (2026-09-03:「PID、name、CPU、GPU、显存、
# Mem」). **PID is a column of its own** because it is what a person
# types next — `kill`, `lsof -p`, a grep — and a number buried beside a
# name is a number you have to select carefully. The account keeps no
# column: on one person's own machine every row says the same word, and
# on a shared box it belongs to the name it qualifies, so it rides under
# the name in the muted ink.
top-pid = "PID"
top-user = "用户"
# How long the process has been up (2026-09-04:「表格多个时间列」).
# **一段时长,不是一个时刻**:跨机器读「03:14 起的」要先知道对面的日期
# 和时区,而人在这张表前问的是「这进程是刚起的还是挂了三天了」。时长在
# 对面那台机器上算,所以两边的钟对不对得上都不影响它。
# 格子里的数走 `lasting()` 的那套量词(秒/分钟/小时/天),和这个 app 里
# 每一处时长同一套词——列头是名词,格子里是数,两者不重复。
# 命令行**单独成一列**(2026-09-04 定稿):它和进程名回答的是两个问题——名字说
# 「这是什么程序」,命令行说「这一个和那一个差在哪」。turing 上两个 vLLM 的
# name 和 cmd 完全相同,能分开它们的只有 PID 和显存;把命令行挤在名字后面,
# 这一列存在的理由在窄档就没了。
# 散点的脚注。两根轴复用 `vitals-name-cpu` / `vitals-name-mem`——**同一个量在这个
# app 里只有一个词**,而且同 section 里两个键同文本会在构建时被拒(build.rs 那条)。
# **三台机器同一对轴**(横 CPU × 纵 内存):这两个量每台机器每个进程都有,所以不会
# 出现「一边一批进程」,也不会为了某台机器悄悄换一根轴——换轴是最大的误读入口。
# 显存不画成轴,画成点外面那圈光晕的面积;脚注把两个真实读数印出来,任何人都能
# 当场核这圈光晕分不分得开。
top-plot-halo = "光晕 = 显存 · {0} 是 {1}px,{2} 是 {3}px"
# ⚠️ **墓碑:`top-plot-x`(「横」)和 `top-plot-y`(「纵」)没了,没有替代键。**
#
# 它们是那两行选择器左边的引导词——「横 CPU 内存 显存 时长 · 纵 …」。
# 2026-09-05:「散点图搞成带X和Y label的。通过点击label,去切换X或y的值」,
# 于是那两行整个撤掉,选择器变成**印在轴上的那一个词**(`AxisPick`)。
#
# **一个印在横轴底下正中的词不需要再说自己是「横」的**——它站的位置就是那句话。
# 留着这两个键会让人以为标签是「横 CPU」两个词,而它是一个。
# 每根轴末端印的那把尺。**必须印,不许省。** 这块图的两根轴不是一律平方根:
# 一个量的最大值比它的中位数大出两个数量级以上时,平方根也压不开,那根轴就换成
# 对数(见 `Scatter`)。而换不换是**按这台机器这一列的数据**定的——同一对轴在
# 两台机器上可能不是同一把尺,于是「同一个位置」在两台机器上意思不同。
#
# 把尺印在轴上,是这件事唯一诚实的出路:读的人一眼看得见自己在读哪把尺。
# 两个都印,不是只印换了的那个——只印异常的那个,等于要求读者知道「没有标记
# 就是平方根」,而那是一条没人教过他的规矩。
top-plot-sqrt = "√"
top-plot-log = "log"
# 有几行画不上去。**必须印,不许省。** 显存和时长这两个量不是每个进程都有
# (实测:Mac-mini 和 hinton 上 200 行**没有一行**有显存读数,turing 上只有 3 行),
# 而「没读到」不能画在 0 那个位置——那会把「没看到」变成「最小的那个」,正是这块
# 图一直在防的邻居值错误。所以那些行**不画**,而不画了多少必须说出来:一张
# 少了三分之二个点的图,和一台闲着的机器长得一模一样。
top-plot-off = "{0} 行没有这两个量的读数,没画"
# 进程表里那**一列**的名字。2026-09-04:「表的进程和命令合并为一列,就叫命令」。
# 之前是两列 —— `top-name`(「进程」)加这一列(「命令行」)—— 而它们说的是一件事的
# 两半:那个识别词只有**挨着它区分的那个名字**时才有意义(三行都写着 `python3`,
# 靠 `api_server` / `train.py` / `worker` 分开)。中间隔一条列边,第二半读起来
# 就成了关于这个进程的另一个事实。
#
# **`top-name` 随之撤掉,没有替代键**:合并之后它没有任何落点,留着会让人以为
# 还有一列叫「进程」。
#
# 「命令」不是「命令行」:线上过来的 `arg` 是**一个识别词**不是一整条 argv
# (`khor_core::TopRow::arg` 写着为什么),叫「命令行」是许诺了一个这一列给不出的
# 东西。
top-cmd = "命令"
# 折叠起来的那一行右边那个计数。**同名、同识别词、同用户、同父进程**的若干个进程
# 折成一行(2026-09-05:turing 的表里十行都是 `tokio-rt-worker serve`),这个数说的是
# 「这一行代表几个」。按一下列出成员,再按一下折回去。
#
# **`×` 不是乘号是「个」**:这一行不是一个进程的十倍,是十个进程的一行。
top-fold = "× {0}"
top-time = "时长"
# **累计烧掉的 CPU**,和它左边那个「时长」是一对,而这一对最容易被读成一件事
# (2026-09-05:「列太少了,不饱满」那一批加的四列之一)。
#
# 分界在**谁的秒**:「时长」是墙上的钟走了多久,「CPU时间」是这个进程占着核心
# 烧了多久。一个进程占四个核,它每过一秒就烧掉四秒——所以**这个数可以比时长大**,
# 而且经常大。看见 CPU时间 比时长长不是 bug,是多核。
#
# 名字里带「CPU」不是啰嗦:去掉之后两个列头都叫「时间」,而这一列存在的全部理由
# 就是它和另一列不是同一个时间。
top-cputime = "CPU时间"
# **这个进程从起来到现在一共读写了多少字节**(读 + 写,两个数加起来)。
#
# **是「从它起来到现在」,不是「刚才这一小会儿」**:后者要除以一个谁也说不清的
# 窗口(本机 5 秒、远端 20 秒、CLI 一次性那档又是另一个数),一个没有窗口的字节数
# 不是事实。总量有明确的起点,而它左边就是「时长」——想要速率的人自己除。
#
# **空着的格子不是零。** 在一台多人的机器上 khor 读不到别人的进程的这个数
# (Linux 的 `/proc/<pid>/io` 只有属主看得见,macOS 那个调用也拒绝别人的进程),
# 而库在这两种情况下都回一个 **0**,不是错误。所以采集侧先按属主判要不要读
# (`khor_node::top::io_readable`),读不到就空着——一个「0 B」会把「我看不到」
# 说成「它不碰盘」。
top-io = "读写"
# 进程现在在干什么。**三个平台各说各的话,这里收成一套词**,而映射写在
# `khor_node::top::status_token` 一个地方——不是散在几处 `if`。
#
# **这一列最大的风险不是词不准,是它把「读不到」说成「运行」。** sysinfo 自己就
# 栽在这上头:macOS 上 BSD 的 `p_stat` 对大半个机器都报 SRUN,库知道这一点、也
# 写了一段用线程状态去纠正它的代码——而那段代码调用的参数是错的,失败之后**兜底
# 造了一个「Running」**。2026-09-05 实测:对同一批 195 个 pid,库说 `run` 的有
# 156 个在 `ps` 那里是 `S`(睡着),而两边都说 running 的**一个都没有**。
# khor 因此在 macOS 上另问了一次「有几个线程真在核上」(`mac_running`)。
#
# **对不上的变体不许吞成「运行」**:采集侧的 match 是穷举的,sysinfo 哪天多一个
# 变体,那个文件**编译不过**——这条规矩由编译器守着,不由谁记着。真遇上没有名字
# 的状态,它带着号码原样过来(`unknown-13`),脸上照印,不借别人的词。
top-status = "状态"
# 一套共同词汇。**每个词只说一件事,而且和邻居分得开**——「已退出」和「僵尸」都是
# 死了,分界是**父进程收没收**;「等盘」和「休眠」都是在等,分界是**叫不叫得醒**。
#
# **「闲置」和「新建」是同一个 sysinfo 变体在两个平台上的两件事**:Linux 的 `I`
# 是一个闲着的内核线程,macOS 的 `SIDL` 是**一个正在被 fork 出来的进程**。
# 合成一个词就是凭空造一个两边都不成立的事实。
top-st-run = "运行"
top-st-sleep = "休眠"
top-st-idle = "闲置"
top-st-spawning = "新建中"
# Linux 的 `D`:在等盘,而且**叫不醒**——机器发木的时候要找的就是这一行。
# macOS 把同一件事报成另一个变体名(见 `status_token`),收到同一个词下面。
top-st-diskwait = "等盘"
top-st-dead = "已退出"
top-st-zombie = "僵尸"
top-st-stopped = "已暂停"
top-st-tracing = "被调试"
top-st-parked = "停驻"
top-st-wakekill = "待唤醒"
top-st-waking = "唤醒中"
top-st-suspended = "已挂起"
top-st-lockblocked = "等锁"
# macOS 专有的一档:那台机器连「有没有线程在核上」都不肯说(通常是别人的进程)。
# **它不是「运行」也不是「休眠」**,而这一档存在的全部意义就是不让它变成那两个
# 里的任何一个——那正是库犯的错。
top-st-unclear = "说不准"
# 抽屉的小标题右半:这一组有几样东西。**是数量不是读数**——读数在上面那个环里,
# 这里回答的是「这个环底下有几张卡 / 几个卷 / 几个占用者」。卷用这个键,卡和核
# 复用已有的 `gpu-sub-nomem` / `cores-sub`。
#
# **这两个键是一副对子,分界在语法上**:`vols-sub` / `gpu-sub-nomem` 是一个**光秃
# 的计数**(「3 卷」),数完了这个环就没别的了;`procs-sub` 前面挂着一个**限定语**
# (「占用最多的 6 个进程」),它自己就说了这是从几千个里挑出来的前几个。一张卡、
# 一个卷是机器的**零件**,读数加起来就是上面那个环;一个进程只是**占用者**,前几个
# 加起来**不等于**那个环。(`Vitals` 里没有 per-core 数组、也没有内存分解,所以这两
# 个环底下能诚实摆出来的只有「谁占得最多」,不是「它由什么构成」。)
#
# 这件事**以前是靠抽屉底下一句脚注说的**——「占用最多的几个,加起来不等于上面那个
# 环」。用户判它「很蠢」,撤掉了。撤掉的是那句道歉,不是那个事实:事实挪进了小标题
# 的语法里,所以它现在**不占一行、也不会在读完之后还杵在那儿**。守门盯的正是这条
# 分界(`check-face` 的「a drawer of occupants says so in its heading」):把限定语从
# `procs-sub` 拿掉、或者给 `vols-sub` 也加一个,两边都会红。
vols-sub = "{0} 卷"
# CPU 与内存那两组的数量词:抽屉里是占用者,所以数的是进程条数,不是零件个数。
procs-sub = "占用最多的 {0} 个进程"
# 抽屉里还有多少没露出来。**只在真的还有的时候出现**:四张卡正好装得下时不出现,
# 拖到底也消失——**一句常驻的提示等于没有提示**,它会变成小标题的一部分而不是一个
# 状态。**这个条件仍然是量出来的**(数出真的被下沿切掉的行),改的只是措辞。
#
# 措辞里**不再报那个数**。报数的版本是「还有 {0} 个在下面,拖一下」,用户判它
# 「很蠢」:那个数没人拿它做任何事——看见有就往下滑,是 3 个还是 7 个不改变下一步
# 动作,而它每多一个数就多一处要和列表对齐的地方。留下的是动作本身。数还在
# `data-drawer-more` 上,守门量的是它,所以「什么时候出现」照旧守得住。
drawer-more = "下滑查看更多"
# The band under the CPU ring: a day of five-minute buckets.
top-day = "最近 24 小时 CPU"
# How old the reading is. **Printed on every reading that is not this
# machine's own**, because a number with no age is read as the present:
# a machine that has been off since yesterday would otherwise show
# yesterday's CPU as if it were now (docs/SESSION.md 离线).
vitals-taken = "{0}前的读数"
# Which khor that machine runs. Said only when it is known: a machine
# whose khor predates the field says nothing here, and that silence is
# itself the answer an upgrade sweep is looking for — the same rule the
# GPU follows one line up.
vitals-version = "khor {0}"
# Never reached since this khor started. Not the same as an old reading,
# and not 「0%」 either — those send a person to look at different things.
vitals-never = "还没问到"
# Tokens spent, one day at a time (khor_core::Tokens). **Four numbers and
# no total**, because on this machine the cached reads outnumber the
# output five hundred to one: a sum would be almost entirely cache and
# would move with how often a conversation was resumed rather than with
# how much work was done.
#
# 「缓存」 is the vendors' own billing vocabulary, printed on their own
# dashboards — it is the domain, not khor's implementation, so it is not
# the 「不解释实现」 rule being broken. What the two cache words are for is
# the question 「输入」 raises on its own: why is it so small.
tokens-input = "输入 {0}"
tokens-cached = "读缓存 {0}"
tokens-cache-write = "写缓存 {0}"
tokens-output = "输出 {0}"
# Said when a machine has spent nothing in the window being shown. Not an
# empty listing: a machine that answered 「nothing」 and a machine that was
# never asked are different things, and only one of them is news.
usage-none = "这几天没花"
# Never reached since this khor started — the same third state the
# readings have, and the same reason it needs its own word. It cannot
# borrow the readings' 「还没问到」 either: same fact, different question,
# and the catalog refuses two names for one text by design.
usage-never = "还没问到这台的账"
# How old the answer is, said on every one that is not this machine's
# own. Without it a stale answer reads as the present.
usage-taken = "{0}前的账"
# Records khor found and could not read. Said only when non-zero: a
# vendor reshaped a file khor reads, and the totals above are therefore
# missing something. Zero and silence mean the same thing; a non-zero
# count and silence do not.
usage-unreadable = "有 {0} 条读不出来,总数少算了那些"
summary-sent = "摘要已发,等对方许可。传输号: {0}"
# Said before accept goes quiet, and only when this machine does not
# have the offer yet. A verb that sits silent gets killed and re-run,
# which is exactly the ten-second guessing this was written to end — so
# the line carries the shape of the silence, not just its existence:
# how many machines are about to be asked, and what one that is off
# costs. Both numbers are read off the thing itself (the device table,
# `khor_node::link::dial_budget_seconds`); neither is a guess, and a
# printed worst case that is not true would be worse than no line.
syncing-for-offer = "本机还没有这笔传输的记录,先同步一轮;有 {0} 台机器要问,联系不上的每台最多 {1} 秒"
pulled = "收下了,这一趟拉了 {0} 字节"
pulled-to = "拉了 {0} 字节,落在 {1}"
# The no-silent-caps rule at the CLI: a listing cut at the cap must say
# so, or a directory's first page reads as the whole of it.
dir-truncated = "目录太大,只列出前 {0} 条"
# Borrow prints where the proxy listens because a browser or HTTPS_PROXY
# points there, and how to collapse it because nothing else says so.
borrowing = "借着 {0} 的网,代理口在 {1};把浏览器或 HTTPS_PROXY 指过来。收口: khor close {2}"
broken-blocks = "有 {0} 个块读不出来,这段对话缺了一截"
serve-banner = "khor serve: {0} 在听,配对与同步都归它"
web-banner = "网页脸在 {0} 听着;要链接跑 khor web"
# `khor hooks`. The file is named on every run, installing or not: khor
# is writing into something the user owns, and "which file" is the first
# thing they need to be able to check.
hooks-file = "钩子写在: {0}"
hook-here = "装好了"
hook-missing = "没装"
# Not the same as 没装: khor is in that settings file, pointing at a khor
# somewhere else. Reading the two the same way would make a moved binary
# look like a working install.
hook-elsewhere = "装的是另一个 khor: {0}"
# Said only when something is missing. Names what installing buys,
# because "your hooks are incomplete" without that is a chore with no
# reason attached.
hooks-worth-installing = "装上钩子才有「完成」这一档(读盘给不出): khor hooks install"
hooks-added = "装上了: {0}"
hooks-repointed = "改指到这个 khor: {0}"
# The line that makes idempotence visible. Without it a second install
# looks exactly like a first one, and "装两遍=装一遍" is a claim the user
# cannot check.
hooks-already = "本来就有,没动: {0}"
# Advice, not a mechanism: what claude does with a settings file while it
# is running is claude's business, and the reliable move is stated
# instead of guessed at.
hooks-restart-claude = "已经在跑的 claude 要重开才一定读得到"
# `khor hooks uninstall`. Both outcomes get a word for the reason the
# install side has three lists: **nobody can check somebody else's
# settings file by hand**, so the run has to say what it did — and
# "removed nothing" has to be sayable, or twice-removed cannot be shown
# to equal once-removed.
hooks-removed = "卸掉了: {0}"
hooks-none-to-remove = "本来就没装,没动"
# The agent registry (批⑥). An empty list says how to fill it, because
# an empty listing and a broken one look the same otherwise — and the
# one line a person needs next is the one they cannot guess.
#
# The registration is spelled back as the command they typed rather than
# as the launch JSON it is stored in: the JSON is what starts the agent,
# and reading it back is reading an implementation.
agents-none = "还没登记过 agent: khor agents add <名字> -- <命令...>"
agents-added = "登记好了: {0}"
agents-forgotten = "不再登记: {0}"
# Forgetting a name nobody registered is not an error — the caller asked
# for a world without it, and that is the world. But it must not print
# 「不再登记」 either, or a typo reads as a success.
agents-was-not-there = "本来就没登记过: {0}"
# The snapshot of the ACP registry khor ships with (`khor agents known`).
# **「khor 起得来」不是「它能用」**:目录只知道一条 argv,而它跑不跑得起来、
# 要不要先登录、协议实现了哪半边,全都要握手才知道。这行字里不敢有任何
# 一个词像是承诺。
agents-known-startable = "khor 起得来"
# The other half: khor has no argv for it because it ships a platform
# binary. **不是「接不了」**——把它装好、把命令告诉 khor,和第一天一样能用。
# 两句话必须读起来不一样,不然人会以为这些 agent 用不了。
agents-known-byhand = "自己装,然后 khor agents add <名字> -- <命令...>"
# Heading for the list, carrying the two things that keep it honest:
# where it came from and when.
agents-known-head = "ACP 注册表快照({0},{1} 个,其中 {2} 个 khor 起得来)"
# `khor agents sessions <名字>`:这个 agent 说它有哪些会话(`session/list`)。
#
# **下面两句必须读起来完全不同,那是这组文案存在的理由。** 「它答不了」和
# 「它没有」是两个事实,而一个空列表会把它们画成同一个样子——一个正忙的
# agent 会被报成全新的。协议里 `session/list` 不是必答项(必答的只有
