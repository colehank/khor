# 墓碑(2026-08-28):这儿原来有 `usage-earlier`(更早)和 `usage-vs-peak`
# (条长 = 和最忙的一天比)。两个词都只服务主页右栏那本日账,而主页只剩
# 地图和额度环了(用户原话:「Khor 主页不显示输出 token 什么的」),日账
# **有意没在 GUI 里另找落点**——「还能用多少」是额度环答的,「花了多少」
# 是 `khor usage` 答的。词跟着落点走:留一个没人查的键,下一个人会以为
# 界面上还有那块东西。
#
# 新标签页上,把一条最近去过的记录送走。**动词是「去掉」不是「删掉」**:
# 账本里它是个墓碑而不是一次删除(`khor_sync::recents`),再去一趟那个地方
# 它自己就回来了——所以这句话不许听起来像那个目录没了。
#
# 段名由调用方递进来({0} 是「最近去过」那个标题),而不是写死在这句里:
# 两个浏览型落点共用同一个标题键,写死就是第二份出处,而且第三个落点接上来
# 的时候它会静静地指错列表。**这也是它不复用 `remove`(「去掉」)的原因**:
# 那个词在补全菜单和状态条上说的是「拿掉这一条」,而这一行旁边就写着一个
# 真实的目录路径,单说「去掉」的读法里有一个是「把那个目录去掉」。
forget-place = "从{0}中移除"
# The terminal's own search (⌘F while it has the keys): where in the
# scrollback a word is. 终端 names the surface the way `search-sessions`
# and `search-devices` name theirs; the count beside the field is two
# numbers and needs no words, and an empty answer is the lists' own
# `no-matches`.
search-terminal = "搜索终端"
# The two steps through what was found, named for the direction. ⏎
# and ⇧⏎ do the same from inside the field.
match-prev = "上一个"
match-next = "下一个"
# The find bar's two toggles (item 70), named for what they turn on,
# the words Terminal.app's and VS Code's find bars use.
match-case = "区分大小写"
match-regex = "使用正则表达式"

# ── 额度详情页下半张:花掉的 token ──────────────────────────────
#
# ⚠️ **这一整段是占位,等用户定。** 2026-09-08 加进来的时候,先有能跑的界面
# 比先有对的措辞要紧;每个键的**位置和它要表达什么**已经定了(见下面各条),
# 只有词本身还没过用户那一关。改词不动键。
#
# 已经存在、这半张也在用的三个键,不在这里重复:`gui.accounts-models`(那一列
# 的名字)、`cli.usage-model-unnamed`(源头没写是哪个模型)、`cli.usage-none`
# (这几天没花)。

# 这半张的名字,**整块只有这一行**。
#
# ⚠️ **墓碑:`usage-zone-trend`(「趋势」)和 `usage-zone-stats`(「统计」)没了,
# 2026-09-08,由这一个键顶替。** 那两个是两条控制条的标题,而控制条整个撤了
# (排序回到列头,换轴的词长在轴上)——照机器卡片那块图的样子,它连一个标题都没有。
#
# **但这一行留着,而机器页那块没有,这不是不一致。** 2026-09-08 量过:订阅详情
# 那一栏只有三个孩子——账户身份行、环和窗口、这半张,**没有任何一行说过「下面
# 这块是 token」**。上面那半讲的是钱和额度,这半讲的是 token,两者之间只隔一条
# 横线;把这行也删掉,等于把唯一区分它们的那句话删了。机器卡片不需要,是因为
# 那张卡整张都在讲同一台机器。
usage-title = "Token 用量"
# 趋势区的两个视角。按天是一天一根堆叠柱,按模型是一根柱一个模型。
usage-view-day = "按天"
usage-view-model = "按模型"
# 区间。**它管的是取哪几天,不是重算**——两个区间重叠的那几天,数逐字相同。
# 「全部时间」不写「全部」:那两个字在这一段里已经是会话列表的
# (`sessions-all`),而同一个词在同一段里指两件事就是这份文件不许的那种。
usage-window-all = "全部时间"
usage-window-days = "{0} 天"
# 散点两根轴和表里那几列共用的量名。**同一个量在图上和表里必须是同一个词**,
# 否则读的人要在两套说法之间自己搭桥。
# 总量是四项之和:新读入 + 输出 + 读缓存 + 写缓存(负责人 2026-10-07:「我们的总量
# 也要等于新读入、输出、读缓存、写缓存四项之和」)。在那之前是输入加输出。
usage-axis-total = "总量"
usage-axis-input = "输入"
usage-axis-output = "输出"
usage-axis-read = "读缓存"
usage-axis-write = "写缓存"
usage-axis-rate = "缓存占比"
usage-axis-reuse = "缓存复用"
# 这个模型**真的跑过**的天数,不是窗口有多少天。窗口那个数在
# `usage-sum-days`。两个都叫「天数」的话,表里那一列和底下那个数会互相解释
# 成对方。
usage-axis-days = "天数"
# 尺子。**必须印,不许省**,理由和散点图那条一样(见 `top-plot-sqrt`):
# 一根弯了而不说的轴,是一张不出声地撒谎的图。这几个词印在轴的标签旁边,
# 位置和机器页那两个(`top-plot-sqrt` / `top-plot-log`)一样。
#
# ⚠️ **墓碑:`usage-ruler-auto`(「自动」)和 `usage-pick-ruler`(「尺子」)没了,
# 2026-09-08,没有替代键。** 它们是一个「手动换尺」的下拉框,而机器页那块图
# **没有这个控件**——尺子是量出来的、印出来的,读的人不改它。同一个想法在两块
# 图上有两套控件,正是「看起来是两个产品」那句话里最实的一层。
# 要是哪天真需要手动挡,那是**两块图一起加**,不是只加一块。
#
# ⚠️ **2026-09-10:这三个词以前是「线性」「平方根」「对数」,而上面那句
# 「位置和机器页那两个一样」只说对了位置。** 机器页印的是 `√` 和 `log`
# ——符号——所以同一把尺在两块图上是两个样子,而用户为这件事说了不止一次:
# 「明明说了和机器对齐,就是做不到」。他是对的,而且这是一眼可查的:两组键
# 并排放着,一组符号一组中文词。**没有任何东西会因为那句注释不对而变红**,
# 所以它一直躺在那儿。
#
# 线性那一档现在印空:机器页在线性时什么都不印,而理由是成立的——**不印
# 的意思是「这根轴没弯」**,而弯了的那两把必须印。留着「线性」两个字反而
# 让读者以为那也是一种要留神的尺。
usage-ruler-linear = ""
usage-ruler-sqrt = "√"
usage-ruler-log = "log"
# 这一列所有读数都一样,没有跨度可画。**它不是一把尺**,而这正是它要有自己
# 一个词的原因:印成「线性」会让人以为那条平线是量出来的形状。
usage-ruler-flat = "只有一个读数"
# 堆叠柱上那条虚线。**堆叠的纵轴不许弯**(段要相加成柱高),于是「平常的
# 一天」在这张图上没有位置,只有峰值有——这条线是补回那个位置的东西。
usage-median = "中位 {0}"
# 统计区右上角:这一窗到底是哪几天。
usage-range = "{0} → {1} · 共 {2} 天"
# ⚠️ **墓碑:`usage-col-span`(「首 → 末」)没了,2026-09-08,没有替代键。**
# 那是表最后一列——这个模型第一次和最后一次出现的日子——用户点名不要。
# **`Agg` 上的 `from` / `to` 两个字段跟着一起撤了**:它们每一行每一个窗口
# 都在算,而除了那一列没有第二个读者。
# 设置面板里第三行的名字。⚠️ **这个键 2026-09-08 撤过一次又回来了**:撤的时候
# 面积那个量的选择器长在脚注的词上,那个词自己就是控件,所以不需要一个行名;
# 同日用户裁「都做成一个小的设置按钮」,面板里那一行就又需要一个名字了。
usage-pick-area = "面积"
# 机器页「进程」那一节的小标题(2026-09-28:机器页的几块成了板上的几节,
# 每节一行小标题;散点的 ••• 站在这一行的右端)。
top-section = "进程"
# 散点脚注:**点的面积是哪个量**。X 和 Y 不在这句里——它们印在自己那根轴上,
# 而且那个词本身就是换轴的按钮(`components/AxisPick`,和机器页同一个控件)。
# 这一句只剩第三个量,形状照 `top-plot-halo`(「光晕 = 显存 · …」)。
#
# **面积承载数值,所以半径取它的平方根**——半径直接读数会让 4 倍的值看着大 16 倍。
# ⚠️ **墓碑:`usage-scatter-foot` 并进了 `plot-area-is`,2026-09-08。**
# 两页的散点现在说的是同一句话(「点的面积是哪个量」),而同一件事该只有一个词
# ——两个键会各自漂,而且漂了不会有任何东西喊。
# 底下四个数之一:这一窗有多少天。和 `usage-axis-days` 是两回事,见那一条。
usage-sum-days = "窗口天数"
# ⚠️ **墓碑:`usage-trend-note` 没了,2026-09-08,没有替代键。**
# 那是堆叠柱底下那句「柱高是当天的输入加输出,柱里的分段是各个模型」,
# 用户点名不要。它唯一的读者是 `UsageHalf` 里那一个 `<p>`,一起撤了。
# ⚠️ 下面两条是「读不到」的两种,**它们不是同一件事,所以不共用一个词**。
# 两条都出现在图本该在的位置上,而图一张都不画——一张空图不是「没读到」,
# 它是「这个账户没花过钱」那张画,而那是没人证实过的事。
#
# 这家压根不出 token 报表(钱包只报余额,登记的订阅只报百分比)。
# **这是常见答案,不是故障**,所以措辞里不能有「失败」的味道。
usage-no-report = "这家只报告费用，不报告 token"
# 答话那台 khor 比「按模型切分」这件事旧(`Usage::models` 空着,而
# `Usage::days` 不空)。**它和「没花过」区别得开**,后者两个都空。
usage-no-models = "那台机器无法按模型拆分"
# 这一窗里一行都没有,而别的窗里有。2026-09-09 加,在这之前它**根本没有词**
# ——那种屏幕上整块什么都不画,而「还没答」也是什么都不画,于是**一个还在
# 加载的样子被拿来说「这个窗口没花费」**,那是这仓那条「一档接不上会变成
# 旁边那一档」,而这次变成的是一个永远不会结束的加载。
#
# ⚠️ **这三句(不报 token / 答不出切分 / 这一窗没有)能并排存在,靠的是
# 主语各不相同**:厂商、答话那台机器、窗口。不是措辞不同,是说的不是同一
# 件事。改词的人先看这一句。
usage-window-empty = "这段时间内没有花费"
# 这家的 token 报表里没有缓存那两个数(new-api 的日志只有 prompt/completion,
# `ModelTokenDay::cache_split` 是 false)。于是四列缓存整列不画——**而不画
# 和不报是两件事**:读的人看得见那几列不在,看不见为什么不在,而「这家不报」
# 和「khor 没读到」一个是事实一个是故障。
#
# ⚠️ **主语和 `usage-no-report` 是同一个(厂商),所以用同一个词「这家」。**
# 初稿写的是「这个来源不报缓存」,而「来源」在这一页是另一根轴的词
# (`quota-by`,指这条登记从哪台机器来的)——同一屏上一个东西两个称呼。
usage-no-cache = "这家不报告缓存"
# **点的面积是哪个量**,两页共用。X 和 Y 不在这句里——它们印在自己那根轴上。
# **面积承载数值,所以半径取它的平方根**:半径直接读数会让 4 倍的值看着大 16 倍。
# ⚠️ **墓碑:`plot-area-is`(「面积 = {0}」)没了,2026-09-10,没有替代键。**
# 用户:「所有散点,无论机器还是api,都不要有下面的面积注释」。那个量并没有
# 变得说不出来——它就是设置面板里的一行,和 X、Y 并排;撤掉的是**一句在屏幕
# 上重复「刚才那一下按的是什么」的话**。两块图从同一个键印它,也从同一个键
# 一起撤。
# 散点上画不出来的模型有几个。**必须印,不许省** —— 一个量读不到的模型不会
# 被画在 0 那个位置(那会把「没读到」变成「最小的那个」),它整个不画;而一张
# 悄悄少了一个点的图,和那个模型从没跑过长得一模一样。
#
# 和机器卡片的 `cli.top-plot-off` 是同一句话说的同一件事,分开两个键是因为
# 那边数的是进程「行」,这边数的是「模型」——同一个词在两块图上会指错东西。
usage-scatter-off = "{0} 个模型缺少这两项读数，未绘制"

# ── 菜单栏 (2026-09-28) ─────────────────────────────────────────────
# macOS 的菜单栏,`apps/gui/src-tauri/src/menu.rs` 照这一节搭。**单开一节**,
# 因为菜单栏的词是系统的标准词(「显示」「编辑」「关闭窗口」),而 [gui] 里
# 已经有同字的键(`web-key-show`、`accounts-edit`、`window-close`)各有各的
# 英文——一节里一个字只能有一个名字(build.rs 第 3 条)。用词照访达和 Safari
# 的中文菜单:人在别的 app 里学到的词,在这里还是那个词。
# 五个落地页的名字不在这里:菜单里就是竖栏上那五个词(`gui.sessions-tab` 等)。
# 「新建…」只在当前落地页没有「+」时出现;有的时候菜单项换成那颗「+」自己
# 的名字(「新会话…」「新标签页」),菜单说的就是 ⌘N 真会做的事。
[menu]
about = "关于 khor"
# UX-16 ruling (2026-10-05): on a Mac the settings window holds settings
# only; 我的 khor and 诊断 open in the main window from here.
my-khor = "我的 khor"
doctor = "诊断"
settings = "设置…"
lock = "锁定"
services = "服务"
hide = "隐藏 khor"
hide-others = "隐藏其他"
show-all = "全部显示"
quit = "退出 khor"
file = "文件"
new = "新建…"
new-tab = "新建标签页"
import = "导入会话…"
close-tab = "关闭标签页"
close-window = "关闭窗口"
edit = "编辑"
undo = "撤销"
redo = "重做"
cut = "剪切"
copy = "拷贝"
paste = "粘贴"
select-all = "全选"
find-list = "查找…"
view = "显示"
find = "搜索"
reload-term = "刷新终端"
prev-command = "跳到上一条命令"
next-command = "跳到下一条命令"
command-history = "历史命令…"
# ⌘+ ⌘− ⌘0 (item 22): Terminal.app's 显示 › 放大 / 缩小 / 默认字体大小, for
# the terminal's type alone.
term-bigger = "终端文字放大"
term-smaller = "终端文字缩小"
term-actual = "终端文字默认大小"
fullscreen = "进入全屏幕"
# ⌃⌘S (显示 › 隐藏边栏, the audit fix plan F6.7): the word says what
# pressing it does, so it follows the list — hidden, it offers to show.
hide-sidebar = "隐藏边栏"
show-sidebar = "显示边栏"
window = "窗口"
minimize = "最小化"
zoom = "缩放"
next-tab = "显示下一个标签页"
prev-tab = "显示上一个标签页"
front = "前置全部窗口"

# ── 单数 ─────────────────────────────────────────────────────────────
# **A count of one, where English says it differently** (2026-10-03:
# 「1 minutes ago」). Chinese has no plural, so these read as the counted
# words they stand beside (`cli.age-*`, `cli.uptime-*`,
# `cli.lock-idle-after`) — in a section of their own, because the
# one-text-per-name rule would refuse them beside their twins. Picked by
# `khor_catalog::count` (Rust) and `words.ts` `count` (the GUI), never
# at a call site.
[one]
second = "{0} 秒"
minute = "{0} 分钟"
hour = "{0} 小时"
day = "{0} 天"
up-day = "已运行 {0} 天"
up-hour = "已运行 {0} 小时"
lock-idle-after = "闲置 {0} 分钟后自动锁定"
