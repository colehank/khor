# A satellite's road column: it has no road of its own — its sponsor
# speaks for it — so where every other machine shows 直连/中继 this
# shows who it speaks through (both faces use it; 呈现处标「经 <sponsor>」
# is the batch's own acceptance line).
via-sponsor = "经 {0}"
# The tmux probe's two outcomes, told at adoption so the terminal's
# nature is no surprise later (docs/SESSION.md 例外墓碑: persistence on
# a satellite is borrowed from its own tmux, never hosted by khor).
sat-tmux-yes = "它有 tmux，在它上面开的终端能持久"
sat-tmux-no = "它没有 tmux，在它上面开的终端是临时的（连接断了就没了）"
# Said only when the number is non-zero. Zero rows and zero unreadable is
# an idle machine; zero rows and a non-zero count is khor being out of
# date, and nothing but this line tells the two apart.
#
# Neither "智能体" nor "落盘" any more: the count also covers a tmux
# session khor could not describe, and tmux is not an agent and is not
# read off disk — it is asked. A machine with **no** tmux is not counted
# here at all, because zero rows is then the truth (adaptor::tmux).
adaptor-behind = "有 {0} 个正在运行的 session 无法读取，khor 不认识它的格式"
# The fold's one line (退场批): dead + looked at + past the threshold
# stays off the default listing, and this says how many — a count that
# is silent would read as the rows having been deleted, which they
# never are.
old-sessions-hidden = "{0} 条旧会话没列出来（--all 全看）"
age-seconds = "{0} 秒"
age-minutes = "{0} 分钟"
age-hours = "{0} 小时"
age-days = "{0} 天"
link-last-heard = "{0} · 上次 {1}前"
# A machine's readings (khor_core::Vitals). Each unit prints its own
# denominator: 「78%」 and 「78% / 12 核」 are two different sentences, and
# only the second one can be acted on.
vitals-cpu = "CPU {0}% / {1} 核"
vitals-mem = "内存 {0} / {1}"
vitals-disk = "磁盘 {0} / {1}"
# The same readings' names on their own, for the face of a ring: the arc
# is the gauge, the middle holds the value, and the name goes under it.
# **The sentence above and the name here are never on screen together** —
# the sentence is what the ring turns over to show, so this is not the
# same words printed twice, it is the short form and the long form of one
# reading, each on the side that has room for it.
vitals-name-cpu = "CPU"
vitals-name-mem = "内存"
vitals-name-disk = "磁盘"
# The disk khor's home sits on could not be identified. It gets a word
# rather than being left out, because a missing line and a machine that
# could not answer read the same otherwise — and 「0 / 0」 would read as
# an empty disk (docs/SESSION.md 认不出就不落词).
vitals-disk-unknown = "磁盘 未知"
# The graphics hardware, when khor could read it. **There is deliberately
# no 「说不上」 word to match the disk's above**, and the asymmetry is the
# judgment: khor's home is always on some filesystem, so failing to name
# it means khor could not answer and is worth saying out loud. A machine
# with no GPU, or one khor cannot ask, is an ordinary machine — a line
# announcing that on every desktop without a card is noise reporting a
# non-event. So the whole line is simply absent (khor_core::Gpu).
vitals-gpu = "GPU {0}% / {1} 卡"
vitals-name-gpu = "GPU"
# Video memory, summed over the cards. Absent on unified-memory machines,
# where those bytes are already counted in 「内存」 above and a second line
# would put the same memory on screen twice under another name.
vitals-vram = "显存 {0} / {1}"
# 一张卡自己的一句(khor_core::GpuCard):几张卡就几句,不再平均。名字是驱动
# 报的原话,报不出名字的卡由两端各自退回「GPU」那个词。显存跟在同一句里,
# 不拆第二段——smoke 按两空格数段落,GUI 一卡一环,两边段数要对得上。
vitals-gpu-card = "{0} {1}%"
vitals-gpu-card-mem = "{0} {1}%，显存 {2} / {3}"
# The card's day section and the words its dials turn over to
# (2026-09-03, redesigned twice to the user's references: four dials —
# CPU, GPU, 内存, 磁盘 — each an aggregate whose parts are a row apiece
# under it; a dial's face is the arc and its name, and what it turns
# over to is the quantity behind the share). `storage` went with the
# section it headed: a volume's row is its own mount point spelled out,
# and a heading over one row is a word that names nothing the row does
# not (2026-09-03「就写 /Volumes/disk0 就可以」).
# **`day-trend` 撤掉了,没有替代键**(2026-09-04)。那块图搬进四个环下面那个槽
# 之后,槽顶上那一行是它的三个读法词;再放一个标题要么把词挤出去、要么把图压下去。
# 而它说的那件事本来就不必说:一块画着 CPU/GPU/内存/磁盘 四行、横轴是钟点、右端
# 写着「现在」的图,不需要一句话告诉人它是「24 小时趋势」。
# The chart's own rows. Four readings, each on its own baseline
# (2026-09-03:「GPU、CPU、Mem、Disk 都绘制」): four lines in one frame
# cross, and a crossing is a place where two numbers become one shape.
# Stacked rows share the time axis instead, so a spike at 14:20 lines up
# vertically across all four without any of them hiding another. The
# row's name is the reading's own word (CPU / GPU / 内存 / 磁盘) — the
# same word its dial wears, so nobody has to learn a second vocabulary.
# 一行在右边说的那个数:一天的最高点,因为一条只画形状的行答不了「多高」。
# **热力带和山脊只画数字本身**(后面跟一个 7px 的 % 号),叠放那张才把话说全
# ——那里一根发丝是一个时刻,时间被压掉了,所以「什么时候」得写出来。
day-peak-at = "峰值 {0} · {1}"
# 两种**读法**,不是两个视图:同一份数据、同一个游标、同一组峰值,换的只是怎么看。
# 所以切换控件是两个词,不是 tab——无边框、无底色、无胶囊:tab 说的是「两个地方」,
# 而这里自始至终是一个地方。
# **词是「24h 日志」和「24h 统计」**(2026-09-06 用户改的):热力带是一天从左到右
# 读过去,是日志;叠放把一天折成每个指标一根轴,轴上画着四分位和中位,是统计。
# 键名不跟着改——`heat`/`para` 是守门里 `data-day-view-pick` 的锚,词才是给人看的。
# **「山脊」那一档撤掉了,键连带删了**(2026-09-06:「取消山脊图」),没有替代键。
# **2026-09-28「24h」挪进了这一节的标题**(`day-title`):机器页的几块成了板上
# 的几节,每节一行小标题,这两个词站在标题那一行的右端。读起来仍是「24 小时 ·
# 日志 / 统计」,只是「24h」不再在每个词前面说一遍。
day-title = "24 小时"
day-view-heat = "日志"
day-view-para = "统计"
# 游标读数条:那一刻,和那一刻每个读数是多少。**换读法不许丢掉它**——丢了就说明
# 三种读法各自记着自己的状态,那它们就不是同一份数据的三种看法了。
day-at = "{0} · {1}"
# 一段没人记的桶,写在那段空缺里,也写进游标读数条。**「没采到」不是 0**:
# 一条画过去的线会声称机器当时在做某件没人量过的事(docs/UX.md 不知道就说不知道)。
day-gap = "未采集"
# 时间轴最右端。整点刻度让位给它——两个词落在同一条基线上会读成一句话。
day-now = "现在"
# 压力色那一格的说明。**只有内存和磁盘**:满了会真的坏事的是这两个。
# 阈值取自档位表的最高一档,不写死——写死的数字会在档位改动之后继续言之凿凿。
day-strain-legend = "内存/磁盘 {0}+"
# 叠放那张的刷选读数:在一根轴上上下划,落在那一段的时刻整束亮起来,这一行说
# 「那些时刻别的指标是多少」。**中位不是平均**:一段刷选里常有几个离群的桶,
# 平均会被它们拽走,而这一行要答的是「那阵子通常是什么样」。
day-brush-head = "{0} 的 {1} 个时刻（{2} 小时）："
day-brush-median = "{0} 中位 {1}"
day-brush-none = "{0} 无数据"
day-brush-empty = "{0} {1}：没有落在此区间的时刻"
cores-sub = "{0} 核"
gpu-sub-nomem = "{0} 卡"
# The disk dial's whole, said as **how big and how many** rather than
# as used-over-total: the sum of two volumes rounds to 「1.1T / 1.1T」
# at one decimal — a sentence that reads full while the arc beside it
# says 95%. Used-over-total is right for one filesystem (`vitals-disk`,
# what `khor devices` prints per volume) and wrong for a sum, and the
# fix is the sentence, not more decimals.
disk-whole = "磁盘 {0} · {1} 卷"
# What every fill dial turns over to: how much is **left**, which is the
# number a person acts on — 95% and 「还剩 53.8G」 are the same reading,
# and only the second one answers 「能不能再放一份进去」.
fill-left = "还剩 {0}"
# The CPU and memory dials' second line: the day's high-water mark, from
# the same 288 buckets the chart below draws. Not an average — an
# average over a day of a machine that idles at night says nothing about
# whether it was ever short.
day-peak = "24 小时峰值 {0}"
uptime-days = "已运行 {0} 天"
uptime-hours = "已运行 {0} 小时"
updated-at = "更新于 {0}"
# **`yesterday-at` 撤掉了,没有替代键**(2026-09-04)。它是那块图上面
# 「昨天 15:34 → 15:34」里的「昨天」。整句一起删的:**窗口是画在轴上的**——
# 每三小时一个整点刻度,右端一个「现在」——再用一句话复述一遍,是同一个事实说
# 两遍,而复述的那一遍是会过期的那一遍。
# 一个卷一句(khor_core::Volume):磁盘不再只报 khor 家底那一块。名字的短写
# (Data→/、其余取末段)是画法,CLI 与脸各自拼,bytes() 先例。
vitals-vol = "{0} {1} / {2}"
# 一条关注的目录一句(khor_core::WatchedDir,2026-09-06):三种形状三句话——在某个卷上、
# 没有这个目录、在一个 khor 没列出的卷上。第三句不许并进第一句:那种路径的最长列出
# 前缀是根盘,并进去就是拿根盘的数说另一块盘的事。数字是它所在那个卷自己的读数。
vitals-watch = "{0} 在 {1}，还剩 {2} / {3}"
vitals-watch-missing = "{0} 没有这个目录"
vitals-watch-unlisted = "{0} 不在任何列出的卷上"
# The GPU memory column's head, and the word an older node's aggregate
# reading wears under its dial: one fact, one word, both places.
vitals-name-vram = "显存"
# The machine card's process top (2026-09-02:「环下面显示进程top」):
# the two column heads that are not a vitals name. CPU and 内存 reuse
# `vitals-name-cpu` / `vitals-name-mem` — same fact, same word.
# The process table's columns (2026-09-03:「PID、name、CPU、GPU、显存、
# Mem」). **PID is a column of its own** because it is what a person
# types next — `kill`, `lsof -p`, a grep — and a number buried beside a
# name is a number you have to select carefully. The account keeps no
# column: on one person's own machine every row says the same word, and
# on a shared box it belongs to the name it qualifies, so it rides under
# the name in the muted ink.
top-pid = "PID"
top-user = "用户"
# How long the process has been up (2026-09-04:「表格多个时间列」).
# **一段时长,不是一个时刻**:跨机器读「03:14 起的」要先知道对面的日期
# 和时区,而人在这张表前问的是「这进程是刚起的还是挂了三天了」。时长在
# 对面那台机器上算,所以两边的钟对不对得上都不影响它。
# 格子里的数走 `lasting()` 的那套量词(秒/分钟/小时/天),和这个 app 里
# 每一处时长同一套词——列头是名词,格子里是数,两者不重复。
# 命令行**单独成一列**(2026-09-04 定稿):它和进程名回答的是两个问题——名字说
# 「这是什么程序」,命令行说「这一个和那一个差在哪」。turing 上两个 vLLM 的
# name 和 cmd 完全相同,能分开它们的只有 PID 和显存;把命令行挤在名字后面,
# 这一列存在的理由在窄档就没了。
# 散点的脚注。两根轴复用 `vitals-name-cpu` / `vitals-name-mem`——**同一个量在这个
# app 里只有一个词**,而且同 section 里两个键同文本会在构建时被拒(build.rs 那条)。
# **三台机器同一对轴**(横 CPU × 纵 内存):这两个量每台机器每个进程都有,所以不会
# 出现「一边一批进程」,也不会为了某台机器悄悄换一根轴——换轴是最大的误读入口。
# 显存**曾经**不画成轴,画成点外面那圈光晕的面积;下面那块墓碑说了它为什么走。
# ⚠️ **墓碑:`top-plot-halo` 没了,2026-09-08。** 它写的是「光晕 = 显存 · X 是
# Ypx」——那圈环编码的是显存,而环撤掉了(理由见 `MachineCard` 里那块墓碑:
# 显存在两台真机上每一行都是 null,而环有「不画」这一档、点没有)。
# 第三个量现在是点自己的面积,两页共用下面那一句 `plot-area-is`。
# ⚠️ **墓碑:`top-plot-x`(「横」)和 `top-plot-y`(「纵」)没了,没有替代键。**
#
# 它们是那两行选择器左边的引导词——「横 CPU 内存 显存 时长 · 纵 …」。
# 2026-09-05:「散点图搞成带X和Y label的。通过点击label,去切换X或y的值」,
# 于是那两行整个撤掉,选择器变成**印在轴上的那一个词**(`components/PlotControls`)。
#
# **一个印在横轴底下正中的词不需要再说自己是「横」的**——它站的位置就是那句话。
# 留着这两个键会让人以为标签是「横 CPU」两个词,而它是一个。
# 每根轴末端印的那把尺。**必须印,不许省。** 这块图的两根轴不是一律平方根:
# 一个量的最大值比它的中位数大出 **44 倍**时,平方根也压不开,那根轴就换成对数
# (判据在 `Scatter` 用的 `ruler`)。44 不是随手挑的:平方根下一个比值 R 把中位数
# 放在轴的 1/√R 处,所以 R > 44 正好是「半数点挤在前 15%」那句话。
#
# ⚠️ **这里原先写的是「大出两个数量级以上」,那是假的——代码里从来是 44,不是
# 100。** 一句读起来很有道理的话,把判据说宽了一倍多,而它谁都挡不住:没有任何
# 东西会因为这句话不对而变红。2026-09-08 更正。
#
# ⚠️ **而 44 本身是个代理量,它看不见的形状是「两坨」。** 同日在守门那份 fixture
# 上量过:内存那根轴 max/median = 36.9(<44,判健康),而它选的平方根尺把 23 个
# 点里 **11 个压进了轴的前 15%**——正是这条规则要防的那件事。中位数落进上面那坨
# 时,拿它当分母就看不见下面那坨。**没有任何守门量过那 15%**:守门量的是「两把尺
# 都够得着」和「刻度不重名」,所以它一直是绿的。真机上的拥挤度还没人数过。
#
# 而换不换是**按这台机器这一列的数据**定的——同一对轴在两台机器上可能不是
# 同一把尺,于是「同一个位置」在两台机器上意思不同。
#
# 把尺印在轴上,是这件事唯一诚实的出路:读的人一眼看得见自己在读哪把尺。
# 两个都印,不是只印换了的那个——只印异常的那个,等于要求读者知道「没有标记
# 就是平方根」,而那是一条没人教过他的规矩。
top-plot-sqrt = "√"
top-plot-log = "log"
# 有几行画不上去。**必须印,不许省。** 显存和时长这两个量不是每个进程都有
# (实测:Mac-mini 和 hinton 上 200 行**没有一行**有显存读数,turing 上只有 3 行),
# 而「没读到」不能画在 0 那个位置——那会把「没看到」变成「最小的那个」,正是这块
# 图一直在防的邻居值错误。所以那些行**不画**,而不画了多少必须说出来:一张
# 少了三分之二个点的图,和一台闲着的机器长得一模一样。
top-plot-off = "{0} 行没有这两个量的读数，没画"
# 进程表里那**一列**的名字。2026-09-04:「表的进程和命令合并为一列,就叫命令」。
# 之前是两列 —— `top-name`(「进程」)加这一列(「命令行」)—— 而它们说的是一件事的
# 两半:那个识别词只有**挨着它区分的那个名字**时才有意义(三行都写着 `python3`,
# 靠 `api_server` / `train.py` / `worker` 分开)。中间隔一条列边,第二半读起来
# 就成了关于这个进程的另一个事实。
#
# **`top-name` 随之撤掉,没有替代键**:合并之后它没有任何落点,留着会让人以为
# 还有一列叫「进程」。
#
# 「命令」不是「命令行」:线上过来的 `arg` 是**一个识别词**不是一整条 argv
# (`khor_core::TopRow::arg` 写着为什么),叫「命令行」是许诺了一个这一列给不出的
# 东西。
top-cmd = "命令"
# 折叠起来的那一行右边那个计数。**同名、同识别词、同用户、同父进程**的若干个进程
# 折成一行(2026-09-05:turing 的表里十行都是 `tokio-rt-worker serve`),这个数说的是
# 「这一行代表几个」。按一下列出成员,再按一下折回去。
#
# **`×` 不是乘号是「个」**:这一行不是一个进程的十倍,是十个进程的一行。
top-fold = "× {0}"
top-time = "时长"
# **累计烧掉的 CPU**,和它左边那个「时长」是一对,而这一对最容易被读成一件事
# (2026-09-05:「列太少了,不饱满」那一批加的四列之一)。
#
# 分界在**谁的秒**:「时长」是墙上的钟走了多久,「CPU时间」是这个进程占着核心
# 烧了多久。一个进程占四个核,它每过一秒就烧掉四秒——所以**这个数可以比时长大**,
# 而且经常大。看见 CPU时间 比时长长不是 bug,是多核。
#
# 名字里带「CPU」不是啰嗦:去掉之后两个列头都叫「时间」,而这一列存在的全部理由
# 就是它和另一列不是同一个时间。
top-cputime = "CPU时间"
# **这个进程从起来到现在一共读写了多少字节**(读 + 写,两个数加起来)。
#
# **是「从它起来到现在」,不是「刚才这一小会儿」**:后者要除以一个谁也说不清的
# 窗口(本机 5 秒、远端 20 秒、CLI 一次性那档又是另一个数),一个没有窗口的字节数
# 不是事实。总量有明确的起点,而它左边就是「时长」——想要速率的人自己除。
#
# **空着的格子不是零。** 在一台多人的机器上 khor 读不到别人的进程的这个数
# (Linux 的 `/proc/<pid>/io` 只有属主看得见,macOS 那个调用也拒绝别人的进程),
# 而库在这两种情况下都回一个 **0**,不是错误。所以采集侧先按属主判要不要读
# (`khor_node::top::io_readable`),读不到就空着——一个「0 B」会把「我看不到」
# 说成「它不碰盘」。
top-io = "读写"
# 进程现在在干什么。**三个平台各说各的话,这里收成一套词**,而映射写在
# `khor_node::top::status_token` 一个地方——不是散在几处 `if`。
#
# **这一列最大的风险不是词不准,是它把「读不到」说成「运行」。** sysinfo 自己就
# 栽在这上头:macOS 上 BSD 的 `p_stat` 对大半个机器都报 SRUN,库知道这一点、也
# 写了一段用线程状态去纠正它的代码——而那段代码调用的参数是错的,失败之后**兜底
# 造了一个「Running」**。2026-09-05 实测:对同一批 195 个 pid,库说 `run` 的有
# 156 个在 `ps` 那里是 `S`(睡着),而两边都说 running 的**一个都没有**。
# khor 因此在 macOS 上另问了一次「有几个线程真在核上」(`mac_running`)。
#
# **对不上的变体不许吞成「运行」**:采集侧的 match 是穷举的,sysinfo 哪天多一个
# 变体,那个文件**编译不过**——这条规矩由编译器守着,不由谁记着。真遇上没有名字
# 的状态,它带着号码原样过来(`unknown-13`),脸上照印,不借别人的词。
top-status = "状态"
# 一套共同词汇。**每个词只说一件事,而且和邻居分得开**——「已退出」和「僵尸」都是
# 死了,分界是**父进程收没收**;「等盘」和「休眠」都是在等,分界是**叫不叫得醒**。
#
# **「闲置」和「新建」是同一个 sysinfo 变体在两个平台上的两件事**:Linux 的 `I`
# 是一个闲着的内核线程,macOS 的 `SIDL` 是**一个正在被 fork 出来的进程**。
# 合成一个词就是凭空造一个两边都不成立的事实。
top-st-run = "运行"
top-st-sleep = "休眠"
top-st-idle = "闲置"
top-st-spawning = "新建中"
# Linux 的 `D`:在等盘,而且**叫不醒**——机器发木的时候要找的就是这一行。
# macOS 把同一件事报成另一个变体名(见 `status_token`),收到同一个词下面。
top-st-diskwait = "等盘"
top-st-dead = "已退出"
top-st-zombie = "僵尸"
top-st-stopped = "已暂停"
top-st-tracing = "被调试"
top-st-parked = "停驻"
top-st-wakekill = "待唤醒"
top-st-waking = "唤醒中"
top-st-suspended = "已挂起"
top-st-lockblocked = "等锁"
# macOS 专有的一档:那台机器连「有没有线程在核上」都不肯说(通常是别人的进程)。
# **它不是「运行」也不是「休眠」**,而这一档存在的全部意义就是不让它变成那两个
# 里的任何一个——那正是库犯的错。
top-st-unclear = "未知"
# 抽屉的小标题右半:这一组有几样东西。**是数量不是读数**——读数在上面那个环里,
# 这里回答的是「这个环底下有几张卡 / 几个卷 / 几个占用者」。卷用这个键,卡和核
# 复用已有的 `gpu-sub-nomem` / `cores-sub`。
#
# **这两个键是一副对子,分界在语法上**:`vols-sub` / `gpu-sub-nomem` 是一个**光秃
# 的计数**(「3 卷」),数完了这个环就没别的了;`procs-sub` 前面挂着一个**限定语**
# (「占用最多的 6 个进程」),它自己就说了这是从几千个里挑出来的前几个。一张卡、
# 一个卷是机器的**零件**,读数加起来就是上面那个环;一个进程只是**占用者**,前几个
# 加起来**不等于**那个环。(`Vitals` 里没有 per-core 数组、也没有内存分解,所以这两
# 个环底下能诚实摆出来的只有「谁占得最多」,不是「它由什么构成」。)
#
# 这件事**以前是靠抽屉底下一句脚注说的**——「占用最多的几个,加起来不等于上面那个
# 环」。用户判它「很蠢」,撤掉了。撤掉的是那句道歉,不是那个事实:事实挪进了小标题
# 的语法里,所以它现在**不占一行、也不会在读完之后还杵在那儿**。守门盯的正是这条
# 分界(`check-face` 的「a drawer of occupants says so in its heading」):把限定语从
# `procs-sub` 拿掉、或者给 `vols-sub` 也加一个,两边都会红。
vols-sub = "{0} 卷"
# CPU 与内存那两组的数量词:抽屉里是占用者,所以数的是进程条数,不是零件个数。
procs-sub = "占用最多的 {0} 个进程"
# 抽屉里还有多少没露出来。**只在真的还有的时候出现**:四张卡正好装得下时不出现,
# 拖到底也消失——**一句常驻的提示等于没有提示**,它会变成小标题的一部分而不是一个
# 状态。**这个条件仍然是量出来的**(数出真的被下沿切掉的行),改的只是措辞。
#
# 措辞里**不再报那个数**。报数的版本是「还有 {0} 个在下面,拖一下」,用户判它
# 「很蠢」:那个数没人拿它做任何事——看见有就往下滑,是 3 个还是 7 个不改变下一步
# 动作,而它每多一个数就多一处要和列表对齐的地方。留下的是动作本身。数还在
# `data-drawer-more` 上,守门量的是它,所以「什么时候出现」照旧守得住。
drawer-more = "下滑查看更多"
# The band under the CPU ring: a day of five-minute buckets.
top-day = "最近 24 小时 CPU"
# How old the reading is. **Printed on every reading that is not this
# machine's own**, because a number with no age is read as the present:
# a machine that has been off since yesterday would otherwise show
# yesterday's CPU as if it were now (docs/SESSION.md 离线).
vitals-taken = "{0}前的读数"
# Which khor that machine runs. Said only when it is known: a machine
# whose khor predates the field says nothing here, and that silence is
# itself the answer an upgrade sweep is looking for — the same rule the
# GPU follows one line up.
vitals-version = "khor {0}"
# Never reached since this khor started. Not the same as an old reading,
# and not 「0%」 either — those send a person to look at different things.
vitals-never = "尚未获取"
# Tokens spent, one day at a time (khor_core::Tokens). **Four numbers and
# no total**, because on this machine the cached reads outnumber the
# output five hundred to one: a sum would be almost entirely cache and
# would move with how often a conversation was resumed rather than with
# how much work was done.
#
# 「缓存」 is the vendors' own billing vocabulary, printed on their own
# dashboards — it is the domain, not khor's implementation, so it is not
# the 「不解释实现」 rule being broken. What the two cache words are for is
# the question 「输入」 raises on its own: why is it so small.
tokens-input = "输入 {0}"
tokens-cached = "读缓存 {0}"
tokens-cache-write = "写缓存 {0}"
tokens-output = "输出 {0}"
# Said when a machine has spent nothing in the window being shown. Not an
# empty listing: a machine that answered 「nothing」 and a machine that was
# never asked are different things, and only one of them is news.
usage-none = "近几天没有花费"
# Never reached since this khor started — the same third state the
# readings have, and the same reason it needs its own word. It cannot
# borrow the readings' 「还没问到」 either: same fact, different question,
# and the catalog refuses two names for one text by design.
usage-never = "尚未获取这台机器的用量"
# How old the answer is, said on every one that is not this machine's
# own. Without it a stale answer reads as the present.
usage-taken = "{0}前的用量"
# Records khor found and could not read. Said only when non-zero: a
# vendor reshaped a file khor reads, and the totals above are therefore
# missing something. Zero and silence mean the same thing; a non-zero
# count and silence do not.
usage-unreadable = "有 {0} 条读不出来，总数少算了那些"
# The model row for tokens whose own file never said which model spent
# them (`khor_core::UsageModelDay::model` is `None`).
#
# **It says the file did not record it, not that khor did not recognise
# it** — those are two different sentences and only one of them is true
# here. A record khor cannot make sense of is counted by
# `usage-unreadable` above and never reaches this row, so 「读不出来」
# would be claiming the neighbouring failure.
#
# It has to be a word rather than a blank because these tokens are real
# and are inside the totals: dropping the row would hand whoever draws
# percentages a denominator quietly missing them
# (`khor_core::UsageModelDay` states that as a property).
#
# **The face is meant to use this key rather than grow a `gui` twin.**
# Two names for one text is what `build.rs` refuses inside a section and
# what drift looks like across two — and this word answers the same
# question on both screens.
usage-model-unnamed = "未记录模型"
summary-sent = "摘要已发，等对方许可。传输号：{0}"
