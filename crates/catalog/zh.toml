# error of this person's.
chat-refused-turn-in-flight = "另一扇窗正在说话,刚才那句没发出去,还给你了"
chat-refused-no-turn = "现在没有在跑的轮"
# A mode or an option the agent would not take (`refused::SETTING_REFUSED`).
