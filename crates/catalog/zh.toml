[gui]
sessions-tab = "会话"
devices-tab = "设备"
# The other two landings. Both list machines today — files is "which
# machine do I go looking on", browser is "whose network am I borrowing"
# — and each grows its own content when that batch lands. The names are
# the destination, not what is currently painted there.
files-tab = "文件"
browser-tab = "浏览器"
settings = "设置"
back = "返回"
from-device = "来自 {0}"
pick-a-session = "选一个 session"
empty-sessions = "还没有 session"
backend-unreachable = "够不着本机的 khor"
# The pane bar. No page carries a title (docs/UX.md); the pane's name
# lives in an aria-label, and what shows is the work you can do here.
search-sessions = "搜索会话"
# Also the label on the files and browser panes, because those panes
# list machines too. A key of their own reading "搜索文件" would name
# something the box cannot find — and a second key with this same text
# is a build error by design (one text, one name).
search-devices = "搜索设备"
filter = "筛选"
# How the list is laid out. One heading and four choices, sharing the
# filter's menu because both answer "what am I looking at" — the
# difference is that ticking words removes rows and this rearranges
# them, so the choices are exclusive where the words are not.
arrange = "排布"
by-recent = "按最近"
by-category = "按类别"
by-device = "按设备"
by-state = "按状态"
new-item = "新建"
# Filtered down to nothing is not "there are none" — the two states get
# different words, or the empty list tells a lie.
no-matches = "没有匹配的"
# The row action. Two words because the button has two jobs, and the one
# it names is the one it will do next — a button labelled by its current
# state tells you what is, not what pressing it does.
pin = "置顶"
unpin = "取消置顶"
# …and what the button says when the write did not take. Two words for
# the same reason the two above are two: the one shown is about the
# action that was attempted.
#
# This exists because a failed pin used to look exactly like a missed
# click — the row simply did not move — and docs/UX.md forbids 做了但
# 没变化 and 失败 wearing one face. It is said **on the button that was
# pressed**, not in a notification: there is no place in this app that
# collects messages, and inventing one to carry a rare disk error would
# be a whole surface built for the least common thing that happens here.
pin-failed = "钉不上"
unpin-failed = "取消不了"
# The hook, on this machine's own card. Two names because the button has
# two jobs and shows the one it will do next — the same rule the pin
# follows.
install-hooks = "装钩子"
uninstall-hooks = "卸钩子"
# …and what each says when the write did not take. Same reason the pin
# has a pair of these: 做了但没变化 and 失败 may not wear one face
# (docs/UX.md), and it is said on the button that was pressed because
# this app has nowhere that collects messages.
install-hooks-failed = "装不上"
uninstall-hooks-failed = "卸不掉"
# Why anybody would press it. **完成 is the whole of what the hook buys**
# — `adaptor::claude::hook` maps SessionStart/UserPromptSubmit/Stop/
# Notification, and `Stop` is the only source of 完成 anywhere in khor
# (docs/HOOKS.md). It does **not** produce 中断: there is no State::Errored
# on that path at all, so promising one here would be a word khor cannot
# keep. Reading the disk already gives 忙碌/待批/空闲/失败.
hooks-buy-you = "装上钩子,claude 答完一轮才报得出「完成」,不装只显示成空闲"
# Which claude. The hook goes into a settings file on this machine, and
# the button only appears on this machine's card — said out loud because
# a control that silently applies to one machine out of a list is a
# control people will press on the wrong one.
hooks-are-local = "改的是这台机器上的 claude"
tell-machine = "给机器留言"
pick-a-machine = "选一台机器"
message-text = "留言"
send-it = "发出"
make-a-ticket = "出一张配对票"
join-with-a-ticket = "凭票入网"
ticket = "配对票"
paste-a-ticket = "把票贴在这里"
join = "入网"
close = "关闭"
