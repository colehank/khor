by-device = "按设备"
by-state = "按状态"
new-item = "新建"
# Filtered down to nothing is not "there are none" — the two states get
# different words, or the empty list tells a lie.
no-matches = "没有匹配的"
# The row action. Two words because the button has two jobs, and the one
# it names is the one it will do next — a button labelled by its current
# state tells you what is, not what pressing it does.
pin = "置顶"
unpin = "取消置顶"
# …and what the button says when the write did not take. Two words for
# the same reason the two above are two: the one shown is about the
# action that was attempted.
#
# This exists because a failed pin used to look exactly like a missed
# click — the row simply did not move — and docs/UX.md forbids 做了但
# 没变化 and 失败 wearing one face. It is said **on the button that was
# pressed**, not in a notification: there is no place in this app that
# collects messages, and inventing one to carry a rare disk error would
# be a whole surface built for the least common thing that happens here.
pin-failed = "钉不上"
unpin-failed = "取消不了"
# The hook, on this machine's own card. Two names because the button has
# two jobs and shows the one it will do next — the same rule the pin
# follows.
install-hooks = "装钩子"
uninstall-hooks = "卸钩子"
# …and what each says when the write did not take. Same reason the pin
# has a pair of these: 做了但没变化 and 失败 may not wear one face
# (docs/UX.md), and it is said on the button that was pressed because
# this app has nowhere that collects messages.
install-hooks-failed = "装不上"
uninstall-hooks-failed = "卸不掉"
# Why anybody would press it. **完成 is the whole of what the hook buys**
# — `adaptor::claude::hook` maps SessionStart/UserPromptSubmit/Stop/
# Notification, and `Stop` is the only source of 完成 **for discovered
# sessions** (docs/HOOKS.md; an ACP-opened session is the other
# first-hand witness — khor is the end the turn ends at, `gui_host`). It does **not** produce 中断: there is no State::Errored
# on that path at all, so promising one here would be a word khor cannot
# keep. Reading the disk already gives 忙碌/待批/空闲/失败.
hooks-buy-you = "装上钩子,claude 答完一轮才报得出「完成」,不装只显示成空闲"
# Which claude. The hook goes into a settings file on this machine, and
# the button only appears on this machine's card — said out loud because
# a control that silently applies to one machine out of a list is a
# control people will press on the wrong one.
hooks-are-local = "改的是这台机器上的 claude"
tell-machine = "给机器留言"
pick-a-machine = "选一台机器"
message-text = "留言"
send-it = "发出"
make-a-ticket = "出一张配对票"
join-with-a-ticket = "凭票入网"
ticket = "配对票"
paste-a-ticket = "把票贴在这里"
join = "入网"
close = "关闭"
# The chat input's hint. Not a label: the box is the pane's only
# control, and the hint says what typing here reaches.
chat-input = "对它说…"
# The conversation has ended — the host's goodbye and a torn wire wear
# one face on purpose (`khor_gui_core::chat::ChatBatch::gone`). Said in
# the input's place: the control that can no longer do its job is the
# one that says so, the same rule the pin follows.
chat-over = "对话结束了"
# A discovered session whose transcript could not be found or read. Not
# chat-over: nothing ended — there is simply no record to paint.
chat-no-record = "没有找到这段对话的记录"
# Ends the turn that is running. 停止 is what it does to the *turn*,
# not to the session: the agent stays, its conversation stays, and the
# next line goes on where this one left off — which is exactly 空闲's
# boundary with 失败. Sits beside the input because the input is what
# it gives back.
chat-stop = "停止"
# The way back to the tail, and what it says when something arrived
# while the reader was up in the past. One control, two words: where it
# takes you never changes, so a second control would be two buttons
# doing one thing — but "there is new text down there" and "you are
# simply not at the bottom" are two different reasons to press it, and a
# control that read the same in both would make the arrival silent.
# Both vanish at the bottom, which is what makes this able to go to zero
# (docs/UX.md 角标可归零).
chat-to-bottom = "回到底部"
chat-new-below = "下面有新的"
# Ending a session, from the pane that is showing it. **One sentence per
# kind, because 关闭 does genuinely different things** — read off the
# three `KindSurface::close` implementations rather than guessed:
#
#   live (shell/tui/gui/borrow) — `LiveKind::close_session` kills the
#     child's process group and then the host. A process stops.
#   chat — `ChatKind::close_channel` deletes the `files/` directory of
#     that device channel. The messages stay; the received files do not.
#   transfer — `TransferKind::close` deletes that transfer's payloads,
#     **and the row survives** (its summary lives in the CRDT and falls
#     back to 待批). Said out loud, because a row that stays after a
#     close reads as the close having failed.
#
# A confirm that said only "关掉它" would be true of all three and
# useful for none: the thing a person is deciding is what they are about
# to lose, and that is the part that differs.
close-warn-live = "关掉它,它正在跑的进程会停下"
close-warn-chat = "关掉它,从这台机器收下的文件会删掉,聊天记录还在"
close-warn-transfer = "关掉它,这次传下来的文件会删掉;这一行会留着"
# A kind khor has no sentence for. Kinds are an open set
# (`khor_core::kind` — new ones must appear without touching that
# crate), so this is the honest answer for one that arrives later:
# it says the part that is true of every close and claims nothing else.
close-warn = "关掉它,这一步撤不回来"
#
# **None of them promises the close will work.** Whether a row can be
# closed at all is `Node::close`'s judgment: a session khor merely
# discovered is not khor's to end, and a remote one routes to the
# machine it lives on. Refusals come back as whole sentences and those
# are what the pane shows — this face asks rather than deciding in
# advance, the same rule that keeps it from re-deriving a state.
# The id, as a thing to paste. It is not implementation leaking into the
# copy: this is the string `khor` prints and the one a person hands to
# another machine, so it is the row's public name and worth a control.
# Three words for one button, the pin's rule — the one shown names what
# just happened, so a copy that silently did nothing cannot pass for a
# copy that worked.
copy-id = "复制 id"
copied = "复制好了"
copy-failed = "复制不了"
# The files pane. 上一级 is a place to go, not a "back": the list on
# the left never left, so the only direction this pane owns is up the
# tree. An empty directory says so — silence would read as broken.
up-dir = "上一级"
empty-dir = "空目录"
# The row action, and its two ends. The landing is said because the
# place (下载目录) was chosen silently; the failure wears its own words
# on the row that was pressed (the pin's rule — this app has nowhere
# that collects messages).
take-file = "拉过来"
took-file = "落在 {0}"
# The files landing before a machine is picked: the pinned shortcuts.
# Empty says what would be here — a blank region reads as broken, and
# this one has no machine list to explain it.
no-pinned-dirs = "还没有钉住的目录"
# The browser landing (docs/NET.md 借网). The address bar names the exit
# so the user knows a page opened here leaves through that machine, not
# this one. Open builds the window; the empty state and the no-pins state
# each say what would be there.
web-address = "网址,从 {0} 的网开"
web-open = "打开"
web-opening = "正在借 {0} 的网开…"
web-opened = "在 {0} 的网里开了"
no-pinned-webs = "还没有钉住的网页"
pick-exit = "从左边挑一台机器,借它的网上网"
# The terminal ended — the host's child exited or the connection tore.
# Both are one fact to a face (docs/handoff 终端画屏).
term-over = "这个终端结束了"
# The two faces of a hosted agent session (会话行改版批): its live
# terminal, or the recorded conversation read from the vendor's own
# transcript. Nouns, not verbs — they name what the pane shows.
view-terminal = "终端"
view-chat = "对话"
