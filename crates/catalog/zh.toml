sat-no-ssh-host = "{0} 是卫星，但表里没有它的 ssh 地址；在 sponsor 那台上重新 adopt 一次"
# The file push needs the sponsor's own scp; said with the sponsor's
# name so the person knows exactly which machine to walk to (一期单
# sponsor 的单点语义,说破不绕).
sat-send-elsewhere = "{0} 是经 {1} 说话的卫星；发文件要在 {1} 那台上 khor send"
