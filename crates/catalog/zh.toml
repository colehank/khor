# 墓碑(2026-09-07):这儿原来有 `accounts-read-by`「读数」。
#
# **它是事实栏里那个 dt 标签,而读数搬到卡头右上之后没有标签可挂了**——
# 机器卡那一行也不带标签,就是「Khor 0.1.14 · 12 秒前」。撤的是标签,
# 不是那件事:下面两句话原样活着,只是换了座位。
# 列表行右端那一格,轮到「这一次就是现在读的」时的词(2026-09-07)。
#
# **不能用 `card-age` 拼**:`card-age("0 秒")` 得到「0 秒前」,而那是**一个假的精确**
# ——它读起来像一次刚好落在整秒上的测量,实际是"这一次就是现在读的"。这两件事在这个
# 产品里已经分过一次:`Quota::as_of` 的 `None` 意思是「就是这一次读的」,不是「零毫秒
# 之前」。同一条判断,所以同一个词。
#
# **也不用 `accounts-read-here`「这台机器刚读的」**:那句 77px,在 288 宽的一栏里把
# 行名挤断了(实测),而且它说的是「谁读的 + 多久以前」——那是**卡头**那一格的活,
# 行上再说一遍就是同一个事实在一屏里说两处。
accounts-just-now = "刚刚"
accounts-read-here = "本机刚刚读取"
accounts-read-from = "{0} 读取于 {1}前"
# 这两句 2026-09-07 从账户事实栏搬到了**卡头右上**,和机器卡放同一件事的
# 那个座位对齐。
#
# **2026-08-28 那条撤掉读数年龄的判词没有被推翻,是被形状取代了**:当时它是
# 一个数底下的一句小灰字,撤得对;2026-09-06 机器卡长出了那个座位之后,
# 一张卡说读数多老、另一张不说,就成了两张卡对「年龄算不算事实」给两个答案。
#
# **`card-version`「Khor {0}」故意没有抄过来**:那半说的是这台机器上的 khor
# 是哪个版本,而额度卡背后不是一台 khor,是一个厂商的读数。两张卡对齐的是
# **座位**和「多久以前」那件事,不是那两个键。
# 账户行右键菜单:置顶、删除、编辑——头两项和每条侧边栏一样(docs/SHELL.md 第二轮)。
# 墓碑:删除这一项曾经自己叫「撤掉」,理由是「撤掉一份登记和让一台机器离开网络
# 不是同一件事,所以两个词」。用户 2026-09-21 推翻:**词统一,不同写在确认那一句
# 里**——两句确认本来就不复用,那条区分一直是由它们在守。
# 两次按之间那句。**照实现写的,不是照感觉**(`Node::remove_account`):
# 描述在复制的 doc 里,所以每台机器都不再有它;而密钥只 `remove_file` 本机
# 那一份——**从别的机器撤,那台的密钥还在它自己的盘上**。
#
# 那个不对称必须说出来:吞掉它,人会以为撤了就干净了——「一档接不上不会变成
# 没有值,它会变成旁边那一档」,这里旁边那一档是「撤了就干净了」。
#
# **长度是量出来的,不是估的**(2026-09-07,1400 宽的屏,12.5px/18px):
# 机器行那句 16 字、单行天然宽 191px,而它那个菜单给标签的内容宽正好 191px
# ——**一行,富余 0px**。这句原先 26 字,天然宽 241px,而这个菜单已经顶到
# `max-width: 256px`、给标签 230px,所以它排两行。
#
# 两个读数互相印证:去掉上下 padding 之后的高度(18px = 一行 / 36px = 两行),
# 和「天然宽 vs 可用宽」——两条独立的路给同一个答案。**一行的上限是 230px,
# 中文在这个字号下约 12.05px 一个字,所以 19 字是天花板。**
#
# 同一个位置两种行数,读起来会像其中一句更重要。**不对称那一层一个字没减**
# ——减的是把它说满的那些字;「得去它那台删」比「只在存着它那台上才一起删掉」
# 少六个字,而它多说了一件能照着做的事。
#
# **不复用 `forget-machine-confirm`**(2026-09-07 领队裁):离开网络和撤掉一份
# 登记不是一件事,一句话套两处,其中一处一定读起来不对。
