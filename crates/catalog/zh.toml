# 网关卡事实栏:这把令牌什么时候不能再用了。
#
# **不复用「重置」**(2026-09-07 领队批,理由成立且重要):重置是**一个窗口自己
# 回满**——它还会再来;到期是**这把令牌作废**——它不会再来。一个能同时解释两档
# 的词是一块布,会掩护跟它相邻的错误。
#
# **永不过期的令牌这一行整个不画**:端点用 `0` 表示永不过期(库里存的是 `-1`,
# handler 应答前改写过一次),而这两个数直接解析都会画出 1970-01-01——
