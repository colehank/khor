# 主页按开一台机器的卡片之后,四个计数的头一个:这台机器上一共几个 session。
#
# **原来挂在地图外面那颗「会话」节点上**——一颗代表整张网的节点,按开是全网四个
# 计数。2026-08-28 用户判:「会话是在机器节点点击后看的,不是在地图外面」,于是
# 四个计数搬到了机器卡片里,按 `SessionRow::home` 只算这一台的。这个词没变,
# 它的分母从「全网」变成了「这台」——**而它本来就只说「全部」,不说全部的是谁**,
# 这正是它当初不复用 `sessions-tab` 的那条理由在另一头兑现。
#
# **不复用 `sessions-tab`(会话),而这是一次刻意加词。** 那个键是导轨上那一站
# 的名字;把它贴在一个数字前面,「会话 6」读起来像「会话那一站,6」,而它要说的是
# 「这 6 个是全部」。后面三个标签是 `state` 里的状态词(忙碌/待批/完成),
# 头一个不是状态,它是那三个的分母——**一个词干两件事,正是这一节
# 「两个键不许共用一句话」防的那件事的镜像**:同一句话不许两个名字,而同一个
# 名字也不该被两个位置借去说两件事。
sessions-all = "全部"

# 墓碑(2026-08-28):这儿原来有 `usage-earlier`(更早)和 `usage-vs-peak`
# (条长 = 和最忙的一天比)。两个词都只服务主页右栏那本日账,而主页只剩
# 地图和额度环了(用户原话:「Khor 主页不显示输出 token 什么的」),日账
# **有意没在 GUI 里另找落点**——「还能用多少」是额度环答的,「花了多少」
# 是 `khor usage` 答的。词跟着落点走:留一个没人查的键,下一个人会以为
# 界面上还有那块东西。
#
# 新标签页上,把一条最近去过的记录送走。**动词是「去掉」不是「删掉」**:
# 账本里它是个墓碑而不是一次删除(`khor_sync::recents`),再去一趟那个地方
# 它自己就回来了——所以这句话不许听起来像那个目录没了。
#
# 段名由调用方递进来({0} 是「最近去过」那个标题),而不是写死在这句里:
# 两个浏览型落点共用同一个标题键,写死就是第二份出处,而且第三个落点接上来
# 的时候它会静静地指错列表。**这也是它不复用 `remove`(「去掉」)的原因**:
# 那个词在补全菜单和状态条上说的是「拿掉这一条」,而这一行旁边就写着一个
# 真实的目录路径,单说「去掉」的读法里有一个是「把那个目录去掉」。
forget-place = "从{0}里去掉"
# The terminal's own search (⌘F while it has the keys): where in the
# scrollback a word is. 终端 names the surface the way `search-sessions`
# and `search-devices` name theirs; the count beside the field is two
# numbers and needs no words, and an empty answer is the lists' own
# `no-matches`.
search-terminal = "搜索终端"
# The two steps through what was found, named for the direction. ⏎
# and ⇧⏎ do the same from inside the field.
match-prev = "上一个"
match-next = "下一个"
