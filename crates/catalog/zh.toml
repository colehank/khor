# ── borrowing a machine's network (docs/NET.md 借网) ──
# The tunnel carries raw bytes to a target the exit machine can reach.
# Its refusals: an oversized target header is a malformed dialer; a
# target the exit cannot connect to is the far net's answer, not ours.
tunnel-target-too-long = "要连的地址太长了"
tunnel-bad-handshake = "隧道握手读不了: {0}"
tunnel-bad-status = "隧道回了个不认识的状态: {0}"
tunnel-no-route = "出口连不上要去的地方: {0}"
# The borrow row's title, and why a borrow needs a running serve: the
# proxy is long-lived, so it must live in the process that holds the key.
borrowing-title = "借 {0} 的网"
borrow-needs-serve = "借网要 serve 在跑(代理口得住在常驻进程里)"
# Same shape, same reason: the pipe to another machine's terminal lives
# in the resident process, so a one-shot verb has nowhere to put it.
reach-needs-serve = "接别台机器的终端要 serve 在跑(管子得住在常驻进程里)"
# Leaving is one act and the whole network learns it, the same way
# joining is (docs/SHAPE.md 接入一次即在网里). The second sentence is the
# way back, said here because the machine being removed is usually the
# one that cannot be told anything. It names *any* machine still in the
# network on purpose: the tombstone travels, so "one that still knows
# it" is a place that stops existing.
forgot = "请出去了: {0}。要它回来:在网里任一台上 khor invite,拿票到它那台上 khor pair"
# You cannot show yourself the door: the table this would be written into
# is the one being left, so the act has no meaning from the inside.
cant-forget-self = "这是本机——一台机器不能把自己请出网"
# The GUI asks for a reach from a synchronous door, so the async call
# runs on a thread of its own; if that thread dies there is no answer to
# report and no exception to quote — only the fact that none came.
reach-thread-died = "接终端的那一趟没回来"
# Same shape as the reach above, for the drop that carries files to
# another machine before it can paste anything.
deliver-thread-died = "送文件的那一趟没回来"
# The files got there — this is the receiving machine not saying where
# they landed, which is what a khor from before that field on the wire
# answers. Named as the far machine's age rather than as a failure,
# because retrying here changes nothing and the person's next move is
# on that machine, not this one.
landed-unsaid = "文件送到了,但那台机器没说落在哪(它的 khor 比这台旧),所以没有路径可粘"
# What the keeper writes about a death it watched. A process killed by a
# signal writes nothing itself — only something standing outside can say
# how it went, which is the keeper's whole reason to exist. Timestamped
# because this line lands in a log read hours later, beside lines from
# other lifetimes (账本: 报故障要带时间戳).
serve-died-restarting = "[{0}] serve 死了({1}),{2} 秒后再起"
died-with-code = "退出码 {0}"
died-by-signal = "信号 {0}"
died-unreadably = "死因读不出来"
# A generation change, watched from the same vantage point. The versions
