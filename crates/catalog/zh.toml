# pasting it somewhere shared hands the editor over, the same way
# `khor web` 's link does.
code-at = "{0}\n  （{1}；链接里带密钥，别贴进会同步的文档。收摊：khor code --stop）"
code-stopped = "关了 {0} 上的 VS Code"
# Said before the wait, not after it. **The CLI does not ask** — its
# precedent is `close` and `forget`: typing the verb is the
# confirmation, and the GUI is where a click is cheap enough to deserve
# a second look (`fn forget`). What it owes the person is the sentence,
# because the alternative is ten silent minutes and 640 MB of somebody
