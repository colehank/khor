# about the agent's answer, not about anything having broken here.
chat-refused-setting = "这一项 agent 没收,还是原来那样"
# Ending a session, from the pane that is showing it. **One sentence per
# kind, because 关闭 does genuinely different things** — read off the
# three `KindSurface::close` implementations rather than guessed:
#
#   live (shell/tui/gui/borrow) — `LiveKind::close_session` kills the
#     child's process group and then the host. A process stops.
#   chat — the `ChatKind` close records a put-away watermark: the row
#     leaves the list and the next message brings it back, history and
#     received files untouched (chat 收起批 — the sentence must promise
#     the return, or a vanishing row reads as a deletion).
#   transfer — `TransferKind::close` deletes that transfer's payloads,
#     **and the row survives** (its summary lives in the CRDT and falls
#     back to 待批). Said out loud, because a row that stays after a
#     close reads as the close having failed.
#
# A confirm that said only "关掉它" would be true of all three and
# useful for none: the thing a person is deciding is what they are about
# to lose, and that is the part that differs.
close-warn-live = "关掉它,它正在跑的进程会停下"
# chat 收起批 rewrote this again (传输并入对话批 had it down to "costs
# nothing", which described a close that visibly did nothing — the one
# face docs/UX.md forbids). Now the sentence carries the two facts a
# person needs before pressing: the row will leave, and leaving is not
# losing — it comes back with the next message, ledger intact.
close-warn-chat = "关掉它,这行先收起;历史和收下的文件都留着,它再来消息就回来"
close-warn-transfer = "关掉它,这次传下来的文件会删掉;这一行会留着"
# A kind khor has no sentence for. Kinds are an open set
# (`khor_core::kind` — new ones must appear without touching that
# crate), so this is the honest answer for one that arrives later:
# it says the part that is true of every close and claims nothing else.
close-warn = "关掉它,这一步撤不回来"
#
# **None of them promises the close will work.** Whether a row can be
# closed at all is `Node::close`'s judgment: a session khor merely
# discovered is not khor's to end, and a remote one routes to the
# machine it lives on. Refusals come back as whole sentences and those
# are what the pane shows — this face asks rather than deciding in
# advance, the same rule that keeps it from re-deriving a state.
# The id, as a thing to paste. It is not implementation leaking into the
# copy: this is the string `khor` prints and the one a person hands to
# another machine, so it is the row's public name and worth a control.
# Three words for one button, the pin's rule — the one shown names what
# just happened, so a copy that silently did nothing cannot pass for a
# copy that worked.
copy-id = "复制 id"
copied = "复制好了"
copy-failed = "复制不了"
