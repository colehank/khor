# 「5 小时」是它管的那段时间,不是一个还剩多久的倒计时。
# **「窗口」这两个字是量出来的。** 圈下原本写「5 小时」,再下一行写
# 「4 小时后重置」——两个时长挨着,一个是窗口有多长、一个是还剩多久,
# 而字面上分不出哪个是哪个。加上「窗口」,这句就只有一种读法。
quota-five-hour = "5 小时窗口"
quota-seven-day = "7 天窗口"
quota-seven-day-sonnet = "7 天 Sonnet 窗口"
quota-seven-day-opus = "7 天 Opus 窗口"
