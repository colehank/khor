# Three answers to one miss, because a miss has three causes and they
# call for three different next moves. `no-such-transfer` is the one
# with nothing pending behind it — a live session id handed to accept, a
# mesh of one. The other two are what a miss means on a machine with
# peers, and they were the same sentence until 2026-08-27: accept
# refused an id that had merely not been replicated yet with the words
# for an id that does not exist, so the only way through was to guess
# which one had happened and run it again ten seconds later.
#
# The line between them is not wording, it is the outcome of one full
# sync round: every machine answered and it is still missing = it is
# missing; somebody did not answer = khor does not know, and 不知道 may
# not be painted as 没有 (docs/SESSION.md 离线不是第七个词, same rule).
no-such-transfer = "没有这个传输：{0}"
transfer-absent-after-sync = "没有这个传输：{0}（网里每台机器都同步过一轮了，这个号多半是错的）"
transfer-not-synced-yet = "这笔传输尚未同步到本机：{0}；有 {1} 台机器无法联系（{2}），它可能还在那边"
wrong-recipient = "这个文件是发给 {0} 的，不应由这台机器接收"
not-a-file-path = "这不是一个文件路径：{0}"
# 删不掉 (工作区批④). **One key for every reason**, unlike the pairs
# above that split a refusal by whose fault it was: here the operating
# system's own words are the whole of what anybody can act on — it does
# not exist, it is somebody else's, the disk is read-only — and khor has
# nothing to add to any of them.
cant-remove = "无法删除 {0}：{1}"
cant-canonicalize = "无法解析这个路径：{0}"
# 新建 / 改名撞上一个已经有的名字 (工作区第五轮). **One key for both
# verbs**, unlike `cant-remove`'s neighbours: 建不了 and 改不了 differ in
# what the person was doing, and this one does not — the name is taken,
# and the next move is the same either way (换一个名字). Said before
# anything is written, because `std::fs::rename` would have overwritten
# it silently and answered 好了.
name-taken = "名称已存在：{0}"
# 建不了目录 (工作区第五轮). `cant-remove`'s rule, from the other end:
# the operating system's own words are the whole of what anybody can act
# on. **Only ever one directory** — the parent missing is one of those
# words, not a reason to go and make it.
cant-mkdir = "无法创建目录 {0}：{1}"
# 改不了名 (工作区第五轮). Names the path as it was, not as it was going
# to be: the thing still on the disk is the one a person can go and look
# at, and the new name never existed. **Not `cant-rename`**, which is the
# document store's own key for a file it could not move into place — one
# word, one meaning (docs/UX.md 语料库), and a sync landing failing is
# not somebody's file getting a new name.
cant-move-name = "无法重命名 {0}：{1}"
# 这台机器上没有开启器 (工作区第五轮，路径与网址可点). **Names the
