#
# **它当初是这批里唯一「非画不可」的一行**,理由不是排版:那份凭证是为了让
# claude 跑才存下的,khor 拿它回答第二个问题,是把它被给予的用途撑宽了——
# 而用户 2026-08-21 认下这件事时,**认的前提就是它看得见**。
#
# 2026-08-28 同一个人撤掉了那个前提:「那个小字就不要了」。**是他的凭证、
