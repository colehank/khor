[package]
name = "khor-gui"
version.workspace = true
edition.workspace = true

# Mobile targets later need staticlib/cdylib; rlib keeps the bin linking.
[lib]
name = "khor_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
khor-gui-core = { path = "../core" }
khor-node.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# macos-proxy: a borrow opens a webview window whose traffic goes out
# through another machine, which needs per-window proxy_url (docs/NET.md
# 借网). macOS 14+ only; the other platforms' proxy paths are on the
# ledger (platform batch).
tauri = { version = "2", features = ["macos-proxy"] }
