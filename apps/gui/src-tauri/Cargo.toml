[package]
name = "khor-gui"
version.workspace = true
edition.workspace = true

# Mobile targets later need staticlib/cdylib; rlib keeps the bin linking.
[lib]
name = "khor_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
khor-gui-core = { path = "../core" }
khor-node.workspace = true
# The browser face, started beside the embedded serve. The app is the
# resident on a desktop that has one, and a face that only `khor serve`
# could raise would be absent on exactly the machines somebody sits at.
khor-web = { path = "../../../crates/web" }
# Used only by the mobile halves of the page commands, which refuse in
# words. Not target-gated: `desktop`/`mobile` are cfgs tauri-build sets,
# and cargo's `[target.'cfg(..)']` only understands real target cfgs — so
# gating the dependency the way the code is gated is not expressible.
khor-catalog.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `unstable` is for `Window::add_child`: a browsing tab's page is a second
# webview parented to this window, because khor's own interface is already
# a webview and a site cannot be put inside it (docs/NET.md 借网).
tauri = { version = "2", features = ["unstable"] }
# The native file picker behind 发文件 (GUI 发文件批). The official v2
# plugin and nothing homegrown, because the one thing the desktop form
# needs is a REAL local path to hand `Node::send` — a webview's
# <input type=file> deliberately never reveals one. Rust-side API only
# (`DialogExt` inside the command): the frontend never invokes the
# plugin directly, so no JS package and no capability grant is added.
tauri-plugin-dialog = "2"

# macos-proxy is Apple-only (it compiles for macOS 14+ alone), so the
# feature is enabled only there — enabling it everywhere would break the
# Linux and Windows builds of this same app. A borrow opens a browsing
# webview whose traffic leaves through another machine via proxy_url
# (docs/NET.md 借网).
#
# **The feature is target-gated; the function is not.** Only Apple needs
# a feature for it: `tauri-runtime-wry` applies proxy_url with no target
# gate, handing it to WebKitGTK on Linux and to WebView2's launch
# arguments on Windows. Reading this gate as "borrowing is macOS-only"
# is what kept two platforms refusing a thing they could already do.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-proxy"] }

[features]
# **On by default, and that is the whole fix for the white window.**
# tauri decides at *compile time* whether the app loads `build.devUrl`
# (a vite dev server) or the embedded `frontendDist`: its build script
# sets `dev = !custom_protocol`. The tauri CLI passes this feature on
# `tauri build`; khor has no tauri CLI (zero deps — the desktop app is
# a plain `cargo build -p khor-gui`), so without it *every* build, release
# included, shipped as a dev build that dials http://localhost:1430,
# found nobody, and showed a white window that collapsed
# (2026-09-03, measured: the release binary's page was
# `/src/main.tsx?t=…` served by vite once vite happened to be up).
# Dev mode — vite with hot reload — is the explicit opt-out:
#   cargo build -p khor-gui --no-default-features
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
