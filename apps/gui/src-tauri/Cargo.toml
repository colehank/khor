[package]
name = "khor-gui"
version.workspace = true
edition.workspace = true

# Mobile targets later need staticlib/cdylib; rlib keeps the bin linking.
[lib]
name = "khor_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
khor-gui-core = { path = "../core" }
khor-node.workspace = true
# The browser face, started beside the embedded serve. The app is the
# resident on a desktop that has one, and a face that only `khor serve`
# could raise would be absent on exactly the machines somebody sits at.
khor-web = { path = "../../../crates/web" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }

# macos-proxy is macOS-only (it compiles for macOS 14+ alone), so the
# feature is enabled only on macOS — enabling it everywhere would break
# the Linux, Windows and iOS builds of this same app. A borrow opens a
# webview window whose traffic leaves through another machine via
# per-window proxy_url (docs/NET.md 借网); the other platforms' proxy
# paths are on the ledger (platform batch).
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-proxy"] }

# Only the non-macOS `open_web` refuses in a catalog word; on macOS that
# branch is cfg'd out, so the dependency would be dead weight there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
khor-catalog.workspace = true
